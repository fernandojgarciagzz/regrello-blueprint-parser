<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regrello Blueprint Parser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#f7f9fb;--surface:#ffffff;--surface2:#eef1f3;--border:#dde1e6;--border-hover:#b3bdc5;--text:#1b2024;--text-dim:#5d656c;--text-faint:#88929a;--shadow-rgb:27,32,36;--accent:#1875d8;--accent-hover:#0067c9;--accent-light:#eaf3fe;--accent-subtle:rgba(24,117,216,0.08);--green:#0f8062;--green-light:#e4f7ef;--orange:#c68006;--orange-light:#ffeed4;--glow:0 0 0 3px rgba(24,117,216,0.15);--card-shadow:0 1px 2px rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.06),0 0 2px rgba(0,0,0,.06);--card-shadow-hover:0 2px 8px rgba(0,0,0,.16),0 1px 4px rgba(0,0,0,.06),0 0 2px rgba(0,0,0,.06)}
:root[data-theme="dark"]{--bg:#0f1419;--surface:#1a2029;--surface2:#242c36;--border:#3a4350;--border-hover:#515c6a;--text:#e8ecf0;--text-dim:#8a95a0;--text-faint:#5c6670;--shadow-rgb:0,0,0;--accent:#5a9cf5;--accent-hover:#7ab4ff;--accent-light:rgba(90,156,245,0.15);--accent-subtle:rgba(90,156,245,0.08);--green:#34c77e;--green-light:rgba(52,199,126,0.15);--orange:#dda030;--orange-light:rgba(221,160,48,0.15);--glow:0 0 0 3px rgba(90,156,245,0.2);--card-shadow:0 1px 2px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.2),0 0 2px rgba(0,0,0,.2);--card-shadow-hover:0 2px 8px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.2),0 0 2px rgba(0,0,0,.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.upload-page{text-align:center;max-width:560px;width:100%;padding:40px 24px}
.logo{margin-bottom:12px}
.logo img{max-width:100%;object-fit:contain}
.upload-page h1{font-size:30px;font-weight:700;margin-bottom:8px}
.upload-page .subtitle{color:var(--text-dim);font-size:14px;margin-bottom:32px;line-height:1.5}
.upload-page .subtitle code{background:var(--accent-subtle);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:13px;font-weight:600}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--card-shadow);border:1px solid var(--border);overflow:hidden;transition:box-shadow .3s,border-color .3s}
.drop-zone{padding:48px 40px;cursor:pointer;transition:all .25s;position:relative}
.drop-zone::before{content:'';position:absolute;inset:12px;border:2px dashed var(--border);border-radius:12px;transition:all .3s;pointer-events:none}
.drop-zone:hover::before,.drop-zone.over::before{border-color:var(--accent);background:var(--accent-subtle)}
.drop-zone:hover,.card:has(.drop-zone:hover){border-color:var(--border-hover)}
.drop-zone.over{background:var(--accent-subtle)}
.card:has(.drop-zone.over){box-shadow:var(--card-shadow-hover);border-color:var(--accent)}
.drop-icon{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;transition:all .3s}
.drop-icon svg{width:22px;height:22px;color:var(--text-dim);transition:color .3s}
.drop-zone:hover .drop-icon,.drop-zone.over .drop-icon{background:var(--accent-light)}
.drop-zone:hover .drop-icon svg,.drop-zone.over .drop-icon svg{color:var(--accent)}
.drop-zone h3{font-size:16px;font-weight:700;margin-bottom:4px}
.drop-zone span{color:var(--text-faint);font-size:13px;font-weight:500}
.drop-zone input{display:none}
.status-bar{padding:0;max-height:0;overflow:hidden;transition:all .35s ease;border-top:0 solid var(--border);font-size:14px}
.status-bar.visible{padding:14px 24px;max-height:60px;border-top-width:1px}
.status-bar .status-inner{display:flex;align-items:center;justify-content:center;gap:8px}
.status-bar .status-text{font-weight:500}
.status-bar.error{background:var(--orange-light);color:var(--orange)}
.status-bar.success{background:var(--green-light);color:var(--green)}
.status-bar.loading{background:var(--accent-subtle);color:var(--accent)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.check-icon{width:16px;height:16px;flex-shrink:0}
.actions{margin-top:20px;display:grid;grid-template-columns:1fr;gap:10px;opacity:0;max-height:0;overflow:hidden;transition:all .4s ease}
.actions.show{opacity:1;max-height:200px}
.btn{padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn:hover{border-color:var(--border-hover);box-shadow:var(--card-shadow);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:var(--card-shadow)}
.btn.primary:hover{background:var(--accent-hover);box-shadow:var(--card-shadow-hover);transform:translateY(-1px)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.footer{margin-top:32px;font-size:12px;color:var(--text-faint);font-weight:500}
.footer a{color:var(--text-dim);text-decoration:none;transition:color .15s}
.footer a:hover{color:var(--accent)}
.theme-toggle{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;color:var(--text-dim)}
.theme-toggle:hover{border-color:var(--border-hover);color:var(--text);box-shadow:0 2px 8px rgba(var(--shadow-rgb),0.08)}
@media(max-width:480px){.upload-page{padding:24px 16px}.drop-zone{padding:36px 24px}.btn-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" title="Toggle theme">&#9790;</button>

<div class="upload-page" id="upload-page">
  <div class="logo">
    <img src="agentforce-ops-logo.svg" alt="Agentforce Operations" style="width:350px;margin-bottom:8px">
  </div>
  <p class="subtitle">Drop a <code>.rex</code> export to generate an interactive workflow dashboard</p>

  <div class="card">
    <div class="drop-zone" id="drop-zone">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <h3>Drop .rex file here</h3>
      <span>or click to browse</span>
      <input type="file" id="file-input" accept=".rex">
    </div>
    <div class="status-bar" id="status-bar">
      <div class="status-inner">
        <span class="status-icon" id="status-icon"></span>
        <span class="status-text" id="status-text"></span>
      </div>
    </div>
  </div>

  <div class="actions" id="actions">
    <button class="btn primary" id="btn-view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      View Dashboard
    </button>
    <div class="btn-row">
      <button class="btn" id="btn-download-html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        HTML Dashboard
      </button>
      <button class="btn" id="btn-download-txt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Text Analysis
      </button>
    </div>
  </div>

  <div class="footer">
    Regrello Blueprint Parser &middot; Salesforce Internal
  </div>
</div>

<script>
// ==============================================================
// REGRELLO .REX PARSER (JavaScript port)
// ==============================================================

const AGENT_CLASS_MAP = {
  'DOCUMENT_READER':'doc','DOCUMENT_EXTRACTION':'doc','DOCUMENT':'doc',
  'AI_AGENT':'ai','CODER':'ai','FLASH':'flash',
  'EXCEL':'excel','EXCEL_AUTOMATION':'excel',
  'TABLES':'tabular','TABULAR':'tabular',
  'GENERIC':'regrello','REGRELLO':'regrello'
};
const AGENT_TYPE_NAMES = {
  'FLASH':'Flash Agent','TABLES':'Tabular Agent','TABULAR':'Tabular Agent',
  'DOCUMENT':'Document Agent','EXCEL':'Excel Agent',
  'GENERIC':'Regrello Agent','REGRELLO':'Regrello Agent',
  'DOCUMENT_EXTRACTION':'Document Extraction Agent','UNKNOWN':'Unknown Agent'
};

// --- Canonical field-type resolution -------------------------------------
// Regrello stores the storage primitive in field.propertyType.name, but the
// real user-facing type lives on spectrumFieldVersion.validationType. Several
// product types collapse onto one primitive (Select/Multi-select/Email/Phone
// => Text, Currency => Decimal), so reading only propertyType mislabels them.
// Mirrors resolve_field_type() in rex_parser.py — keep the two in sync.
const VALIDATION_TYPE_LABELS = {
  'boolean':'Checkbox','currency':'Currency','timestamp':'Date','document':'Document',
  'email':'Email','multi-select':'Multi-select','party':'People','phone':'Phone',
  'select':'Select','signature':'Signature'
  // 'raw' omitted => fall back to the storage primitive.
};
const PROPERTY_TYPE_FALLBACK = {
  'Checkbox':'Checkbox','Date':'Date','Document':'Document','Party':'People',
  'Number':'Number','Decimal':'Number','Text':'Text','Sync Object':'Sync Object'
};
function resolveFieldType(propertyType, validationType, isMultiValued, allowedValues, fieldUnit) {
  const vt = (validationType || '').trim().toLowerCase();
  if (vt && VALIDATION_TYPE_LABELS[vt]) return VALIDATION_TYPE_LABELS[vt];
  const hasChoices = !!(allowedValues && allowedValues.length);
  const unitType = (fieldUnit && typeof fieldUnit === 'object') ? String(fieldUnit.type || '').toUpperCase() : null;
  const pt = propertyType || 'Unknown';
  if (pt === 'Decimal' && unitType === 'CURRENCY') return 'Currency';
  if (pt === 'Text' && hasChoices) return isMultiValued ? 'Multi-select' : 'Select';
  return PROPERTY_TYPE_FALLBACK[pt] || pt;
}
// Pull the validationType string off a spectrumFieldVersion object.
function sfvValidationType(sfv) {
  const v = (sfv || {}).validationType;
  return (v && typeof v === 'object') ? v.validationType : (v || null);
}

function parseFieldInstance(fi) {
  const field = fi.field || {};
  const pt = field.propertyType || {};
  const sfv = fi.spectrumFieldVersion || {};
  const allowed = field.allowedValues || sfv.allowedValues || [];
  const fieldUnit = field.fieldUnit || sfv.fieldUnit || null;
  const isMulti = !!(field.isMultiValued || fi.isMultiValued);
  return {
    id: field.id || 0,
    name: field.name || 'Unknown',
    property_type: resolveFieldType(pt.name || 'Unknown', sfvValidationType(sfv), isMulti, allowed, fieldUnit),
    is_multi_valued: isMulti,
    input_type: fi.inputType || 'UNKNOWN',
    helper_text: sfv.helperText || '',
    allowed_values: allowed
  };
}

function parseAgent(task) {
  // Try aiAgentInstance first
  const agi = task.aiAgentInstance;
  if (agi) {
    const cfg = agi.aiAgentConfig || {};
    if (cfg.id) return { id: cfg.id, name: cfg.name || 'Unknown', type: cfg.type || 'UNKNOWN' };
  }
  // Fallback: look in assignees
  for (const a of (task.assignees || [])) {
    const u = a.user;
    if (u && u.userType === 'AI_AGENT_ACCOUNT') {
      const aat = u.aiAgentType || {};
      return { id: u.id, name: u.name || 'Unknown', type: aat.v4Type || 'UNKNOWN' };
    }
  }
  return null;
}

function agentClass(task, agent) {
  if (!agent) return 'human';
  return AGENT_CLASS_MAP[agent.type] || 'regrello';
}

// The people/role field driving a task's dynamic assignee, e.g. "Buyer",
// "Quality Manager", or the built-in "Workflow owner". Regrello stores the
// controlling field under the CONTROLLER wrapper's values[].sourceField…V2.field,
// NOT on the wrapper's own `field` (which is always the generic
// "RegrelloTaskAssignees"). Returns {name, fieldType} or null; fieldType
// 'SYSTEM' = a built-in party field (Workflow owner/creator), anything else is a
// real people/role field.
function dynamicAssigneeField(task) {
  const fic = task.fieldInstancesControllingAssignees;
  if (!fic || !fic.length) return null;
  for (const ctrl of fic) {
    for (const v of (ctrl.values || [])) {
      const s = v.sourceFieldInstanceMultiValuePartyV2 || v.sourceFieldInstanceValuePartyV2 || v.sourceFieldInstanceMultiValueParty;
      if (s && s.field && s.field.name) return { name: String(s.field.name).trim(), fieldType: s.field.fieldType || '' };
    }
  }
  return null;
}

// True when a human task's assignee is resolved at runtime from a people/role
// (or system party) field, with no fixed user/team. These all share ONE
// "Human (Dynamic)" swim-lane even though each card shows its own role name.
function isDynamicHuman(task, agent) {
  if (agent || task.createsWorkflowFromWorkflowTemplateId) return false;
  for (const a of (task.assignees || [])) {
    if (a.team) return false;
    if (a.user && a.user.userType !== 'AI_AGENT_ACCOUNT') return false;
  }
  return !!(task.fieldInstancesControllingAssignees && task.fieldInstancesControllingAssignees.length);
}

function humanSubtype(task, agent) {
  if (agent || task.createsWorkflowFromWorkflowTemplateId) return '';
  for (const a of (task.assignees || [])) {
    if (a.team) return 'team';
    if (a.user && a.user.userType !== 'AI_AGENT_ACCOUNT') return 'email';
  }
  const dyn = dynamicAssigneeField(task);
  if (dyn) return dyn.fieldType === 'SYSTEM' ? 'system' : 'role';
  return 'system';
}

function agentLabel(task, agent) {
  if (task.createsWorkflowFromWorkflowTemplateId) return 'Linked Workflow';
  if (agent) return agent.name || AGENT_TYPE_NAMES[agent.type] || agent.type;
  // Human task
  for (const a of (task.assignees || [])) {
    if (a.user && a.user.userType !== 'AI_AGENT_ACCOUNT') return 'Human (' + (a.user.name || 'User') + ')';
    if (a.team) return 'Human (' + a.team.name + ')';
  }
  // Dynamically assigned → show the actual people/role (or system) field name
  // directly (e.g. "Buyer"), instead of the opaque "Human (Dynamic)".
  const dyn = dynamicAssigneeField(task);
  if (dyn && dyn.name) return dyn.name;
  if (task.fieldInstancesControllingAssignees && task.fieldInstancesControllingAssignees.length) return 'Human (Dynamic)';
  return 'Human (Workflow owner)';
}

function parseStageConditions(sc) {
  if (!sc || !sc.conditions) return [];
  return sc.conditions.map(c => {
    const left = c.left || {};
    const right = c.right;
    const field = left.field || {};
    const op = c.operator || c.operatorV2 || 'EQUALS';
    function extractVal(v) {
      if (!v || typeof v !== 'object') return null;
      if (v.stringValue != null) return v.stringValue;
      if (v.textValue != null) return v.textValue;
      if (v.booleanValue != null) return v.booleanValue;
      if (v.intValue != null) return v.intValue;
      if (v.integerValue != null) return v.integerValue;
      if (v.floatValue != null) return v.floatValue;
      if (v.dateValue != null) return v.dateValue;
      return null;
    }
    // Collect ALL values (CONTAINS_ANY_OF, IN, etc. can have multiple).
    const allValues = [];
    if (Array.isArray(right)) {
      right.forEach(ri => {
        if (ri && Array.isArray(ri.values)) {
          ri.values.forEach(v => {
            const ev = extractVal(v);
            if (ev != null) allValues.push(ev);
          });
        }
      });
    } else if (right && typeof right === 'object') {
      if (right.textValue != null) allValues.push(right.textValue);
      else if (Array.isArray(right.values)) {
        right.values.forEach(v => {
          const ev = extractVal(v);
          if (ev != null) allValues.push(ev);
        });
      }
    }
    return {
      field_name: field.name || 'Unknown',
      operator: op,
      compare_value: allValues.length ? allValues[0] : null,
      all_values: allValues,
    };
  });
}

function parseBlueprintData(bpData) {
  const stages = [];
  for (const stageData of (bpData.stageTemplates || [])) {
    const tasks = [];
    for (const taskData of (stageData.actionItemTemplates || [])) {
      const agent = parseAgent(taskData);
      const fieldInstances = taskData.fieldInstances || [];
      const shared = fieldInstances.filter(fi => fi.inputType === 'INHERITED').map(parseFieldInstance);
      const requested = fieldInstances.filter(fi => fi.inputType === 'REQUESTED' || fi.inputType === 'OPTIONAL').map(parseFieldInstance);

      // Field instructions for doc reader
      let fieldInstructions = null;
      if (agent && (agent.type === 'DOCUMENT_READER' || agent.type === 'DOCUMENT_EXTRACTION')) {
        fieldInstructions = requested.map(f => ({
          requested_field: f.name,
          field_type: f.property_type,
          additional_instructions: f.helper_text || '',
          multiple_values: f.is_multi_valued || false,
          allowed_values: f.allowed_values || []
        }));
      }

      const depTask = taskData.startAfterActionItemTemplate;
      const depends_on = depTask ? [{ task_id: depTask.id, task_name: depTask.name || 'Unknown' }] : [];

      tasks.push({
        id: taskData.id,
        name: taskData.name || 'Unknown',
        description: taskData.description || '',
        task_type: taskData.type || 'DEFAULT',
        integration_type: taskData.integrationType || null,
        display_order: taskData.displayOrder || 0,
        agent: agent,
        agentClass: agentClass(taskData, agent),
        agentLabel: agentLabel(taskData, agent),
        ht: humanSubtype(taskData, agent),
        is_dynamic_human: isDynamicHuman(taskData, agent),
        shared_fields: shared,
        requested_fields: requested,
        linked_workflow_id: taskData.createsWorkflowFromWorkflowTemplateId || null,
        field_instructions: fieldInstructions,
        form_structure: taskData.exportFormStructure ? { form_name: taskData.exportFormStructure.name || 'Unknown' } : null,
        documents: taskData.documents || [],
        due_interval_seconds: taskData.dueOnIntervalSeconds || null,
        depends_on_tasks: depends_on
      });
    }

    const startAfter = (stageData.startAfterWorkflowStageTemplates || []).map(s => ({
      stage_id: s.id, stage_name: s.name
    }));
    const conditions = parseStageConditions(stageData.startingConditions);

    stages.push({
      id: stageData.id,
      name: stageData.name || 'Unknown',
      execution_order: stageData.executionOrder || 0,
      start_on_workflow_start: stageData.startOnWorkflowStart || false,
      start_after_stages: startAfter,
      starting_conditions: conditions,
      tasks: tasks
    });
  }

  // Workflow-level fields
  const wfFields = (bpData.fieldInstances || []).map(parseFieldInstance);

  return {
    id: bpData.id,
    name: bpData.name || 'Unknown',
    stages: stages,
    workflow_fields: wfFields
  };
}

function buildDataFlowEdges(bp) {
  const edges = [];
  const taskOrder = {};
  for (const stage of bp.stages) {
    for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
      taskOrder[stage.tasks[tidx].id] = [stage.execution_order, tidx];
    }
  }
  // field_id -> [{task_id, task_name}]
  const fieldOutputs = {};
  for (const stage of bp.stages) {
    for (const task of stage.tasks) {
      for (const f of task.requested_fields) {
        if (!fieldOutputs[f.id]) fieldOutputs[f.id] = [];
        fieldOutputs[f.id].push({ task_id: task.id, task_name: task.name });
      }
    }
  }

  function resolveSource(fieldId, consumerTaskId) {
    const producers = fieldOutputs[fieldId] || [];
    if (!producers.length) return null;
    if (producers.length === 1) return producers[0];
    const co = taskOrder[consumerTaskId] || [999, 999];
    const upstream = producers.filter(p => {
      const po = taskOrder[p.task_id] || [999, 999];
      return po[0] < co[0] || (po[0] === co[0] && po[1] < co[1]);
    });
    if (upstream.length) return upstream.reduce((best, p) => {
      const bo = taskOrder[best.task_id] || [0,0];
      const po = taskOrder[p.task_id] || [0,0];
      return (po[0] > bo[0] || (po[0] === bo[0] && po[1] > bo[1])) ? p : best;
    });
    return producers[0];
  }

  for (const stage of bp.stages) {
    for (const task of stage.tasks) {
      for (const inp of task.shared_fields) {
        const src = resolveSource(inp.id, task.id);
        if (src) {
          edges.push({
            from_task_id: src.task_id, from_task_name: src.task_name,
            from_field_name: inp.name, to_task_id: task.id, to_task_name: task.name,
            to_field_name: inp.name, data_type: inp.property_type
          });
        }
      }
    }
  }
  return edges;
}

function buildSourceMap(bp, prefix) {
  const taskLookup = {};
  for (const stage of bp.stages) {
    for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
      taskLookup[stage.tasks[tidx].id] = { stage, tidx: tidx + 1 };
    }
  }
  const map = {};
  const edges = buildDataFlowEdges(bp);
  for (const edge of edges) {
    const src = taskLookup[edge.from_task_id];
    const key = edge.to_task_id + '|' + edge.from_field_name;
    if (src) map[key] = 'Task ' + prefix + src.stage.execution_order + '.' + src.tidx;
    else map[key] = 'Task ID ' + edge.from_task_id;
  }
  return { map, edges };
}

// ==============================================================
// BUILD JS DATA STRUCTURES (same format as Python parser output)
// ==============================================================

function escJS(s) {
  if (s == null) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'').replace(/\t/g,'\\t');
}
function escBacktick(s) {
  if (s == null) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${');
}

function stripHtml(s) {
  if (!s) return '';
  return s.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
}

function cleanPromptHtml(s) {
  if (!s) return '';
  // Field mentions
  s = s.replace(/<span[^>]*data-mention-label="([^"]*)"[^>]*>\s*<\/span>/g, '<span class="field-mention">[$1]</span>');
  s = s.replace(/<span[^>]*data-mention-label="([^"]*)"[^>]*>[^<]*<\/span>/g, '<span class="field-mention">[$1]</span>');
  // Line breaks
  s = s.replace(/\{\{Line\s*Break\}\}/gi, '<br>');
  // Conditionals
  s = s.replace(/\{%\s*if\s+(\w+)\s*%\}/g, '<div class="prompt-conditional">If $1:</div>');
  s = s.replace(/\{%\s*endif\s*%\}/g, '');
  // Literal \n
  s = s.replace(/\\n/g, '<br>');
  // Decode entities
  const txt = document.createElement('textarea');
  txt.innerHTML = s;
  s = txt.value;
  // Remove empty paragraphs
  s = s.replace(/<p>\s*<\/p>/g, '');
  // Clean excessive breaks
  s = s.replace(/(<br\s*\/?>){3,}/g, '<br><br>');
  return s.trim();
}

function buildTriggerText(stage) {
  if (stage.start_on_workflow_start) return 'Workflow start';
  if (stage.start_after_stages.length) return 'After ' + stage.start_after_stages.map(s => s.stage_name).join(', ') + ' completes';
  if (stage.execution_order > 1) return 'After previous stage completes';
  return 'Workflow start';
}

function buildConditionText(stage) {
  if (!stage.starting_conditions.length) return null;
  const opMap = {
    EQUALS: '=', NOT_EQUALS: '!=',
    GREATER_THAN: '>', GREATER_THAN_OR_EQUALS: '>=',
    LESS_THAN: '<', LESS_THAN_OR_EQUALS: '<=',
  };
  const fmt = v => {
    if (typeof v === 'boolean') return v ? 'Yes' : 'No';
    if (typeof v === 'string') return '"' + v + '"';
    return String(v);
  };
  return stage.starting_conditions.map(c => {
    if (c.operator === 'EMPTY' || c.operator === 'NOT_EMPTY' || c.operator === 'IS_EMPTY' || c.operator === 'IS_NOT_EMPTY') {
      return c.field_name + ' ' + c.operator.replace(/_/g, ' ').toLowerCase();
    }
    const all = c.all_values || (c.compare_value != null ? [c.compare_value] : []);
    const op = opMap[c.operator] || c.operator.toLowerCase().replace(/_/g, ' ');
    if (all.length > 1) {
      return c.field_name + ' ' + op + ' [' + all.map(fmt).join(', ') + ']';
    }
    if (all.length === 1) {
      return c.field_name + ' ' + op + ' ' + fmt(all[0]);
    }
    return c.field_name + ' ' + op + ' (value not set)';
  }).join(' AND ');
}

function generateDataStructures(blueprints) {
  const parent = blueprints[0];
  const childBps = blueprints.slice(1);
  const childMap = {};
  childBps.forEach(bp => { childMap[bp.id] = bp; });
  const childBpIdsList = childBps.map(bp => String(bp.id));

  const { map: parentSourceMap, edges: parentEdges } = buildSourceMap(parent, '');

  // Build stages array
  const stagesArr = [];
  // Map each parent task's RAW id → display id ("eo.tidx") so task dependencies
  // (depends_on_tasks holds raw ids) can be emitted as display ids the front-end
  // edge builder resolves directly into real within-stage branches/merges.
  const parentRawToDisplay = {};
  for (const stage of parent.stages) {
    for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
      parentRawToDisplay[stage.tasks[tidx].id] = stage.execution_order + '.' + (tidx + 1);
    }
  }
  for (const stage of parent.stages) {
    const trigger = buildTriggerText(stage);
    const condition = buildConditionText(stage);
    const sid = stage.execution_order;
    const tasksArr = [];

    for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
      const task = stage.tasks[tidx];
      const taskId = stage.execution_order + '.' + (tidx + 1);

      const inputs = task.shared_fields.map(f => {
        let src = 'Workflow-level';
        const key = task.id + '|' + f.name;
        if (parentSourceMap[key]) src = parentSourceMap[key];
        else if (parent.workflow_fields.some(wf => wf.name === f.name)) src = 'Workflow-level';
        return { n: f.name, t: f.property_type, src: src, id: f.id };
      });

      const outputs = task.requested_fields.map(f => ({ n: f.name, t: f.property_type, id: f.id, req: f.input_type === 'REQUESTED' ? 1 : 0 }));

      const isChildLink = !!(task.linked_workflow_id && childMap[task.linked_workflow_id]);
      const childIdx = isChildLink ? childBpIdsList.indexOf(String(task.linked_workflow_id)) : -1;

      const htVal = task.ht || '';
      const descText = stripHtml(task.description);
      const ttype = task.task_type || 'DEFAULT';
      const docNames = (task.documents || []).map(d => d.name || '?').filter(Boolean);
      const depNames = (task.depends_on_tasks || []).map(d => d.task_name || String(d.task_id));
      const depIds = (task.depends_on_tasks || []).map(d => parentRawToDisplay[d.task_id]).filter(Boolean);

      tasksArr.push({
        id: taskId, name: task.name,
        agent: task.agentLabel, agentClass: task.agentClass,
        ...(htVal ? {ht: htVal} : {}),
        ...(task.is_dynamic_human ? {dyn: 1} : {}),
        _isChildLink: isChildLink,
        ...(childIdx >= 0 ? {_childIdx: childIdx} : {}),
        ...(descText ? {desc: descText} : {}),
        ...(ttype !== 'DEFAULT' ? {ttype: ttype} : {}),
        ...(task.integration_type ? {itype: task.integration_type} : {}),
        ...(docNames.length ? {docs: docNames} : {}),
        ...(task.due_interval_seconds ? {dueSec: task.due_interval_seconds} : {}),
        ...(depNames.length ? {deps: depNames} : {}),
        ...(depIds.length ? {depIds: depIds} : {}),
        inputs: inputs, outputs: outputs
      });
    }

    stagesArr.push({ id: sid, name: stage.name, trigger: trigger, condition: condition, tasks: tasksArr });
  }

  // Child blueprints — structured array with per-child stages + flow + childIdxs
  const childBlueprintsArr = [];
  const childBpIds = childBps.map(bp => String(bp.id));
  childBps.forEach((childBp, ci) => {
    const prefix = 'C' + (ci + 1) + '.';
    const { map: childSourceMap, edges: childRawEdges } = buildSourceMap(childBp, prefix);
    const cStages = [];
    const grandchildIdxs = [];
    // Raw id → display id for THIS child blueprint, used to resolve task deps.
    const childRawToDisplay = {};
    for (const stage of childBp.stages) {
      for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
        childRawToDisplay[stage.tasks[tidx].id] = prefix + stage.execution_order + '.' + (tidx + 1);
      }
    }
    for (const stage of childBp.stages) {
      const trigger = buildTriggerText(stage);
      const condition = buildConditionText(stage);
      const tasksArr = [];
      for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
        const task = stage.tasks[tidx];
        const taskId = prefix + stage.execution_order + '.' + (tidx + 1);
        const inputs = task.shared_fields.map(f => {
          let src = 'Workflow-level';
          const key = task.id + '|' + f.name;
          if (childSourceMap[key]) src = childSourceMap[key];
          return { n: f.name, t: f.property_type, src: src, id: f.id };
        });
        const outputs = task.requested_fields.map(f => ({ n: f.name, t: f.property_type, id: f.id, req: f.input_type === 'REQUESTED' ? 1 : 0 }));
        const chtVal = task.ht || '';
        const cDescText = stripHtml(task.description);
        const cTtype = task.task_type || 'DEFAULT';
        const cDocNames = (task.documents || []).map(d => d.name || '?').filter(Boolean);
        const cDepNames = (task.depends_on_tasks || []).map(d => d.task_name || String(d.task_id));
        const cDepIds = (task.depends_on_tasks || []).map(d => childRawToDisplay[d.task_id]).filter(Boolean);
        const cIsChildLink = !!(task.linked_workflow_id && childBpIds.includes(String(task.linked_workflow_id)));
        const cChildIdx = cIsChildLink ? childBpIds.indexOf(String(task.linked_workflow_id)) : -1;
        if (cIsChildLink && cChildIdx >= 0 && grandchildIdxs.indexOf(cChildIdx) === -1) grandchildIdxs.push(cChildIdx);
        tasksArr.push({
          id: taskId, name: task.name, agent: task.agentLabel, agentClass: task.agentClass,
          ...(chtVal ? {ht: chtVal} : {}),
          ...(task.is_dynamic_human ? {dyn: 1} : {}),
          _isChildLink: cIsChildLink,
          ...(cChildIdx >= 0 ? {_childIdx: cChildIdx} : {}),
          ...(cDescText ? {desc: cDescText} : {}),
          ...(cTtype !== 'DEFAULT' ? {ttype: cTtype} : {}),
          ...(task.integration_type ? {itype: task.integration_type} : {}),
          ...(cDocNames.length ? {docs: cDocNames} : {}),
          ...(task.due_interval_seconds ? {dueSec: task.due_interval_seconds} : {}),
          ...(cDepNames.length ? {deps: cDepNames} : {}),
          ...(cDepIds.length ? {depIds: cDepIds} : {}),
          inputs, outputs
        });
      }
      cStages.push({ id: prefix + stage.execution_order, name: stage.name, trigger, condition, tasks: tasksArr });
    }
    const cFlow = buildFlow(childBp).map(e => [prefix + e[0], prefix + e[1]]);
    const childTaskLookup = {};
    for (const stage of childBp.stages) {
      for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
        childTaskLookup[stage.tasks[tidx].id] = prefix + stage.execution_order + '.' + (tidx + 1);
      }
    }
    const cEdges = childRawEdges.filter(e => childTaskLookup[e.from_task_id] && childTaskLookup[e.to_task_id]).map(e => ({
      from: childTaskLookup[e.from_task_id], to: childTaskLookup[e.to_task_id],
      data: e.from_field_name, type: e.data_type
    }));
    childBlueprintsArr.push({ id: childBp.id, name: childBp.name, stages: cStages, flow: cFlow, edges: cEdges, childIdxs: grandchildIdxs });
  });

  // Edges
  const taskLookup = {};
  for (const stage of parent.stages) {
    for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
      taskLookup[stage.tasks[tidx].id] = stage.execution_order + '.' + (tidx + 1);
    }
  }
  const edgesArr = parentEdges.filter(e => taskLookup[e.from_task_id] && taskLookup[e.to_task_id]).map(e => ({
    from: taskLookup[e.from_task_id], to: taskLookup[e.to_task_id],
    data: e.from_field_name, type: e.data_type
  }));

  // Cross-blueprint edges: field produced in one BP consumed in another
  const crossBpEdges = [];
  const globalFieldProducers = {};
  function addProducers(bp, prefix) {
    for (const stage of bp.stages) {
      for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
        const task = stage.tasks[tidx];
        const tid = prefix + stage.execution_order + '.' + (tidx + 1);
        for (const f of task.requested_fields) {
          if (!globalFieldProducers[f.id]) globalFieldProducers[f.id] = [];
          globalFieldProducers[f.id].push({ tid, taskName: task.name, fieldName: f.name, fieldType: f.property_type });
        }
      }
    }
  }
  addProducers(parent, '');
  childBps.forEach((bp, ci) => addProducers(bp, 'C' + (ci + 1) + '.'));

  function addCrossConsumers(bp, prefix) {
    for (const stage of bp.stages) {
      for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
        const task = stage.tasks[tidx];
        const tid = prefix + stage.execution_order + '.' + (tidx + 1);
        for (const f of task.shared_fields) {
          const producers = globalFieldProducers[f.id] || [];
          for (const prod of producers) {
            if (prod.tid === tid) continue;
            const prodBp = prod.tid.startsWith('C') ? prod.tid.split('.')[0] : 'P';
            const consBp = tid.startsWith('C') ? tid.split('.')[0] : 'P';
            if (prodBp !== consBp) {
              crossBpEdges.push({ from: prod.tid, to: tid, data: f.name, type: f.property_type });
            }
          }
        }
      }
    }
  }
  addCrossConsumers(parent, '');
  childBps.forEach((bp, ci) => addCrossConsumers(bp, 'C' + (ci + 1) + '.'));

  // Prompts
  const prompts = {};
  function addPrompts(bp, prefix) {
    for (const stage of bp.stages) {
      for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
        const task = stage.tasks[tidx];
        const tid = prefix + stage.execution_order + '.' + (tidx + 1);
        const desc = (task.description || '').trim();
        prompts[tid] = desc ? cleanPromptHtml(desc) : null;
      }
    }
  }
  addPrompts(parent, '');
  childBps.forEach((bp, ci) => addPrompts(bp, 'C' + (ci + 1) + '.'));

  // Doc reader config
  const docReader = {};
  function addDocReader(bp, prefix) {
    for (const stage of bp.stages) {
      for (let tidx = 0; tidx < stage.tasks.length; tidx++) {
        const task = stage.tasks[tidx];
        if (!task.field_instructions) continue;
        const tid = prefix + stage.execution_order + '.' + (tidx + 1);
        docReader[tid] = {
          form: task.form_structure ? task.form_structure.form_name : null,
          fields: task.field_instructions.map(fi => ({
            n: fi.requested_field, t: fi.field_type,
            helper: fi.additional_instructions || '',
            multi: fi.multiple_values || false,
            choices: fi.allowed_values.length ? fi.allowed_values.map(v => typeof v === 'object' ? (v.displayStringValue || v.stringValue || JSON.stringify(v)) : String(v)) : null
          }))
        };
      }
    }
  }
  addDocReader(parent, '');
  childBps.forEach((bp, ci) => addDocReader(bp, 'C' + (ci + 1) + '.'));

  // Stage flow
  function buildFlow(bp) {
    const flowEdges = new Set();
    const withExplicit = new Set();
    for (const stage of bp.stages) {
      for (const next of bp.stages) {
        if (next.start_after_stages.some(d => d.stage_id === stage.id)) {
          withExplicit.add(next.id);
          flowEdges.add(stage.execution_order + ',' + next.execution_order);
        }
      }
    }
    const sorted = [...bp.stages].sort((a, b) => a.execution_order - b.execution_order);
    for (let i = 0; i < sorted.length - 1; i++) {
      if (!withExplicit.has(sorted[i + 1].id) && !sorted[i + 1].start_on_workflow_start) {
        flowEdges.add(sorted[i].execution_order + ',' + sorted[i + 1].execution_order);
      }
    }
    return [...flowEdges].map(e => e.split(',').map(Number)).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  }

  const stageFlow = buildFlow(parent);

  return { stages: stagesArr, childBlueprints: childBlueprintsArr, parentEdges: edgesArr, crossBpEdges: crossBpEdges, taskPrompts: prompts, docReaderConfig: docReader, stageFlow };
}

// ==============================================================
// FORMS DATA EXTRACTOR
// ==============================================================

function extractFormsData(workflowTemplates) {
  // Build global field map: field.id -> {name, type, isMultiValued, allowedValues}
  // Overwrites with better data (prefer entries that have a real type over Unknown)
  const fieldMap = {};
  for (const wt of workflowTemplates) {
    for (const stage of (wt.stageTemplates || [])) {
      for (const task of (stage.actionItemTemplates || [])) {
        for (const fi of (task.fieldInstances || [])) {
          const field = fi.field || {};
          if (!field.id) continue;
          const pt = field.propertyType || {};
          const sfv = fi.spectrumFieldVersion || {};
          const allowed = field.allowedValues || sfv.allowedValues || [];
          const fieldUnit = field.fieldUnit || sfv.fieldUnit || null;
          const isMulti = !!(field.isMultiValued || fi.isMultiValued);
          // Resolve the real user-facing type (validationType-first, primitive fallback).
          const newType = resolveFieldType(pt.name || 'Unknown', sfvValidationType(sfv), isMulti, allowed, fieldUnit);
          const existing = fieldMap[field.id];
          if (!existing || (existing.type === 'Unknown' && newType !== 'Unknown')) {
            fieldMap[field.id] = {
              name: field.name || 'Unknown',
              type: newType,
              isMultiValued: isMulti,
              allowedValues: allowed.map(v => typeof v === 'object' ? (v.displayStringValue || v.stringValue || JSON.stringify(v)) : String(v))
            };
          }
        }
      }
    }
  }

  // Collect forms across all blueprints with task references
  const formsByUuid = {};
  let bpIdx = 0;
  for (const wt of workflowTemplates) {
    const prefix = bpIdx === 0 ? '' : 'C' + bpIdx + '.';
    for (const stage of (wt.stageTemplates || [])) {
      let tidx = 0;
      for (const task of (stage.actionItemTemplates || [])) {
        tidx++;
        const form = task.exportFormStructure;
        if (!form || !form.sections) { continue; }
        const taskId = prefix + (stage.executionOrder || 1) + '.' + tidx;
        const key = form.formVersionUuid || form.name || taskId;

        if (!formsByUuid[key]) {
          // Build task-local inputType map: field.id -> inputType for THIS task
          const taskInputTypes = {};
          for (const fi of (task.fieldInstances || [])) {
            const fid = (fi.field || {}).id;
            if (fid) taskInputTypes[fid] = fi.inputType || 'UNKNOWN';
          }

          // Build local formFieldId -> name map for constraint resolution
          const ffMap = {};
          for (const sec of form.sections) {
            for (const f of (sec.fields || [])) { ffMap[f.id] = f.name; }
            for (const col of (sec.columns || [])) {
              for (const f of (col.fields || [])) { ffMap[f.id] = f.name; }
            }
          }

          function humanizeConstraints(constraints) {
            if (!constraints || !constraints.length) return [];
            return constraints.map(c => {
              const ruleMap = {show:'Show',hide:'Hide',mandatory:'Require'};
              const rule = ruleMap[c.rule] || c.rule || 'Show';
              const cond = c.condition || {};
              const parts = (cond.constraints || []).map(cc => {
                const fname = ffMap[cc.formFieldId] || 'Field #' + cc.formFieldId;
                const opMap = {EQ:'equals',NEQ:'not equals',ARRAY_CONTAINS_ONE_OF:'contains any of',STRING_IS_ONE_OF:'is one of',ARRAY_CONTAINS_ALL_OF:'contains all of',IS_EMPTY:'is empty',IS_NOT_EMPTY:'is not empty',CHECKED:'is checked',NOT_CHECKED:'is not checked'};
                const op = opMap[cc.operator] || cc.operator || '?';
                const val = (cc.value || []).join('" or "');
                if (op === 'is empty' || op === 'is not empty' || op === 'is checked' || op === 'is not checked') {
                  return '"' + fname + '" ' + op;
                }
                return '"' + fname + '" ' + op + ' "' + val + '"';
              });
              const joiner = cond.operator === 'AND' ? ' AND ' : ' OR ';
              return rule + ' when ' + parts.join(joiner);
            });
          }

          let totalFields = 0;
          let smartRuleCount = 0;
          const sections = form.sections.map(sec => {
            const secConstraints = humanizeConstraints(sec.constraints);
            smartRuleCount += secConstraints.length;

            // Merge fields from sec.fields[] and sec.columns[].fields[]
            const allFields = [];
            for (const f of (sec.fields || [])) allFields.push(f);
            for (const col of (sec.columns || [])) {
              for (const f of (col.fields || [])) allFields.push(f);
            }

            // Build items: fields + instructions, sorted by displayOrder
            const items = [];
            for (const f of allFields) {
              const resolved = fieldMap[f.spectrumFieldId] || {};
              const fConstraints = humanizeConstraints(f.constraints);
              smartRuleCount += fConstraints.length;
              items.push({
                type: 'field',
                name: f.name || resolved.name || 'Unknown',
                fieldType: resolved.type || 'Unknown',
                isRequired: f.isRequired || false,
                allowedValues: resolved.allowedValues || [],
                constraints: fConstraints,
                inputType: taskInputTypes[f.spectrumFieldId] || 'UNKNOWN',
                enableFieldPassing: f.enableFieldPassing || false,
                displayOrder: f.displayOrder || 0,
                col: f.displayColumn || 0
              });
            }
            for (const instr of (sec.instructions || [])) {
              const instrConstraints = humanizeConstraints(instr.constraints);
              smartRuleCount += instrConstraints.length;
              items.push({
                type: 'instruction',
                name: instr.name || '',
                description: instr.description || '',
                constraints: instrConstraints,
                displayOrder: instr.displayOrder || 0
              });
            }
            // Table forms (line-item grids): a section.tables[] entry whose fields[]
            // are the grid COLUMNS. Emit one item of type 'table' per table so the
            // renderer can show a header row of column names (otherwise the whole
            // section renders empty — e.g. Chevron's "Supporting Documents Line Item
            // Extraction" which has no plain fields, only a table).
            for (const tbl of (sec.tables || [])) {
              const cols = (tbl.fields || []).slice().sort((a, b) => (a.displayOrder || 0) - (b.displayOrder || 0)).map(c => {
                const cr = fieldMap[c.spectrumFieldId] || {};
                const cConstraints = humanizeConstraints(c.constraints);
                smartRuleCount += cConstraints.length;
                return {
                  name: c.name || cr.name || 'Unknown',
                  fieldType: cr.type || 'Unknown',
                  isRequired: c.isRequired || false,
                  constraints: cConstraints
                };
              });
              totalFields += cols.length;
              items.push({
                type: 'table',
                name: tbl.name || sec.name || 'Table',
                description: tbl.description || '',
                columns: cols,
                displayOrder: tbl.displayOrder || 0
              });
            }
            items.sort((a, b) => a.displayOrder - b.displayOrder);
            totalFields += allFields.length;

            return {
              name: sec.name || 'Unnamed Section',
              displayOrder: sec.displayOrder || 0,
              constraints: secConstraints,
              items: items
            };
          }).sort((a, b) => a.displayOrder - b.displayOrder);

          formsByUuid[key] = {
            name: form.name || 'Unnamed Form',
            taskIds: [taskId],
            taskNames: [task.name || 'Unknown'],
            sectionCount: sections.length,
            fieldCount: totalFields,
            smartRuleCount: smartRuleCount,
            sections: sections
          };
        } else {
          formsByUuid[key].taskIds.push(taskId);
          formsByUuid[key].taskNames.push(task.name || 'Unknown');
        }
      }
    }
    bpIdx++;
  }

  return Object.values(formsByUuid);
}

// ==============================================================
// TEXT OUTPUT GENERATOR
// ==============================================================

function generateTextOutput(blueprints, data) {
  const parent = blueprints[0];
  const childBps = blueprints.slice(1);
  const bpById = {};
  blueprints.forEach(bp => { bpById[bp.id] = bp; });

  // Build spawn tree: which bp spawns which
  const spawns = {};
  blueprints.forEach(bp => {
    spawns[bp.id] = [];
    for (const stage of bp.stages) {
      for (const task of stage.tasks) {
        if (task.linked_workflow_id && bpById[task.linked_workflow_id]) {
          if (spawns[bp.id].indexOf(task.linked_workflow_id) === -1) {
            spawns[bp.id].push(task.linked_workflow_id);
          }
        }
      }
    }
  });

  // Assign prefixes
  const bpPrefix = {};
  bpPrefix[parent.id] = '';
  childBps.forEach((bp, i) => { bpPrefix[bp.id] = 'C' + (i + 1) + '.'; });

  const lines = [];
  const isCombined = childBps.length > 0;

  if (isCombined) {
    lines.push('='.repeat(80));
    lines.push('COMBINED BLUEPRINT ANALYSIS');
    lines.push('='.repeat(80));
    lines.push('');

    // Hierarchy tree listing
    lines.push('Total Blueprints: ' + blueprints.length);
    function treeListing(bpId, depth) {
      const bp = bpById[bpId];
      const indent = '  '.repeat(depth + 1);
      const prefix = bpPrefix[bpId] || '';
      const label = depth === 0 ? 'Parent' : 'Child (' + prefix.replace(/\.$/, '') + ')';
      lines.push(indent + label + ': ' + bp.name + ' (ID: ' + bp.id + ')');
      (spawns[bpId] || []).forEach(cid => treeListing(cid, depth + 1));
    }
    treeListing(parent.id, 0);
    lines.push('');

    // Combined metrics
    let totalStages = 0, totalTasks = 0, totalAi = 0;
    blueprints.forEach(bp => {
      bp.stages.forEach(s => {
        totalStages++;
        s.tasks.forEach(t => {
          totalTasks++;
          if (t.agent && t.agent.type) totalAi++;
        });
      });
    });
    lines.push('COMBINED METRICS:');
    lines.push('  Stages: ' + totalStages);
    lines.push('  Tasks: ' + totalTasks + ' (AI: ' + totalAi + ', Human: ' + (totalTasks - totalAi) + ')');
    lines.push('');
    lines.push('='.repeat(80));
    lines.push('');

    // TOC placeholder
    lines.push('<<TOC>>');
    lines.push('');
  }

  // Helper: emit one blueprint's task registry + edge table
  function emitBlueprint(bp, prefix, stagesData, edgesData, flowData, prompts) {
    lines.push('='.repeat(80));
    lines.push('SECTION 1: TASK REGISTRY');
    lines.push('='.repeat(80));
    lines.push('');

    for (const stage of stagesData) {
      lines.push('-'.repeat(80));
      lines.push('STAGE ' + stage.id + ': ' + stage.name);
      lines.push('  Trigger: ' + stage.trigger);
      lines.push('  Condition: ' + (stage.condition || 'None (always runs)'));
      lines.push('');

      for (const task of stage.tasks) {
        lines.push('  Task ' + task.id + ': ' + task.name);
        lines.push('    Agent: ' + task.agent);

        if (task.inputs.length) {
          lines.push('    Inputs: ' + task.inputs.length);
          task.inputs.forEach(i => lines.push('      - ' + i.n + ' (' + i.t + ') <- ' + i.src));
        }
        if (task.outputs.length) {
          lines.push('    Outputs: ' + task.outputs.length);
          task.outputs.forEach(o => lines.push('      - ' + o.n + ' (' + o.t + ')'));
        }

        const prompt = prompts[task.id];
        if (prompt) {
          const plain = prompt.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
          lines.push('    Description:');
          lines.push('      ' + plain.substring(0, 200) + (plain.length > 200 ? '...' : ''));
        }
        lines.push('');
      }
    }

    if (edgesData.length || flowData.length) {
      lines.push('');
      lines.push('='.repeat(80));
      lines.push('SECTION 2: EDGE TABLE + STAGE FLOW');
      lines.push('='.repeat(80));
      lines.push('');

      if (edgesData.length) {
        lines.push('EDGE TABLE');
        lines.push('-'.repeat(80));
        const seenEdges = {};
        const edgeOrder = [];
        for (const edge of edgesData) {
          const key = edge.from + '\x00' + edge.to + '\x00' + edge.data + '\x00' + edge.type;
          if (seenEdges[key]) { seenEdges[key].count++; }
          else { seenEdges[key] = { count: 1, edge: edge }; edgeOrder.push(key); }
        }
        for (const key of edgeOrder) {
          const e = seenEdges[key];
          const suffix = e.count > 1 ? ' (x' + e.count + ')' : '';
          lines.push('  Task ' + e.edge.from + ' --[ ' + e.edge.data + ' (' + e.edge.type + ') ]--> Task ' + e.edge.to + suffix);
        }
        const uniqueCount = edgeOrder.length;
        lines.push('-'.repeat(80));
        if (uniqueCount < edgesData.length) {
          lines.push('Total Edges: ' + edgesData.length + ' (' + uniqueCount + ' unique)');
        } else {
          lines.push('Total Edges: ' + edgesData.length);
        }
        lines.push('');
      }

      if (flowData.length) {
        const stageMap = {};
        stagesData.forEach(s => { stageMap[s.id] = s; });
        lines.push('STAGE FLOW');
        lines.push('-'.repeat(80));
        for (const [from, to] of flowData) {
          const fromS = stageMap[from] || stageMap[prefix + from];
          const toS = stageMap[to] || stageMap[prefix + to];
          let line = 'Stage ' + from + ': ' + (fromS ? fromS.name : '?') + ' -> Stage ' + to + ': ' + (toS ? toS.name : '?');
          if (toS && toS.condition) line += ' (IF ' + toS.condition + ')';
          lines.push('  ' + line);
        }
      }
    }
  }

  // Parent
  if (isCombined) {
    lines.push('<<SEC:Parent: ' + parent.name + '>>--- PARENT: ' + parent.name + ' ---');
    lines.push('');
  }
  emitBlueprint(parent, '', data.stages, data.parentEdges, data.stageFlow, data.taskPrompts);
  lines.push('');
  lines.push('');

  // Cross-blueprint data flow — scan ALL blueprints
  if (isCombined) {
    const allLinked = [];
    blueprints.forEach(bp => {
      const srcPrefix = bpPrefix[bp.id] || '';
      bp.stages.forEach(stage => {
        stage.tasks.forEach((task, tidx) => {
          if (task.linked_workflow_id && bpById[task.linked_workflow_id]) {
            allLinked.push({ srcBp: bp, srcPrefix, stage, task, tidx: tidx + 1, childBp: bpById[task.linked_workflow_id] });
          }
        });
      });
    });

    if (allLinked.length) {
      lines.push('<<SEC:Cross-Blueprint Data Flow>>' + '='.repeat(80));
      lines.push('CROSS-BLUEPRINT DATA FLOW');
      lines.push('='.repeat(80));
      lines.push('');

      for (const link of allLinked) {
        const taskNum = link.srcPrefix + link.stage.execution_order + '.' + link.tidx;
        const srcLabel = !link.srcPrefix ? 'Parent' : '(' + link.srcPrefix.replace(/\.$/, '') + ') ' + link.srcBp.name;
        const childPrefix = bpPrefix[link.childBp.id] || '';
        const childLabel = childPrefix ? '(' + childPrefix.replace(/\.$/, '') + ') ' + link.childBp.name : link.childBp.name;
        lines.push(srcLabel + ' Task ' + taskNum + ': ' + link.task.name + ' (ID: ' + link.task.id + ')');
        lines.push('  -> spawns ' + childLabel + ' (ID: ' + link.childBp.id + ')');
        lines.push('');

        if (link.task.shared_fields.length) {
          lines.push('  Fields passed to child:');
          link.task.shared_fields.forEach(f => {
            const fid = f.id ? ' [id: ' + f.id + ']' : '';
            lines.push('    - ' + f.name + ' (' + f.property_type + ')' + fid);
          });
          lines.push('');
        }
        if (link.task.requested_fields.length) {
          lines.push('  Fields returned from child:');
          link.task.requested_fields.forEach(f => {
            const fid = f.id ? ' [id: ' + f.id + ']' : '';
            lines.push('    - ' + f.name + ' (' + f.property_type + ')' + fid);
          });
          lines.push('');
        }
      }

      lines.push('='.repeat(80));
      lines.push('');
      lines.push('');
    }

    // Child blueprint analyses — walk spawn tree for hierarchy order
    const visited = {};
    function emitChildren(parentId) {
      (spawns[parentId] || []).forEach(childId => {
        if (visited[childId]) return;
        visited[childId] = true;
        const bp = bpById[childId];
        const prefix = bpPrefix[childId] || '';
        const spawner = bpById[parentId];
        const spawnerPrefix = bpPrefix[parentId] || '';
        const spawnerLabel = !spawnerPrefix ? 'Parent: ' + spawner.name : '(' + spawnerPrefix.replace(/\.$/, '') + ') ' + spawner.name;
        const tocLabel = '(' + prefix.replace(/\.$/, '') + ') ' + bp.name;
        lines.push('<<SEC:' + tocLabel + '>>--- ' + tocLabel + ' [spawned by ' + spawnerLabel + '] ---');
        lines.push('');

        // Find this child's data in childBlueprints
        const cbIdx = childBps.indexOf(bp);
        const cbData = data.childBlueprints[cbIdx];
        if (cbData) {
          // Build edges for this child
          const { edges: childEdges } = buildSourceMap(bp, prefix);
          const childTaskLookup = {};
          bp.stages.forEach(s => {
            s.tasks.forEach((t, ti) => { childTaskLookup[t.id] = prefix + s.execution_order + '.' + (ti + 1); });
          });
          const childEdgesArr = childEdges.filter(e => childTaskLookup[e.from_task_id] && childTaskLookup[e.to_task_id]).map(e => ({
            from: childTaskLookup[e.from_task_id], to: childTaskLookup[e.to_task_id],
            data: e.from_field_name, type: e.data_type
          }));

          emitBlueprint(bp, prefix, cbData.stages, childEdgesArr, cbData.flow, data.taskPrompts);
        }
        lines.push('');
        lines.push('');
        emitChildren(childId);
      });
    }
    emitChildren(parent.id);

    // Emit any remaining children not in the spawn tree
    childBps.forEach((bp, i) => {
      if (!visited[bp.id]) {
        const prefix = 'C' + (i + 1) + '.';
        const cbData = data.childBlueprints[i];
        const tocLabel2 = '(' + prefix.replace(/\.$/, '') + ') ' + bp.name;
        lines.push('<<SEC:' + tocLabel2 + '>>--- ' + tocLabel2 + ' ---');
        lines.push('');
        if (cbData) {
          emitBlueprint(bp, prefix, cbData.stages, [], cbData.flow, data.taskPrompts);
        }
        lines.push('');
        lines.push('');
      }
    });
  }

  // Final pass: build TOC with line numbers and strip markers
  if (isCombined) {
    const raw = lines.join('\n').split('\n');
    const tocEntries = [];
    let tocIdx = null;
    const cleaned = [];
    for (let i = 0; i < raw.length; i++) {
      if (raw[i] === '<<TOC>>') { tocIdx = cleaned.length; cleaned.push(raw[i]); continue; }
      if (raw[i].startsWith('<<SEC:')) {
        const end = raw[i].indexOf('>>');
        const label = raw[i].substring(6, end);
        const rest = raw[i].substring(end + 2);
        tocEntries.push({ line: cleaned.length + 1, label: label });
        cleaned.push(rest);
      } else {
        cleaned.push(raw[i]);
      }
    }
    if (tocEntries.length && tocIdx !== null) {
      const tocBlock = ['TABLE OF CONTENTS', '-'.repeat(80)];
      let maxLabel = 0;
      tocEntries.forEach(e => { if (e.label.length > maxLabel) maxLabel = e.label.length; });
      const shift = 2 + tocEntries.length + 2 - 1;
      tocEntries.forEach(e => {
        const adjusted = e.line + shift;
        const dots = '.'.repeat(Math.max(2, maxLabel + 8 - e.label.length));
        tocBlock.push('  ' + e.label + ' ' + dots + ' line ' + adjusted);
      });
      tocBlock.push('-'.repeat(80));
      tocBlock.push('');
      cleaned.splice(tocIdx, 1, ...tocBlock);
    }
    return cleaned.join('\n');
  }

  return lines.join('\n');
}

  } catch(e) { return ''; }
}

    '// DERIVED DATA\n' +
    'const taskToStage={}, taskMap={}, adj={};\n' +
    'const stageEdgeMap={}, aggTaskEdges={}, intraStageEdges={};\n' +
    'function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}\n' +

function setStatus(type, text) {
  const bar = document.getElementById('status-bar');
  const icon = document.getElementById('status-icon');
  const txt = document.getElementById('status-text');
  bar.className = 'status-bar visible ' + type;
  txt.textContent = text;
  if (type === 'loading') {
    icon.innerHTML = '<span class="spinner"></span>';
  } else if (type === 'success') {
    icon.innerHTML = '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  } else {
    icon.innerHTML = '';
  }
}

async function processRexFile(file) {
  setStatus('loading', 'Processing ' + file.name + '...');
  document.getElementById('actions').classList.remove('show');

  try {
    // Load template and logo
    if (!templateHtml) {
      [templateHtml, logoB64, opsLogoB64] = await Promise.all([loadTemplate(), loadLogo(), loadOpsLogo()]);
    }

    // Unzip
    const zip = await JSZip.loadAsync(file);
    const jsonFile = zip.file('blueprint_export.json');
    if (!jsonFile) throw new Error('blueprint_export.json not found inside .rex file');

    const jsonText = await jsonFile.async('text');
    const rawData = JSON.parse(jsonText);

    // Parse blueprints
    const workflowTemplates = rawData.workflowTemplates || [];
    if (!workflowTemplates.length) throw new Error('No workflow templates found in .rex file');

    const blueprints = workflowTemplates.map(parseBlueprintData);

    // Extract forms data from raw workflow templates
    const formsData = extractFormsData(workflowTemplates);

    // Generate data structures
    const data = generateDataStructures(blueprints);
    data.formsData = formsData;

    // Generate outputs
    generatedHtml = generateHtmlOutput(blueprints, data, templateHtml);
    generatedTxt = generateTextOutput(blueprints, data);

    // Success
    const totalTasks = data.stages.reduce((s, st) => s + st.tasks.length, 0);
    setStatus('success', blueprints[0].name + ' — ' + data.stages.length + ' stages, ' + totalTasks + ' tasks');
    document.getElementById('actions').classList.add('show');

  } catch (err) {
    setStatus('error', err.message);
    console.error(err);
  }
}

const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.rex')) processRexFile(file);
  else setStatus('error', 'Please drop a .rex file');
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) processRexFile(e.target.files[0]);
});

// Action buttons
document.getElementById('btn-view').addEventListener('click', () => {
  if (generatedHtml) {
    const blob = new Blob([generatedHtml], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
  }
});
document.getElementById('btn-download-html').addEventListener('click', () => {
  if (generatedHtml) {
    const blob = new Blob([generatedHtml], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data_flow.html';
    a.click();
  }
});
document.getElementById('btn-download-txt').addEventListener('click', () => {
  if (generatedTxt) {
    const blob = new Blob([generatedTxt], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'parsed.txt';
    a.click();
  }
});
</script>
