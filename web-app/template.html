// ==============================================================
// Render the large form preview for one form (right panel) framed as an actual
// form "sheet" — a white bordered document on a gray backdrop, like the real
// Regrello form preview/configure view.
function renderFormPanel(form){
  if(!form)return'';
  var h='<div class="fm-sheet">';
  h+='<div class="fm-form-head">';
  h+='<div class="fm-form-title">'+escHtml(form.name)+'</div>';
  h+='<div class="fm-form-sub">'+form.sectionCount+' section'+(form.sectionCount!==1?'s':'')+' &middot; '+form.fieldCount+' field'+(form.fieldCount!==1?'s':'')+(form.smartRuleCount?' &middot; '+form.smartRuleCount+' smart rule'+(form.smartRuleCount!==1?'s':''):'')+'</div>';
  // task chips (where this form is used)
  if(form.taskIds&&form.taskIds.length){
    h+='<div class="fm-form-tasks">';
    form.taskIds.forEach(function(tid,i){
      h+='<span class="form-task-chip" onclick="switchTab(\'stageflow\')" title="'+escHtml(form.taskNames[i]||'')+'">'+escHtml(tid)+': '+escHtml((form.taskNames[i]||'').substring(0,32))+'</span>';
    });
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="fm-form-body">'+renderFormSections(form)+'</div>';
  h+='</div>';
  return h;
}
// Format a humanized smart-rule string ("Show when \"Field\" equals \"Value\"")
// the way Regrello's ConstraintRuleBlock reads: bold the rule verb, wrap quoted
// field names / values as subtle chips, keep operators plain.
function sfRuleHtml(c){
  c=String(c);
  var m=c.match(/^(Show|Hide|Require)\b\s*(.*)$/i);
  var verb='',rest=c;
  if(m){verb=m[1];rest=m[2];}
  // split on quoted segments; quoted = chip, unquoted = plain text
  var out='',re=/"([^"]*)"/g,last=0,mm;
  while((mm=re.exec(rest))){
    out+=escHtml(rest.slice(last,mm.index));
    out+='<span class="rule-field">'+escHtml(mm[1])+'</span>';
    last=mm.index+mm[0].length;
  }
  out+=escHtml(rest.slice(last));
  return(verb?'<strong>'+escHtml(verb)+'</strong> ':'')+out;
}
function renderFormSections(form){
  var eyeSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var h='';
  (form.sections||[]).forEach(function(sec){
    h+='<div class="form-section-block">';
    // section header mirrors the real form: a muted "not-started" status circle +
    // the section name (h5), with any description indented under the title.
    h+='<div class="form-section-hdr"><span class="form-section-dot"></span>';
    h+='<div class="form-section-titlewrap"><div class="form-section-name">'+escHtml(sec.name)+'</div>';
    if(sec.description)h+='<div class="form-section-desc">'+escHtml(sec.description)+'</div>';
    h+='</div></div>';
    if(sec.constraints&&sec.constraints.length){
      sec.constraints.forEach(function(c){h+='<div class="form-section-rule">'+eyeSvg+'<span>'+sfRuleHtml(c)+'</span></div>'});
    }
    var instructions=[];var rows=[];
    (sec.items||[]).forEach(function(item){
      if(item.type==='instruction')instructions.push(item);
      else rows.push(item);
    });
    if(instructions.length){
      instructions.forEach(function(instr){
        if(instr.constraints&&instr.constraints.length){
          instr.constraints.forEach(function(c){h+='<div class="form-section-rule">'+eyeSvg+'<span>'+sfRuleHtml(c)+'</span></div>'});
        }
        h+='<div class="form-instruction">'+escHtml(instr.description||instr.name)+'</div>';
      });
    }
    if(rows.length){
      // Table items (line-item grids) render full-width; plain fields lay out in the
      // 1/2-column grid. Separate so the column-pairing only sees plain fields.
      var tables=rows.filter(function(r){return r.type==='table'});
      var fieldRows=rows.filter(function(r){return r.type!=='table'});
      // Lay fields out the way Regrello does: items carry a displayColumn (col 0 =
      // left, 1 = right). Walk in order; a col-0 immediately followed by a col-1 share
      // one two-column row. A lone col-1 keeps the right column (empty spacer left).
      // A col-0 with no col-1 partner spans full width. Sections that never use a
      // right column stay single-column.
      if(fieldRows.length){
        var usesCols=fieldRows.some(function(r){return r.col===1});
        h+='<div class="form-fields-wrap">';
        var i=0;
        while(i<fieldRows.length){
          var item=fieldRows[i];
          var next=fieldRows[i+1];
          if(item.col===0&&next&&next.col===1){
            h+='<div class="form-fields-row two-col">'+renderFormField(item,eyeSvg)+renderFormField(next,eyeSvg)+'</div>';
            i+=2;
          }else if(item.col===1&&usesCols){
            h+='<div class="form-fields-row two-col"><div class="form-field-block form-field-spacer"></div>'+renderFormField(item,eyeSvg)+'</div>';
            i++;
          }else if(item.col===0&&usesCols){
            h+='<div class="form-fields-row two-col">'+renderFormField(item,eyeSvg)+'<div class="form-field-block form-field-spacer"></div></div>';
            i++;
          }else{
            h+='<div class="form-fields-row">'+renderFormField(item,eyeSvg)+'</div>';
            i++;
          }
        }
        h+='</div>';
      }
      tables.forEach(function(tb){h+=renderFormTable(tb,eyeSvg)});
    }
    h+='</div>';
  });
  return h;
}
function renderFormField(item,eyeSvg){
  var ft=(item.fieldType||'').toLowerCase();
  var isPrepop=item.inputType==='INHERITED';
  var isCheckbox=ft==='checkbox';
  var isDoc=ft==='document';
  var isDate=ft==='date';
  var isSelect=ft==='select'||ft==='multi-select'||ft==='people'||(item.allowedValues&&item.allowedValues.length>0);
  var isNumber=ft==='number'||ft==='decimal';
  var isCurrency=ft==='currency';
  var isPhone=ft==='phone';
  var isSignature=ft==='signature';
  var cls='form-field-input';
  if(isCheckbox)cls+=' checkbox';
  else if(isDoc)cls+=' doc';
  else if(isSignature)cls+=' signature';
  else if(isDate)cls+=' date';
  else if(isCurrency)cls+=' currency';
  else if(isNumber)cls+=' number';
  else if(isPhone)cls+=' phone';
  else if(isSelect)cls+=' select';
  if(isPrepop&&!isCheckbox)cls+=' prepop';
  var typeLabel=(item.fieldType&&item.fieldType!=='Unknown')?item.fieldType:'';
  var vals=item.allowedValues||[];
  var h='<div class="form-field-block">';
  if(isCheckbox){
    // checkbox: box + name inline (the box is drawn by the .checkbox ::before), with
    // type/required tags trailing.
    h+='<div class="'+cls+'">'+escHtml(item.name);
    if(item.isRequired)h+=' <span class="freq" title="Required">*</span>';
    h+='</div>';
  }else{
    // label row: name + required asterisk, then type chip + (pre-filled badge) trailing
    h+='<div class="form-field-labelrow">';
    h+='<span class="form-field-label">'+escHtml(item.name);
    if(item.isRequired)h+=' <span class="freq" title="Required">*</span>';
    h+='</span>';
    h+='<span class="form-field-tags">';
    if(typeLabel)h+='<span class="form-type-chip">'+escHtml(typeLabel)+'</span>';
    if(isPrepop)h+='<span class="form-prefill-chip" title="Pre-populated from an earlier field">Pre-filled</span>';
    h+='</span></div>';
    h+='<div class="'+cls+'">';
    if(isDoc)h+='Click or drop to attach documents';
    else if(isSignature)h+='<span class="sig-text">Sign here</span>';
    else if(isDate&&!isPrepop)h+='mm / dd / yyyy';
    else if(isPrepop)h+='Pre-populated';
    else if(isSelect&&vals.length)h+='<span class="form-select-ph">Select…</span>';
    h+='</div>';
  }
  // allowed-values preview (dropdown options) — show the choices as small chips
  if(isSelect&&vals.length){
    h+='<div class="form-field-options">';
    var shown=vals.slice(0,8);
    shown.forEach(function(v){h+='<span class="form-opt-chip">'+escHtml(String(v))+'</span>'});
    if(vals.length>shown.length)h+='<span class="form-opt-more">+'+(vals.length-shown.length)+' more</span>';
    h+='</div>';
  }
  if(item.constraints&&item.constraints.length){
    item.constraints.forEach(function(c){h+='<div class="form-field-rule">'+eyeSvg+'<span>'+sfRuleHtml(c)+'</span></div>'});
  }
  h+='</div>';
  return h;
}
// Table form (line-item grid): columns = the table's fields; render a header row of
// column names + one empty placeholder data row (the real app shows a fillable grid).
function renderFormTable(tb,eyeSvg){
  var cols=tb.columns||[];
  var h='<div class="form-table-wrap">';
  if(tb.description)h+='<div class="form-instruction">'+escHtml(tb.description)+'</div>';
  h+='<div class="form-table-scroll"><table class="form-table"><thead><tr><th class="form-table-rownum">#</th>';
  cols.forEach(function(c){
    h+='<th>'+escHtml(c.name)+(c.isRequired?' <span class="freq">*</span>':'')+'</th>';
  });
  h+='</tr></thead><tbody>';
  // one placeholder row to convey it's a fillable grid
  h+='<tr><td class="form-table-rownum">1</td>';
  cols.forEach(function(){h+='<td><span class="form-table-cell"></span></td>'});
  h+='</tr></tbody></table></div>';
  // any column-level smart rules
  var rules=[];cols.forEach(function(c){(c.constraints||[]).forEach(function(r){rules.push({col:c.name,r:r})})});
  rules.forEach(function(x){h+='<div class="form-field-rule">'+eyeSvg+'<span><span class="rule-field">'+escHtml(x.col)+'</span> &middot; '+sfRuleHtml(x.r)+'</span></div>'});
  h+='</div>';
  return h;
}


// ==============================================================
// LANE VIEW (swim-lane: lanes = assignees, stages = the other axis)
// ==============================================================
// Swimlanes always OPENS horizontal (the requested default). Orientation is no longer
// read from localStorage so a previously-chosen vertical can't get stuck across loads;
// the Horizontal/Vertical toggle still switches it for the current session.
var lvOrientation='h';
var lvShowDataFlow=false,lvTraceField=null,lvActiveTaskId=null;
// Full Process is the single switch for linked workflows: OFF shows each child as
// one invocation card in the "Linked Workflows" lane; ON hides those cards and
// expands every child's tasks inline (recursively for grandchildren), tinted by
// nesting depth. Re-render on toggle (renderLaneView early-returns otherwise) and
// invalidate the sequence-edge cache — contraction depends on fullProcess.
function lvOnFullProcessChange(){lvSeqEdgesCache=null;lvSeqAdjCache=null;renderLaneView(true)}

function lvSetOrient(o){lvOrientation=o;renderLaneView(true)}
function lvToggleDataFlow(){
  lvShowDataFlow=!lvShowDataFlow;
  var b=document.getElementById('lv-df-toggle');if(b)b.checked=lvShowDataFlow;
  // Turning Data Flow OFF clears any field selection (the legend goes away with it).
  if(!lvShowDataFlow)lvTraceField=null;
  // The field legend lives in the rendered DOM, so a full re-render shows/hides it.
  renderLaneView(true);
}

  // Tint the gateway with the SAME accent color its child tasks use when expanded,
  // so OFF↔ON keeps a consistent identity for each sub-workflow.
  var bpColor=(t._childIdx!=null)?lvBpColor(t._childIdx):'var(--agent-pill-text)';
  var h='<div class="'+cls+'" data-tid="'+t.id+'" data-agent="'+t.agentClass+'" title="'+escHtml(bpName)+'" style="--lv-bp:'+bpColor+'" onclick="lvCardClick(\''+t.id+'\',event)">';
  h+='<div class="lv-linkcard-eyebrow"><span class="lv-linkcard-glyph">&#10696;</span>Linked Workflow</div>';
  h+='<div class="lv-linkcard-name">'+escHtml(bpName)+'</div>';
  if(meta.length)h+='<div class="lv-linkcard-meta">'+meta.join(' &middot; ')+'</div>';
  h+='<div class="lv-linkcard-hint">Turn on Full Process to expand &#x25B8;</div>';
  h+='</div>';
  return h;
}

function lvRenderCard(t){
  // Invocation cards get a purpose-built gateway treatment (Full Process OFF only).
  if(t._isChildLink)return lvRenderLinkCard(t);
  // Highlight state (active/traced/dim) is applied post-render by lvApplyTraceClasses.
  var active=lvActiveTaskId===t.id;
  // Linked-workflow provenance: a task belonging to a child BP (depth>0) gets the
  // dashed-purple "linked" treatment, tinted progressively deeper by nesting level
  // (depth-1 child, depth-2 grandchild, depth-3+ clamped).
  var depth=lvDepthOf[t.id]||0;
  var linkedCls=depth>0?(' lv-linked lv-linked-d'+Math.min(depth,3)):'';
  var cls='tcard lv-card'+linkedCls+(active?' lv-active':'');
  var dur=lvFmtDur(t.dueSec);
  var label=lvTaskTypeLabel(t);
  var typeKind=label.toLowerCase().replace(/\s+/g,'-');
  // Per-sub-workflow accent color (set as a CSS var so the strip, border, and tint
  // all derive from it). Each distinct child BP gets its own color → two children of
  // the same parent, or a child vs its grandchild, are visually distinct.
  var bpColorStyle=depth>0?' style="--lv-bp:'+lvBpColor(lvLinkedBpIdxOf[t.id]||0)+'"':'';
  var h='<div class="'+cls+'" data-tid="'+t.id+'" data-agent="'+t.agentClass+'"'+bpColorStyle+' onclick="lvCardClick(\''+t.id+'\',event)">';
  // Linked-workflow header strip: names the sub-workflow this task came from, so
  // provenance survives once the card scatters into its functional lane. The depth
  // glyph (⤷ child, ⤷⤷ grandchild, …) signals nesting level at a glance.
  if(depth>0&&lvLinkedBpOf[t.id]){
    var depthGlyph=new Array(Math.min(depth,3)+1).join('&#10551;'); // ⤷ repeated by depth
    h+='<div class="lv-card-linkhdr" title="From linked workflow: '+escHtml(lvLinkedBpOf[t.id])+(depth>1?' (nested level '+depth+')':'')+'"><span class="lv-card-linkhdr-icon">'+depthGlyph+'</span><span class="lv-card-linkhdr-name">'+escHtml(lvLinkedBpOf[t.id])+'</span></div>';
  }
  h+='<div class="lv-card-row1">';
  h+='<span class="lv-seq" title="Task '+escHtml(t.id)+'">'+escHtml(t.id)+'</span>';
  h+='<span class="lv-ttype lv-ttype-'+typeKind+'">'+escHtml(label)+'</span>';
  h+='</div>';
  h+='<div class="lv-card-name" title="'+escHtml(t.name)+'">'+escHtml(t.name)+'</div>';
  h+='<div class="lv-card-row2"><span class="abadge '+badgeCls(t)+'" title="'+escHtml(t.agent)+'">'+escHtml(t.agent)+'</span>';
  if(dur)h+='<span class="lv-dur">'+dur+'</span>';
  h+='</div>';
  h+='</div>';
  return h;
}

// Build the canonical sequence-edge set for Lane View. This mirrors how Task Map
// builds its sequence flow:
//   1) Within each stage, tasks are sequential by their original array order:
//      s.tasks[0] → s.tasks[1] → s.tasks[2] …
//   2) Between stages, stageFlow / childFlow define [from_stage_id, to_stage_id]
//      pairs. The handoff is: lastTask(from_stage) → firstTask(to_stage).
//   3) Linked workflow tasks hand off to the first task of their child blueprint:
//      linkedTask → cb.stages[0].tasks[0]
// Each entry: {from, to, type:'sequence'|'child'}
// First task of a child blueprint's first NON-EMPTY stage. Some blueprints have an
// empty leading stage (e.g. "Initiate Workflow" with no tasks), so cb.stages[0] can
// be task-less — using it as the entry breaks the parent→child handoff edge.
function lvChildEntryTask(cb){
  if(!cb||!cb.stages)return null;
  for(var i=0;i<cb.stages.length;i++){if(cb.stages[i].tasks&&cb.stages[i].tasks.length)return cb.stages[i].tasks[0];}
  return null;
}
// Per-stage task flow from REAL dependencies (depIds = display ids of the tasks a
// task starts after, within the same blueprint). Returns {entries, terminals} —
// entries have no in-stage predecessor, terminals no in-stage successor — so the
// stage→stage and within-stage walkers connect the true branch/merge points
// rather than naive array order.
function lvStageTaskFlow(s){
  var ids={};s.tasks.forEach(function(t){ids[t.id]=1});
  var hasPred={},hasSucc={},inStageDeps={};
  s.tasks.forEach(function(t){
    // Only deps that point at another task IN THIS stage count for within-stage flow.
    var deps=(t.depIds||[]).filter(function(d){return ids[d]&&d!==t.id});
    inStageDeps[t.id]=deps;
    if(deps.length)hasPred[t.id]=1;
    deps.forEach(function(d){hasSucc[d]=1});
  });
  var entries=[],terminals=[];
  s.tasks.forEach(function(t){
    if(!hasPred[t.id])entries.push(t.id);
    if(!hasSucc[t.id])terminals.push(t.id);
  });
  // Fallback: if NO task in the stage declares a dependency, the .rex carried no
  // task-level ordering — treat array order as the chain (entry=first, term=last)
  // so behavior matches the old model for those stages.
  var anyDep=s.tasks.some(function(t){return inStageDeps[t.id].length});
  if(!anyDep&&s.tasks.length){
    entries=[s.tasks[0].id];terminals=[s.tasks[s.tasks.length-1].id];
  }
  return{entries:entries,terminals:terminals,inStageDeps:inStageDeps,anyDep:anyDep};
}
function lvBuildSequenceEdges(){
  var edges=[];
  // Within-stage task flow: draw an edge for every real dependency dep→task. For a
  // task with no in-stage dependency that isn't itself an entry-only stage start,
  // link it from each stage entry so nothing floats (user choice: "link from stage
  // start"). When a stage has no declared deps, fall back to the array-order chain.
  function walkSequential(sList){
    sList.forEach(function(s){
      if(s.tasks.length<2)return;
      var tf=lvStageTaskFlow(s);
      if(!tf.anyDep){
        for(var i=0;i<s.tasks.length-1;i++)edges.push({from:s.tasks[i].id,to:s.tasks[i+1].id,kind:'task'});
        return;
      }
      var entrySet={};tf.entries.forEach(function(e){entrySet[e]=1});
      s.tasks.forEach(function(t){
        var deps=tf.inStageDeps[t.id];
        if(deps.length){
          deps.forEach(function(d){edges.push({from:d,to:t.id,kind:'task'})});
        }else if(!entrySet[t.id]){
          // no in-stage dependency and not an entry → wire from each stage entry
          tf.entries.forEach(function(e){if(e!==t.id)edges.push({from:e,to:t.id,kind:'task'})});
        }
      });
    });
  }
  function walkFlow(flow,sList){
    if(!flow)return;
    var byId={};sList.forEach(function(s){byId[s.id]=s});
    // Forward adjacency over the stage graph (fromStageId -> [toStageId,...]), used to
    // bridge ACROSS empty middle stages (e.g. a task-less gate stage): when a flow
    // target has 0 tasks, walk forward to the next non-empty stage(s) so the non-empty
    // stages on either side stay visually connected instead of orphaned.
    var nextOf={};
    flow.forEach(function(e){(nextOf[e[0]]=nextOf[e[0]]||[]).push(e[1])});
    // Resolve a flow target id to the set of NEAREST non-empty stages reachable by
    // walking forward through empty (task-less) stages. The shared `seen` set makes
    // this provably terminating even if the stage graph contains a cycle of empty
    // stages, and each branch stops descending the moment it hits a non-empty stage.
    function resolveTargets(startId,seen){
      var out=[];
      (function visit(id){
        if(seen[id])return;seen[id]=1;
        var s=byId[id];
        if(s&&s.tasks.length){out.push(s);return;} // nearest non-empty on this branch
        (nextOf[id]||[]).forEach(visit);            // empty (or unknown) → keep walking
      })(startId);
      return out;
    }
    // De-dupe across the WHOLE flow for this blueprint, keyed by (terminalTask,entryTask).
    // Bridging makes it possible for two flow edges (e.g. a diamond A→gate1→C and
    // A→gate2→C) to resolve to the same source-terminal→target-entry pair; without this
    // the raw edge list — which is iterated directly when drawing connectors — would
    // gain a duplicate and paint a doubled arrow.
    var pushed={};
    flow.forEach(function(e){
      var from=byId[e[0]];
      // An empty source has no terminal tasks to emit from. The flow edge feeding INTO
      // this empty stage resolves forward through it (below), so its upstream non-empty
      // predecessor still bridges across — no handoff is lost.
      if(!from||!from.tasks.length)return;
      // Target stage(s): a non-empty e[1] is just [that stage] (original behavior); an
      // empty e[1] is bridged forward to the next non-empty stage(s).
      var direct=byId[e[1]];
      var targets=(direct&&direct.tasks.length)?[direct]:resolveTargets(e[1],{});
      if(!targets.length)return;
      // Connect the source stage's TRUE terminal tasks → each resolved target stage's
      // TRUE entry tasks (dependency-aware), so a branching stage hands off from each of
      // its real end points into each real start of the next (non-empty) stage.
      var sf=lvStageTaskFlow(from);
      sf.terminals.forEach(function(ft){
        targets.forEach(function(to){
          lvStageTaskFlow(to).entries.forEach(function(en){
            var k=ft+'␟'+en;
            if(pushed[k])return;pushed[k]=1;
            edges.push({from:ft,to:en,kind:'stage'});
          });
        });
      });
    });
  }
  function walkChildLinks(sList){
    sList.forEach(function(s){
      s.tasks.forEach(function(t){
        if(!t._isChildLink||t._childIdx==null)return;
        var cb=childBlueprints[t._childIdx];
        var entry=lvChildEntryTask(cb);
        if(!entry)return;
        edges.push({from:t.id,to:entry.id,kind:'child'});
      });
    });
  }
  walkSequential(stages);
  walkFlow(stageFlow,stages);
  walkChildLinks(stages);
  childBlueprints.forEach(function(cb){
    walkSequential(cb.stages);
    walkFlow(cb.flow,cb.stages);
    walkChildLinks(cb.stages);
  });

  // ---- Flow contraction (Full Process ON) ----------------------------------
  // A hidden invocation card (lvTaskHidden) is replaced in-place by its child:
  // edges INTO it reroute to the child's entry task; edges OUT of it reroute from
  // the child's exit/terminal task(s). Recurses for grandchildren. Boundary edges
  // (one end was hidden) are marked kind:'child' so they render dashed-purple,
  // visually wiring the parent flow through the sub-workflow.
  if(fullProcess){
    // _seen guards against a pathological self/cyclic child invocation: without it
    // these recursions would stack-overflow and take down the whole page.
    function entryOfTask(tid,_seen){
      var t=taskMap[tid];
      if(t&&lvTaskHidden(t)&&t._childIdx!=null&&!(_seen&&_seen[tid])){
        var cb=childBlueprints[t._childIdx];
        var entry=lvChildEntryTask(cb);
        if(entry){(_seen=_seen||{})[tid]=1;return entryOfTask(entry.id,_seen);}
      }
      return tid;
    }
    function childTerminals(cb){
      var byId={};cb.stages.forEach(function(s){byId[s.id]=s});
      var hasOut={};
      // Within-stage successors come from the REAL dependency DAG (a task has an
      // out-edge if it's a terminal's predecessor); cross-stage out-edges flow from
      // the source stage's true terminal tasks.
      cb.stages.forEach(function(s){
        var tf=lvStageTaskFlow(s),termSet={};tf.terminals.forEach(function(x){termSet[x]=1});
        s.tasks.forEach(function(t){if(!termSet[t.id])hasOut[t.id]=1});
      });
      (cb.flow||[]).forEach(function(e){var f=byId[e[0]];if(f&&f.tasks.length){lvStageTaskFlow(f).terminals.forEach(function(x){hasOut[x]=1})}});
      var terms=[];cb.stages.forEach(function(s){s.tasks.forEach(function(t){if(!hasOut[t.id])terms.push(t.id)})});
      return terms;
    }
    function exitsOfTask(tid,_seen){
      var t=taskMap[tid];
      if(t&&lvTaskHidden(t)&&t._childIdx!=null&&!(_seen&&_seen[tid])){
        var cb=childBlueprints[t._childIdx];
        if(cb){(_seen=_seen||{})[tid]=1;var out=[];childTerminals(cb).forEach(function(x){out=out.concat(exitsOfTask(x,_seen))});return out.length?out:[tid]}
      }
      return [tid];
    }
    function hidden(tid){var t=taskMap[tid];return!!(t&&lvTaskHidden(t))}
    var contracted=[],seenE={};
    edges.forEach(function(e){
      var fromHidden=hidden(e.from),toHidden=hidden(e.to);
      // The invocation→childEntry link is redundant once in-edges reroute to entry.
      if(fromHidden&&e.kind==='child')return;
      var froms=fromHidden?exitsOfTask(e.from):[e.from];
      var to=toHidden?entryOfTask(e.to):e.to;
      var boundary=fromHidden||toHidden;
      froms.forEach(function(f){
        if(f===to)return;
        var kind=boundary?'child':e.kind;
        var k=f+'␟'+to+'␟'+kind;
        if(seenE[k])return;seenE[k]=1;
        contracted.push({from:f,to:to,kind:kind});
      });
    });
    return contracted;
  }
  return edges;
}

// Cache the computed sequence edges + adjacency for fast lookup.
var lvSeqEdgesCache=null,lvSeqAdjCache=null;
function lvGetSeqEdges(){
  if(!lvSeqEdgesCache){
    lvSeqEdgesCache=lvBuildSequenceEdges();
    lvSeqAdjCache={up:{},dn:{}};
    lvSeqEdgesCache.forEach(function(e){
      (lvSeqAdjCache.dn[e.from]=lvSeqAdjCache.dn[e.from]||new Set()).add(e.to);
      (lvSeqAdjCache.up[e.to]=lvSeqAdjCache.up[e.to]||new Set()).add(e.from);
    });
  }
  return lvSeqEdgesCache;
}

// Tasks render in their original stage-array order — that IS the sequence.
function lvOrderCellTasks(tasks){return tasks.slice()}

// Real sequence edge between a and b?
function lvIsEdge(a,b){
  lvGetSeqEdges();
  return!!(lvSeqAdjCache.dn[a]&&lvSeqAdjCache.dn[a].has(b));
}

function lvTaskHasField(t,f){
  for(var i=0;i<t.inputs.length;i++)if(t.inputs[i].n===f)return true;
  for(var j=0;j<t.outputs.length;j++)if(t.outputs[j].n===f)return true;
  return false;
}

function lvCardClick(tid,ev){
  // Task Map 2 reuses lvRenderCard (which bakes in this onclick) but has its own
  // selection model (tm2CardAreaClick). When a TM2 card is clicked, defer to that and
  // do NOT touch Task Map 1's selection state.
  if(curTab==='tmap2')return;
  if(ev)ev.stopPropagation();
  if(lvActiveTaskId===tid&&!lvTraceField){lvActiveTaskId=null;lvSyncFieldLegendSelection();lvApplyTraceClasses();return}
  // Click cycles: first click highlights connected tasks; click another card to switch; click empty to clear
  // Clicking a card supersedes any field selection, so resync the legend (clears
  // its active row / Clear button) to match the now-null lvTraceField.
  lvActiveTaskId=tid;lvTraceField=null;
  lvSyncFieldLegendSelection();
  lvApplyTraceClasses();
}

function lvTraceFieldClick(fname,ev){
  if(ev)ev.stopPropagation();
  if(lvTraceField===fname){lvTraceField=null;}      // toggle off
  else{lvTraceField=fname;lvActiveTaskId=null;}
  // Lightweight: just retag cards + the legend selection and redraw edges — no full
  // re-render, so the legend panel and scroll position stay put.
  lvSyncFieldLegendSelection();
  lvApplyTraceClasses();
}

function lvExitTrace(){
  lvTraceField=null;lvActiveTaskId=null;
  lvSyncFieldLegendSelection();
  lvApplyTraceClasses();
}

// Reflect the current lvTraceField in the legend (selected row + clear button state)
// without re-rendering the whole view.
function lvSyncFieldLegendSelection(){
  var panel=document.getElementById('lv-field-legend');if(!panel)return;
  panel.querySelectorAll('.lv-fl-item').forEach(function(it){
    it.classList.toggle('active',it.dataset.field===lvTraceField);
  });
  var clr=document.getElementById('lv-fl-clear');
  if(clr)clr.style.display=lvTraceField?'':'none';
  var cnt=document.getElementById('lv-fl-selcount');
  if(cnt){
    if(lvTraceField){
      var ff=lvGetFieldFlow().map[lvTraceField];
      var np=ff?Object.keys(ff.producers).length:0,nc=ff?Object.keys(ff.consumers).length:0;
      cnt.textContent=np+' produce · '+nc+' consume';
    }else cnt.textContent='';
  }
}

// The floating field legend (Data Flow ON). Lists every flowing field; each row is
// clickable to highlight its producers/consumers. Includes a quick filter box.
function lvRenderFieldLegend(){
  var ff=lvGetFieldFlow();
  var n=ff.list.length;
  var h='<div class="lv-field-legend" id="lv-field-legend">';
  h+='<div class="lv-fl-head">';
  h+='<div class="lv-fl-title">Data Fields <span class="lv-fl-count">'+n+'</span></div>';
  h+='<button class="lv-fl-clear" id="lv-fl-clear" style="display:'+(lvTraceField?'':'none')+'" onclick="lvExitTrace()">Clear</button>';
  h+='</div>';
  h+='<div class="lv-fl-selcount" id="lv-fl-selcount"></div>';
  if(n>8)h+='<input class="lv-fl-search" id="lv-fl-search" placeholder="Filter fields…" oninput="lvFieldLegendFilter(this.value)">';
  h+='<div class="lv-fl-list">';
  ff.list.forEach(function(f){
    var np=Object.keys(f.producers).length,nc=Object.keys(f.consumers).length;
    var sel=lvTraceField===f.field?' active':'';
    // Field name passed via data-field (read by the delegated click handler) — NOT
    // an inline onclick string, so names with quotes/apostrophes can't break it.
    h+='<div class="lv-fl-item'+sel+'" data-field="'+escHtml(f.field)+'" data-search="'+escHtml(f.field.toLowerCase())+'" title="'+escHtml(f.field)+(f.type?' ('+escHtml(f.type)+')':'')+'">';
    h+='<span class="lv-fl-dot"></span>';
    h+='<span class="lv-fl-name">'+escHtml(f.field)+'</span>';
    h+='<span class="lv-fl-io"><span class="lv-fl-io-p" title="'+np+' producer'+(np===1?'':'s')+'">'+np+'&#8593;</span><span class="lv-fl-io-c" title="'+nc+' consumer'+(nc===1?'':'s')+'">'+nc+'&#8595;</span></span>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

// Delegated click for legend rows — reads the field from data-field (quote-safe).
function lvFieldLegendClick(ev){
  var item=ev.target.closest?ev.target.closest('.lv-fl-item'):null;
  if(!item||!item.dataset.field)return;
  lvTraceFieldClick(item.dataset.field,ev);
}

// Quick filter for the field legend (no re-render; just toggles row visibility).
function lvFieldLegendFilter(q){
  q=(q||'').trim().toLowerCase();
  var list=document.querySelectorAll('#lv-field-legend .lv-fl-item');
  list.forEach(function(it){
    var match=!q||it.dataset.search.indexOf(q)!==-1;
    it.style.display=match?'':'none';
  });
}

function lvApplyTraceClasses(){
  var grid=document.getElementById('lv-grid');if(!grid)return;
  lvGetSeqEdges();
  var up=lvActiveTaskId?(lvSeqAdjCache.up[lvActiveTaskId]||new Set()):null;
  var dn=lvActiveTaskId?(lvSeqAdjCache.dn[lvActiveTaskId]||new Set()):null;
  // For field trace: a task is a producer if the field is one of its outputs, a
  // consumer if it's one of its inputs (a task can be both).
  var ff=lvTraceField?lvGetFieldFlow().map[lvTraceField]:null;
  grid.querySelectorAll('.lv-card').forEach(function(c){
    var tid=c.dataset.tid;
    c.classList.remove('lv-active','lv-related-up','lv-related-dn','lv-dim','lv-traced','lv-fprod','lv-fcons');
    if(!lvActiveTaskId&&!lvTraceField)return;
    if(lvActiveTaskId){
      if(tid===lvActiveTaskId)c.classList.add('lv-active');
      else if(up.has(tid))c.classList.add('lv-related-up');
      else if(dn.has(tid))c.classList.add('lv-related-dn');
      else c.classList.add('lv-dim');
    }else if(lvTraceField){
      var isProd=ff&&ff.producers[tid],isCons=ff&&ff.consumers[tid];
      if(isProd||isCons){
        c.classList.add('lv-traced');
        if(isProd)c.classList.add('lv-fprod');
        if(isCons)c.classList.add('lv-fcons');
      }else c.classList.add('lv-dim');
    }
  });
  lvDrawEdges();
}

// Cached boundaries of the cards area (set at start of lvDrawEdges).
var lvBodyTopCache=0,lvBodyLeftCache=0;
function lvBodyTop(){return lvBodyTopCache}
function lvBodyLeft(){return lvBodyLeftCache}
// Card rects for the current render (set in lvDrawEdges), used by lvGutterPath to
// test whether a direct corridor between two cards is clear of intervening cards.
var lvCardRects={},lvCardList=[];
// Is the horizontal band [y-pad, y+pad] blocked by any card strictly between
// x0 and x1 (exclusive of the two endpoint cards)? Used to decide whether a forward
// edge can run straight across at the cards' own y, or must detour to a row-gap.
function lvCorridorBlockedH(x0,x1,y,pad,exclude){
  var lo=Math.min(x0,x1),hi=Math.max(x0,x1);
  for(var i=0;i<lvCardList.length;i++){
    var c=lvCardList[i];if(c===exclude.s||c===exclude.t)continue;
    var cl=c.x-c.w/2,cr=c.x+c.w/2,ct=c.y-c.h/2,cb=c.y+c.h/2;
    if(cr>lo+1&&cl<hi-1&&cb>y-pad&&ct<y+pad)return true; // card overlaps the band & x-span
  }
  return false;
}
function lvCorridorBlockedV(y0,y1,x,pad,exclude){
  var lo=Math.min(y0,y1),hi=Math.max(y0,y1);
  for(var i=0;i<lvCardList.length;i++){
    var c=lvCardList[i];if(c===exclude.s||c===exclude.t)continue;
    var cl=c.x-c.w/2,cr=c.x+c.w/2,ct=c.y-c.h/2,cb=c.y+c.h/2;
    if(cb>lo+1&&ct<hi-1&&cr>x-pad&&cl<x+pad)return true;
  }
  return false;
}
// Polish an orthogonal arrow path "M x y L x y L x y …" (axis-aligned segments):
//  (1) zero sub-pixel degenerate segments by snapping the tiny OFF-AXIS delta, so
//      a phantom near-zero kink becomes a clean elbow (never a diagonal);
//  (2) collapse a cosmetic co-axial "jog" — two long parallel legs joined by a
//      short (<12px) perpendicular nudge — onto one coordinate, BUT only when the
//      merged straight line is card-free (segClear), so real card-dodging detours
//      survive; (3) drop redundant collinear/duplicate vertices.
// Pure string→string; endpoints (M start + final anchor) never move; idempotent;
// orientation-agnostic (classifies each segment by which coord it shares).
// segClear(axis,fixedCoord,from,to) → true if that axis-aligned segment is clear
// of cards (caller wires it to lvCorridorBlockedH/V with this edge's s,t excluded).
function lvSimplifyPath(d,segClear){
  var EPS=1e-6,DEGEN=1.0,JOG=12;
  if(typeof d!=='string'||d.indexOf('L')===-1)return d;
  var nums=d.match(/-?\d+(?:\.\d+)?/g);
  if(!nums||nums.length<4)return d;
  var p=[];

    // dim everything else (sequence + other df edges) so the field's path pops.
    if(lvTraceField){
      if(p.kind==='df'&&p.fields&&p.fields.indexOf(lvTraceField)!==-1)path.classList.add('lv-edge-fhi');
      else path.classList.add('lv-edge-dim');
    }
    svg.appendChild(path);
  });
  // Render multi-field count badges on top of the arrows.
  dfLabels.forEach(function(l){
    // When a field is traced, only badge the arrows that carry it (others are dim).
    var dim=lvTraceField&&l.fields.indexOf(lvTraceField)===-1;
    var g=document.createElementNS(ns,'g');
    g.setAttribute('class','lv-df-badge'+(dim?' lv-edge-dim':''));
    // Single digit → a true circle (R=8). 2+ digits → a horizontal stadium/pill that
    // grows in width only, so the badge never looks like a squashed egg.
    var R=8;
    if(l.n>=10){
      var halfW=4+String(l.n).length*3; // pill half-width grows with digit count
      var rr=document.createElementNS(ns,'rect');
      rr.setAttribute('x',l.x-halfW);rr.setAttribute('y',l.y-R);
      rr.setAttribute('width',halfW*2);rr.setAttribute('height',R*2);
      rr.setAttribute('rx',R);rr.setAttribute('ry',R);
      g.appendChild(rr);
    }else{
      var c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',l.x);c.setAttribute('cy',l.y);c.setAttribute('r',R);
      g.appendChild(c);
    }
    var txt=document.createElementNS(ns,'text');
    // Centered both ways: text-anchor:middle (x) + dominant-baseline:central (y),
    // placed exactly at the badge's geometric center — no manual baseline offset.
    txt.setAttribute('x',l.x);txt.setAttribute('y',l.y);txt.textContent=l.n;
    g.appendChild(txt);
    var ttl=document.createElementNS(ns,'title');ttl.textContent=l.n+' fields: '+l.fields.join(', ');
    g.appendChild(ttl);
    svg.appendChild(g);
  });
  // Restore the zoom we cleared for measurement
  if(wrap)wrap.style.zoom=prevTransform;
}

// Midpoint of an orthogonal polyline 'd' (M x y L x y …) — the vertex nearest the
// halfway point along the path, used to place the multi-field count badge.
function lvPathMidpoint(d){
  var nums=d.match(/-?\d+(\.\d+)?/g);if(!nums||nums.length<4)return null;
  var pts=[];for(var i=0;i+1<nums.length;i+=2)pts.push({x:parseFloat(nums[i]),y:parseFloat(nums[i+1])});
  if(pts.length<2)return null;
  // total length + find midpoint along segments
  var segLen=[],total=0;
  for(var j=1;j<pts.length;j++){var dx=pts[j].x-pts[j-1].x,dy=pts[j].y-pts[j-1].y;var L=Math.sqrt(dx*dx+dy*dy);segLen.push(L);total+=L;}
  var half=total/2,acc=0;
  for(var k=1;k<pts.length;k++){
    var L2=segLen[k-1];
    if(acc+L2>=half){var f=L2?(half-acc)/L2:0;return{x:pts[k-1].x+(pts[k].x-pts[k-1].x)*f,y:pts[k-1].y+(pts[k].y-pts[k-1].y)*f};}
    acc+=L2;
  }
  return pts[Math.floor(pts.length/2)];
}

// Route an edge between two cards with strict directional anchors:
//   Horizontal mode: every edge EXITS the source's RIGHT edge and ENTERS the
//                    target's LEFT edge. Always L→R, even when target is in
//                    the same column or "behind" the source visually — we
//                    detour around the right side.
//   Vertical mode:   every edge EXITS the source's BOTTOM and ENTERS the
//                    target's TOP. Always T→B.
// fanIn/fanOut spread shifts the anchors PERPENDICULARLY to the entry axis so
// multiple edges sharing a source or target card don't sit on the same point.
// Lane spread shifts the gutter "channel" used by the path so two edges
// traveling in the same direction don't overlay each other on the same y/x.
// opts: { dataFlow, fanOut, fanOutTotal, fanIn, fanInTotal, lane, laneTotal }
function lvGutterPath(s,t,opts){
  if(typeof opts==='boolean')opts={dataFlow:opts};
  opts=opts||{};
  var off=opts.dataFlow?5:0;
  var isH=lvOrientation==='h';

  function spread(idx,total,size){
    if(!total||total<=1)return 0;
    var range=size*0.6;
    return -range/2 + range*(idx/(total-1));
  }
  // Lateral spread (perpendicular to entry axis) so multiple edges hitting the
  // same card spread along its border instead of stacking on one point.
  // EXCEPTION — shared port (Problem 2): when an edge belongs to a fan group
  // (srcPort = this source fans out to >=2 targets; tgtPort = this target fans
  // in from >=2 sources) we ZERO the lateral spread so all members share ONE
  // exit/entry point on the card border. They then diverge into their distinct
  // gutter channels (srcChanOff/tgtChanOff), so the eye reads "one line that
  // splits into N" (fan-out) or "N lines that merge into one" (fan-in) instead
  // of N independent lines leaving/entering different points on the card.
  var srcLat=opts.srcPort?0:spread(opts.fanOut||0,opts.fanOutTotal||0,Math.min(s.w,s.h));
  var tgtLat=opts.tgtPort?0:spread(opts.fanIn||0,opts.fanInTotal||0,Math.min(t.w,t.h));
  // Three independent channel offsets — one per parallel segment of the path.
  // Each spreads parallel edges so they don't overlay.
  function chanOff(idx,total){
    if(!total||total<=1)return 0;
    return (-(total-1)/2 + idx) * 8;
  }
  var srcChanOff=chanOff(opts.srcChan||0,opts.srcChanTotal||0);
  var midChanOff=chanOff(opts.midChan||0,opts.midChanTotal||0);
  // FAN-IN MERGE (mirror of the fan-out shared port): when this target fans in from
  // >=2 sources (tgtPort), zero the target-side channel offset so every incoming edge
  // runs the SAME target-gutter vertical into the shared entry point — N near-parallel
  // approach verticals collapse to ONE column ("N lines merge into one"). tgtLat is
  // already zeroed by tgtPort, so the final stub is identical for all members; each
  // edge's own source riser keeps the sources distinguishable until the merge. Feeds
  // every target-side consumer (fanSpine dropX, forward tgtLeftGap, backward leftDetour,
  // and the vertical-orientation tgtTopGap/topDetour), so it works in both orientations.
  var tgtChanOff=opts.tgtPort?0:chanOff(opts.tgtChan||0,opts.tgtChanTotal||0);

  var sCell=s.cell.getBoundingClientRect();var tCell=t.cell.getBoundingClientRect();
  var grid=document.getElementById('lv-grid');var gr=grid.getBoundingClientRect();
  var gridStyle=window.getComputedStyle(grid);
  var rowGap=parseFloat(gridStyle.rowGap)||16;
  var colGap=parseFloat(gridStyle.columnGap)||22;
  var sC={left:sCell.left-gr.left,right:sCell.right-gr.left,top:sCell.top-gr.top,bottom:sCell.bottom-gr.top};
  var tC={left:tCell.left-gr.left,right:tCell.right-gr.left,top:tCell.top-gr.top,bottom:tCell.bottom-gr.top};
  // Boundaries of the cards area: top of first lane row (after headers), and
  // left of first stage column (after lane labels). Used to clamp routing so
  // edges never travel through the header strip or the lane-label column.
  var bodyTop=lvBodyTop(),bodyLeft=lvBodyLeft();

  if(isH){
    // ALWAYS exit right edge of source, enter left edge of target. Lateral
    // offsets shift the y-anchor (perpendicular to entry axis).
    var sx=s.x+s.w/2;
    var sy=s.y+srcLat+off;
    var tx=t.x-t.w/2;
    var ty=t.y+tgtLat+off;
    // SAME-COLUMN, cross-lane edge: source & target sit in the same stage column but
    // different lane rows, so the target is directly above/below the source. The
    // exit-right/enter-left rule would force an ugly backward detour (sweep out right,
    // down past every lane, back). Instead route a clean VERTICAL line through the
    // column at the cards' x — exit the source edge facing the target, enter the
    // target's opposite edge. (Same-lane same-cell pairs are handled earlier.)
    var sameCol=Math.abs(sC.left-tC.left)<2 && Math.abs(sC.right-tC.right)<2;
    if(sameCol){
      // A straight vertical line between the two cards is only safe if the lane span
      // between them is CLEAR. When cards are stacked in the source or target cell (or
      // a lane between them), the center vertical would cross them — so route the
      // vertical through the COLUMN GUTTER (the card-free gap just right of the cells).
      // The straight line is tested at the OFFSET x (s.x+srcChanOff), so a non-zero
      // channel offset no longer disqualifies an otherwise-clear straight route — it
      // just shifts where we test/draw it.
      var straightX=s.x+(srcChanOff||0);
      var vy0=t.y>=s.y?(s.y+s.h/2):(s.y-s.h/2), vy1=t.y>=s.y?(t.y-t.h/2):(t.y+t.h/2);
      var clearStraight=Math.abs(straightX-t.x)<2 &&
        !lvCorridorBlockedV(vy0,vy1,straightX,Math.max(s.w,t.w)/2-4,{s:s,t:t});
      if(clearStraight){
        return t.y>=s.y
          ? 'M'+straightX+' '+(s.y+s.h/2)+' L'+t.x+' '+(t.y-t.h/2)
          : 'M'+straightX+' '+(s.y-s.h/2)+' L'+t.x+' '+(t.y+t.h/2);
      }
      // Route vertically through the column gutter (right of the cells), card-free.
      // Search outward from the gap-center for an x where BOTH the gutter vertical and
      // the horizontal approach leg are obstacle-free; widen by the column gap (and into
      // the next gaps if needed) so it never clips this or an adjacent column's cards.
      var below=t.y>=s.y;
      var sEdgeY=below?(s.y+s.h/2):(s.y-s.h/2);
      var apprY=below?Math.max((t.y-t.h/2)-Math.min(12,rowGap*0.5), s.y+s.h/2)
                     :Math.min((t.y+t.h/2)+Math.min(12,rowGap*0.5), s.y-s.h/2);
      var gx=sC.right+colGap*0.4+(srcChanOff||0);
      var vLo=Math.min(sEdgeY,apprY), vHi=Math.max(sEdgeY,apprY);
      for(var gi=0;gi<6;gi++){
        var cand=Math.max(sC.right+2, Math.min(gx+gi*colGap, sC.right+colGap*(gi+1)-2));
        var vBlocked=lvCorridorBlockedV(vLo,vHi,cand,3,{s:s,t:t});
        var hBlocked=lvCorridorBlockedH(cand,t.x,apprY,Math.min(8,rowGap*0.45),{s:s,t:t})
                   ||lvCorridorBlockedH(s.x,cand,sEdgeY,3,{s:s,t:t});
        if(!vBlocked&&!hBlocked){gx=cand;break;}
        if(gi===5)gx=cand; // fall back to the farthest tried
      }
      return below
        ? 'M'+s.x+' '+sEdgeY+' L'+gx+' '+sEdgeY+' L'+gx+' '+apprY+' L'+t.x+' '+apprY+' L'+t.x+' '+(t.y-t.h/2)
        : 'M'+s.x+' '+sEdgeY+' L'+gx+' '+sEdgeY+' L'+gx+' '+apprY+' L'+t.x+' '+apprY+' L'+t.x+' '+(t.y+t.h/2);
    }
    var goingForward=tC.left>=sC.right;
    if(goingForward){
      // FAN-OUT SPINE (horizontal orientation only; the vertical goingForward2 block
      // below intentionally has no spine analog yet — vertical fan-outs are rarer).
      // Members of a same-row fan group share ONE source riser and ONE
      // flat horizontal spine in the target row-gap, so N edges read as "one line
      // splits into N" instead of a staircase of N offset horizontals. The riser x is
      // shared (no srcChanOff); the spine y is the target row-gap (no midChanOff); each
      // drop uses tgtChanOff so per-target drops stay laterally separated. The spine
      // is LOCAL (source col → group's target cols, in one card-free row-gap), so it
      // doesn't reintroduce the removed "long trunk" problem.
      if(opts.fanSpine){
        var riserX=sC.right + colGap*0.4;               // one shared riser, no srcChanOff
        var spineY=ty>sy ? tC.top - rowGap*0.5 : tC.bottom + rowGap*0.5;
        if(spineY<bodyTop+4)spineY=sC.bottom+rowGap*0.5;
        var dropX=tC.left - colGap*0.4 + tgtChanOff;     // per-target drop, separated
        // Keep the drop column left of the entry x so the final 'L dropX ty L tx ty'
        // stub points RIGHT into the target's left edge (a heavy fan-in tgtChanOff
        // could otherwise push dropX past tx and flip the arrowhead).
        if(dropX>tx-4)dropX=tx-Math.max(8,colGap*0.4);
        return'M'+sx+' '+sy+
               ' L'+riserX+' '+sy+
               ' L'+riserX+' '+spineY+
               ' L'+dropX+' '+spineY+
               ' L'+dropX+' '+ty+
               ' L'+tx+' '+ty;
      }
      // sameRow shortcut: a straight horizontal line when source and target sit at
      // the same y AND the corridor between them is clear of cards. A fan member
      // (srcPort/tgtPort) may still go straight if nothing's in the way — the old
      // blanket fan exemption forced even adjacent, unobstructed fan edges (e.g.
      // 1.1 -> 2.1) into an ugly jog. We only detour when a card actually blocks the
      // straight line (e.g. 2.4 -> 7.1 with cards between).
      if(Math.abs(sy-ty)<2 && !lvCorridorBlockedH(sx,tx,sy,Math.max(s.h,t.h)/2+6,{s:s,t:t})){
        return'M'+sx+' '+sy+' L'+tx+' '+ty;
      }
      // Three parallel channels, each with independent offset so parallel edges
      // sharing any one channel don't overlay:
      //   srcRightGap  → vertical channel in the column-gap right of source cell
      //   midY         → horizontal channel in the row-gap above (or below) target row
      //   tgtLeftGap   → vertical channel in the column-gap left of target cell
      var srcRightGap=sC.right + colGap*0.4 + srcChanOff;
      var tgtLeftGap=tC.left - colGap*0.4 + tgtChanOff;
      // Keep both risers INSIDE their card-free column gutters. A large channel offset
      // (many parallel df edges sharing one gutter) can otherwise push the vertical past
      // the gutter into the NEXT column's card bodies — the source riser would slice
      // down the left edge of the stacked cards one column over. Clamp to the gutter span
      // [cell edge, cell edge ± colGap]: heavily-shared risers compress toward the gutter
      // wall but never cross a card. No-op when the offset already fits the gutter.
      srcRightGap=Math.max(sC.right+2, Math.min(srcRightGap, sC.right+colGap-2));
      tgtLeftGap=Math.min(tC.left-2, Math.max(tgtLeftGap, tC.left-colGap+2));
      // Keep the final horizontal stub pointing RIGHT into the target's left edge:
      // the approach column must stay left of the entry x even after channel offset.
      if(tgtLeftGap>tx-4)tgtLeftGap=tx-Math.max(8,colGap*0.4);
      // CLEAR-CORRIDOR routing: prefer to run the horizontal mid-segment at the
      // midpoint y between the two cards (a clean short Z), and only detour out to a
      // far row-gap if a card actually sits in that corridor. This avoids the big
      // "dive to the bottom of a tall lane and climb back" when the intervening
      // columns are empty in this lane (the common case for sub-workflow handoffs).
      var midY=(sy+ty)/2 + midChanOff;
      var bandPad=Math.max(s.h,t.h)/2 + 6;
      var blocked=lvCorridorBlockedH(srcRightGap,tgtLeftGap,midY,bandPad,{s:s,t:t});
      if(blocked){
        // The simple midpoint corridor is blocked. For a long-haul edge spanning many
        // columns (the common cause), a single row-gap is rarely clear end-to-end, so
        // instead of the old 2-position guess we SEARCH candidate horizontal lanes for
        // the clearest corridor between source and target. Candidates: the two row-gaps
        // adjacent to source and target, then progressively wider gaps derived from the
        // actual card edges in the corridor's x-span. Prefer a fully-clear lane; if none
        // exists (genuinely crowded), pick the lane that minimizes card overlap.
        var pad=Math.max(s.h,t.h)/2+4;
        var lo=Math.min(srcRightGap,tgtLeftGap),hi=Math.max(srcRightGap,tgtLeftGap);
        // Collect candidate y's: just-above and just-below every card that sits in the
        // corridor's x-span, plus the source/target row gaps. Routing in these gaps
        // threads BETWEEN rows of stacked cards.
        var cand=[ty>sy?(tC.top-rowGap*0.5):(tC.bottom+rowGap*0.5),
                  ty>sy?(sC.bottom+rowGap*0.5):(sC.top-rowGap*0.5)];
        for(var ci=0;ci<lvCardList.length;ci++){
          var cc=lvCardList[ci];if(cc===s||cc===t)continue;
          var ccl=cc.x-cc.w/2,ccr=cc.x+cc.w/2;
          if(ccr>lo+1&&ccl<hi-1){cand.push(cc.y-cc.h/2-rowGap*0.5);cand.push(cc.y+cc.h/2+rowGap*0.5);}
        }
        // Evaluate each candidate; keep the first fully-clear one, else the least-blocked.
        var bestY=midY,bestClear=false,bestScore=Infinity;
        for(var k=0;k<cand.length;k++){
          var cy=cand[k];if(cy<bodyTop+4)continue;
          if(!lvCorridorBlockedH(lo,hi,cy,pad,{s:s,t:t})){bestY=cy;bestClear=true;break;}
          // score = how many cards this lane clips (lower is better), as a fallback
          var hits=0;
          for(var ci2=0;ci2<lvCardList.length;ci2++){var c2=lvCardList[ci2];if(c2===s||c2===t)continue;
            var c2l=c2.x-c2.w/2,c2r=c2.x+c2.w/2,c2t=c2.y-c2.h/2,c2b=c2.y+c2.h/2;
            if(c2r>lo+1&&c2l<hi-1&&c2b>cy-pad&&c2t<cy+pad)hits++;}
          if(hits<bestScore){bestScore=hits;bestY=cy;}
        }
        midY=bestY+ (bestClear?midChanOff:0);
        if(midY<bodyTop+4)midY=bodyTop+4;
      }
      return'M'+sx+' '+sy+
             ' L'+srcRightGap+' '+sy+
             ' L'+srcRightGap+' '+midY+
             ' L'+tgtLeftGap+' '+midY+
             ' L'+tgtLeftGap+' '+ty+
             ' L'+tx+' '+ty;
    }
    // Backward path: target is to the LEFT of source. We still must EXIT right
    // and ENTER left, so we detour: out the right, down to row-gap, sweep
    // around, up to target row, then into target's left.
    var detourY=Math.max(sC.bottom,tC.bottom)+rowGap*0.4 + midChanOff;
    var rightDetour=sC.right+colGap*0.4 + srcChanOff;
    var leftDetour=tC.left-colGap*0.4 + tgtChanOff;
    // Keep the final horizontal stub pointing RIGHT into the target's left edge:
    // the detour column must stay left of the entry x even after channel offset.
    if(leftDetour>tx-4)leftDetour=tx-Math.max(8,colGap*0.4);
    return'M'+sx+' '+sy+
           ' L'+rightDetour+' '+sy+
           ' L'+rightDetour+' '+detourY+
           ' L'+leftDetour+' '+detourY+
           ' L'+leftDetour+' '+ty+
           ' L'+tx+' '+ty;
  }else{
    // VERTICAL: ALWAYS exit bottom of source, enter top of target.
    var sx2=s.x+srcLat+off;
    var sy2=s.y+s.h/2;
    var tx2=t.x+tgtLat+off;
    var ty2=t.y-t.h/2;
    // SAME-ROW, cross-lane edge (vertical analog of the same-column case above): in
    // vertical orientation stages are rows and lanes are columns, so a same-stage
    // cross-lane edge shares a ROW and the target sits directly left/right of source.
    // Route a clean HORIZONTAL line through the row instead of the backward detour.
    var sameRow=Math.abs(sC.top-tC.top)<2 && Math.abs(sC.bottom-tC.bottom)<2;
    if(sameRow){
      // Straight horizontal only if the row center between the cards is CLEAR;
      // otherwise route through the ROW GUTTER (card-free gap below the cells).
      var clearStraightR=Math.abs(s.y-t.y)<2 && !srcChanOff &&
        !lvCorridorBlockedH(t.x>=s.x?(s.x+s.w/2):(s.x-s.w/2), t.x>=s.x?(t.x-t.w/2):(t.x+t.w/2), s.y, Math.max(s.h,t.h)/2-4, {s:s,t:t});
      if(clearStraightR){
        return t.x>=s.x
          ? 'M'+(s.x+s.w/2)+' '+s.y+' L'+(t.x-t.w/2)+' '+t.y
          : 'M'+(s.x-s.w/2)+' '+s.y+' L'+(t.x+t.w/2)+' '+t.y;
      }
      var gy=Math.max(sC.bottom+2, Math.min(sC.bottom + rowGap*0.4 + (srcChanOff||0), sC.bottom+rowGap-2));
      // Re-enter on the axis FACING the target (horizontal) so the arrowhead points
      // left/right into the side edge — not up/down. Run the gutter to an x just shy
      // of the target edge, cross to the target's y, then a short horizontal stub.
      if(t.x>=s.x){ // target right → exit source right, run gutter, enter target LEFT
        var apprX=Math.max((t.x-t.w/2)-Math.min(12,colGap*0.5), s.x+s.w/2);
        return'M'+(s.x+s.w/2)+' '+s.y+' L'+(s.x+s.w/2)+' '+gy+' L'+apprX+' '+gy+' L'+apprX+' '+t.y+' L'+(t.x-t.w/2)+' '+t.y;
      }else{ // target left → exit source left, run gutter, enter target RIGHT
        var apprX2=Math.min((t.x+t.w/2)+Math.min(12,colGap*0.5), s.x-s.w/2);
        return'M'+(s.x-s.w/2)+' '+s.y+' L'+(s.x-s.w/2)+' '+gy+' L'+apprX2+' '+gy+' L'+apprX2+' '+t.y+' L'+(t.x+t.w/2)+' '+t.y;
      }
    }
    var goingForward2=tC.top>=sC.bottom;
    if(goingForward2){
      // sameCol shortcut (vertical analog): straight line when aligned AND the
      // corridor is clear; only detour when a card actually blocks it.
      if(Math.abs(sx2-tx2)<2 && !lvCorridorBlockedV(sy2,ty2,sx2,Math.max(s.w,t.w)/2+6,{s:s,t:t})){
        return'M'+sx2+' '+sy2+' L'+tx2+' '+ty2;
      }
      // Three parallel channels (vertical analog):
      //   srcBotGap → horizontal channel in row-gap below source row
      //   midX      → vertical channel in col-gap left (or right) of target col
      //   tgtTopGap → horizontal channel in row-gap above target row
      var srcBotGap=sC.bottom + rowGap*0.4 + srcChanOff;
      var tgtTopGap=tC.top - rowGap*0.4 + tgtChanOff;
      // Keep the final vertical stub pointing DOWN into the target top: the approach
      // row must stay above the entry y even after channel offset (else a tiny
      // inverted stub flips the arrowhead).
      if(tgtTopGap>ty2-4)tgtTopGap=ty2-Math.max(8,rowGap*0.4);
      // CLEAR-CORRIDOR routing (vertical analog): run the vertical mid-segment at
      // the midpoint x between the two cards unless a card actually sits in that
      // corridor, in which case detour to a col-gap. Avoids sweeping to the far edge
      // of a wide lane when the intervening rows are empty in this column.
      var midX=(sx2+tx2)/2 + midChanOff;
      var bandPadV=Math.max(s.w,t.w)/2 + 6;
      var blockedV=lvCorridorBlockedV(srcBotGap,tgtTopGap,midX,bandPadV,{s:s,t:t});
      if(blockedV){
        midX = tx2>sx2
          ? tC.left - colGap*0.5 + midChanOff
          : tC.right + colGap*0.5 + midChanOff;
        if(midX < bodyLeft+4){
          midX = sC.right + colGap*0.5 + midChanOff;
        }
      }
      return'M'+sx2+' '+sy2+
             ' L'+sx2+' '+srcBotGap+
             ' L'+midX+' '+srcBotGap+
             ' L'+midX+' '+tgtTopGap+
             ' L'+tx2+' '+tgtTopGap+
             ' L'+tx2+' '+ty2;
    }
    // Backward: target is ABOVE source. Detour: out bottom, sweep around, into top.
    var detourX=Math.max(sC.right,tC.right)+colGap*0.4 + midChanOff;
    var bottomDetour=sC.bottom+rowGap*0.4 + srcChanOff;
    var topDetour=tC.top-rowGap*0.4 + tgtChanOff;
    // Keep the final vertical stub pointing DOWN into the target's top: the detour
    // row must stay at least a few px above the entry y, even after channel offset.
    if(topDetour>ty2-4)topDetour=ty2-Math.max(8,rowGap*0.4);
    return'M'+sx2+' '+sy2+
           ' L'+sx2+' '+bottomDetour+
           ' L'+detourX+' '+bottomDetour+
           ' L'+detourX+' '+topDetour+
           ' L'+tx2+' '+topDetour+
           ' L'+tx2+' '+ty2;
  }
}

// Compute the scale needed for the grid to fit inside the scroll viewport,
// taking the constraining axis to be lanes (Y in horizontal, X in vertical).
// Capped between 0.4 and 1.
function lvComputeFitScale(){
  var sc=document.querySelector('#tp-lane .lv-scroll');
  var wrap=document.querySelector('#tp-lane .lv-grid-wrap');
  var grid=document.getElementById('lv-grid');
  if(!sc||!wrap||!grid)return 1;
  // Read the natural size by temporarily clearing the zoom
  var prev=wrap.style.zoom;wrap.style.zoom='';
  var gw=grid.scrollWidth,gh=grid.scrollHeight;
  var vw=sc.clientWidth,vh=sc.clientHeight;
  wrap.style.zoom=prev;
  if(!gw||!gh||!vw||!vh)return 1;
  // Auto-fit constrains ONLY the lanes axis (Y in horizontal, X in vertical).
  // The flowing axis (stages) keeps natural size so text stays readable; user
  // scrolls horizontally to see all stages.
  var sx=vw/gw,sy=vh/gh;
  var s=lvOrientation==='h'?Math.min(sy,1):Math.min(sx,1);
  // Don't shrink below 0.7 — past that the 14px titles stop being readable. Below the
  // floor we clamp and let the user scroll rather than shrink the text into illegibility.
  if(s<0.7)s=0.7;
  if(s>1)s=1;
  return s;
}
function lvApplyScale(s){
  var wrap=document.querySelector('#tp-lane .lv-grid-wrap');if(!wrap)return;
  // Use CSS `zoom`, NOT transform:scale(). A transform makes the wrap a containing
  // block for position:sticky descendants, which breaks the frozen stage/lane headers
  // (they'd stick to the scrolling wrap instead of .lv-scroll). `zoom` scales layout
  // without establishing a containing block, so sticky resolves against .lv-scroll and
  // both header axes freeze. Edges live inside the wrap, so zoom scales them with the grid.
  if(s>=0.999){wrap.style.zoom=''}
  else{wrap.style.zoom=s}
  lvCurrentScale=s;
}
var lvCurrentScale=1;
// Swimlanes PRIORITIZES FIT-TO-SCREEN by default so the whole map is visible, but the
// fit scale is floored (lvComputeFitScale) so titles (14px) stay readable — below the
// floor it clamps and the user scrolls rather than shrinking text away. Reset Zoom drops
// to natural 1:1. Mirrors Task Map's tm2FitMode.
var lvFitMode=true;
function lvFit(){
  lvFitMode=true;
  var s=lvComputeFitScale();lvApplyScale(s);
  var sc=document.querySelector('#tp-lane .lv-scroll');
  if(sc){sc.scrollLeft=0;sc.scrollTop=0}
  requestAnimationFrame(lvDrawEdges);
}
function lvReset(){lvFitMode=false;lvApplyScale(1);requestAnimationFrame(lvDrawEdges)}

// ==============================================================
// TASK MAP 2 — single-axis natural flow (no lane axis)
// Tasks flow under stage bands, auto-laid-out by dagre (already loaded for the
// Stage Map). Reuses lvBuildAxes() for stage order/Full-Process, lvGetSeqEdges()
// for the contracted task flow, and lvRenderCard() for the card markup. Dropping
// the lane constraint lets dagre route the flow freely → a cleaner flowchart.
// ==============================================================
// Task Map 2 is always laid out horizontally (stages flow left→right). The vertical
// orientation toggle was removed; the layout's isH branches now always take the
// horizontal path.
var tm2Orient='h';
var tm2ShowDataFlow=false,tm2TraceField=null,tm2ActiveTaskId=null;
// Clear any selection/trace so a re-layout doesn't leave a stale highlight or a
// legend filtered to a task that may no longer be rendered.
function tm2ClearSelection(){tm2ActiveTaskId=null;tm2TraceField=null;}
function tm2ToggleDataFlow(){tm2ShowDataFlow=!tm2ShowDataFlow;tm2ClearSelection();renderTaskMap2();}

  h+='<button class="lv-btn" onclick="exportViewPDF(\'tmap2\')" title="Export this diagram as PDF">Export PDF</button>';
  h+='<div class="lv-legend">';

  if(tm2ShowDataFlow)h+='<span class="lv-legend-item"><span class="lv-legend-line lv-legend-df"></span>Data flow</span>';

  h+='</div>';
  h+='<div class="tm2-scroll"><div class="tm2-svg-wrap"><svg id="tm2-svg"><defs>'+
     '<marker id="tm2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--neutral-solid)"/></marker>'+
     '<marker id="tm2-arr-child" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--agent-pill-text)"/></marker>'+
     '<marker id="tm2-arr-df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--green)"/></marker>'+
     '</defs><g id="tm2-g"></g></svg></div></div>';
  // Legend MUST sit OUTSIDE .tm2-scroll: an absolutely-positioned child of a
  // scrolling element anchors to the scrolled CONTENT (so right:12px drifts as you
  // scroll). As a child of the non-scrolling #tp-tmap2 it stays pinned to the viewport.

  host.innerHTML=h;
  requestAnimationFrame(tm2Build);
  var legend=host.querySelector('#tm2-field-legend');
  if(legend){legend.querySelector('.lv-fl-list').addEventListener('click',tm2FieldLegendClick);tm2PositionFieldLegend();}
  if(!tm2ResizeBound){
    window.addEventListener('resize',function(){if(curTab==='tmap2')requestAnimationFrame(function(){if(tm2FitMode)tm2Fit();tm2PositionFieldLegend();})});
    tm2ResizeBound=true;

var tm2ResizeBound=false;
// Pin the field legend just below the toolbar and cap its height to the scroll
// viewport — anchored to #tp-tmap2 (non-scrolling) so it never drifts with scroll.
function tm2PositionFieldLegend(){
  var legend=document.getElementById('tm2-field-legend');if(!legend)return;
  var host=document.getElementById('tp-tmap2');var sc=host&&host.querySelector('.tm2-scroll');
  if(!host||!sc)return;
  var hostR=host.getBoundingClientRect(),scR=sc.getBoundingClientRect();
  legend.style.top=(scR.top-hostR.top+12)+'px';
  legend.style.maxHeight=(scR.height-24)+'px';
