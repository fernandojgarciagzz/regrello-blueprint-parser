// Task Map 2 layout uses an ORIENTATION-NATIVE frame so cards stay upright in both
// orientations (no blind x↔y swap of cards). Two axes:
//   FLOW axis  = the direction stages advance (X if horizontal, Y if vertical)
//   CROSS axis = the direction tasks stack within a stage (the other one)
// We compute each card's flow-coord (f) and cross-coord (g), then map to screen x/y
// via XY(f,g): horizontal → (x=f, y=g); vertical → (x=g, y=f).
function tm2Build(){
  var svgEl=document.getElementById('tm2-svg');if(!svgEl)return;
  var isH=tm2Orient==='h';
  var ax=lvBuildAxes();var cols=ax.cols;
  var colTasks=cols.map(function(c){return (c.stage.tasks||[]).filter(function(t){return !lvTaskHidden(t)})});
  var live=[];
  cols.forEach(function(c,ci){if(colTasks[ci].length)live.push({c:c,tasks:colTasks[ci]})});
  var root0=d3.select('#tm2-svg').select('#tm2-g');
  if(!live.length){root0.selectAll('*').remove();return;}

  var seq=lvGetSeqEdges();
  var taskCol={};live.forEach(function(L,col){L.tasks.forEach(function(t){taskCol[t.id]=col})});
  var flowEdges=seq.filter(function(e){return taskCol[e.from]!=null&&taskCol[e.to]!=null&&e.from!==e.to});

  // Geometry (flow/cross frame). CARDW along the cross axis; bands span the flow.
  // Vertical rows are inherently short (one card tall) and span wide, so they need a
  // bigger flow gap + a label strip baked into the band depth to avoid the squished
  // look. Horizontal keeps its tighter gap (columns are already tall).
  var CARDW=210, FGAP=isH?92:120, CROSSGAP=22, MF=28, LABELF=34;
  // TOP CROSS-MARGIN layout (so nothing collides): stage labels occupy the very top
  // strip; the skip-edge routing lanes sit BELOW the labels; then the cards start.
  // Skip edges (jump >1 stage) run flow-parallel at a constant CROSS position in their
  // reserved lane band, clear of both labels and cards.
  //   cross:  [0 .. LABELBAND] label  |  [LABELBAND .. CROSS0] skip lanes  |  [CROSS0 ..] cards
  var skipEdges=flowEdges.filter(function(e){return taskCol[e.to]-taskCol[e.from]>1});
  var SKIPN=skipEdges.length, SKIPGAP=12;   // no cap: every skip edge gets its own lane (skipBandH/CROSS0 grow to fit)
  var skipBandH=SKIPN>0?(SKIPN*SKIPGAP+10):0;
  // If ANY visible stage carries a condition, reserve extra cross-space in the top label
  // band so the IF-pill can sit below the stage name. Applied uniformly so every column's
  // cards still start at the same CROSS0 (row alignment preserved).
  // Reserve extra top-band cross-space for condition pills — MEASURED, not guessed, so a
  // long wrapped "IF…" pill is never clipped. Measure each conditional stage's header at a
  // representative width and take the max overflow beyond the bare name line (~22px).
  var condCols=live.filter(function(L){return lvTm2HasCond(L.c)});
  var CONDBAND=0;
  if(condCols.length){
    var maxLabelH=0;
    condCols.forEach(function(L){var h=tm2MeasureLabelHeight(L.c,200);if(h>maxLabelH)maxLabelH=h;});
    CONDBAND=Math.max(0,maxLabelH-28)+6; // overflow beyond the name line + small breathing room (name line ~28px at 14px/1.3 + padding)
  }
  var LABELBAND=MF+LABELF+CONDBAND;     // cross-space the stage label (+condition) occupies at the top
  var LEADF=LABELF;            // flow-space reserved at each band's start (label)
  var CROSS0=LABELBAND+skipBandH+10;   // first card's cross-coord (below label + skip lanes)
  var skipLaneG={};skipEdges.forEach(function(e,i){skipLaneG[e.from+'>'+e.to]=LABELBAND+6+i*SKIPGAP});

  // Place cards: within each stage, tasks lay out along the CROSS axis in array order;
  // stages advance along the FLOW axis. A card is ALWAYS 210 wide × measured-height
  // tall on screen. Cards start at LEADF into the band (after the label strip). Band
  // flow-depth = LEADF + tallest card's flow-extent, so vertical rows are tall enough
  // to hold the label above the cards (no squish).
  var pos={}; // tid -> {f,g, sw,sh, cardFlow,cardCross, col}
  var colMeta=[];
  var cursorF=MF;
  live.forEach(function(L,col){
    var g=CROSS0, maxCardFlow=0;
    L.tasks.forEach(function(t){
      var d=tm2MeasureCard(t);
      var cardFlow=isH?CARDW:d.h;   // extent ALONG the flow axis
      var cardCross=isH?d.h:CARDW;  // extent ALONG the cross axis
      pos[t.id]={f:cursorF+LEADF,g:g,col:col,sw:CARDW,sh:d.h,cardFlow:cardFlow,cardCross:cardCross};
      g+=cardCross+CROSSGAP;
      if(cardFlow>maxCardFlow)maxCardFlow=cardFlow;
    });
    var depth=LEADF+maxCardFlow;
    colMeta.push({f:cursorF,depth:depth,leadF:LEADF,crossEnd:g-CROSSGAP,c:L.c,col:col});
    cursorF+=depth+FGAP;
  });
  var flowTotal=cursorF-FGAP+MF;
  var crossMax=0;colMeta.forEach(function(m){if(m.crossEnd>crossMax)crossMax=m.crossEnd});
  var crossTotal=crossMax+MF;

  // Per-column card cross-centers, so the edge router can tell when a same-column pair
  // has OTHER cards stacked between them — a straight cross connector would slice
  // through those cards, so such pairs must bow out around them (see tm2EdgePath).
  var colCross={};
  Object.keys(pos).forEach(function(tid){var p=pos[tid];(colCross[p.col]=colCross[p.col]||[]).push(p.g+p.cardCross/2)});
  function colHasBetween(col,lo,hi){var a=colCross[col]||[];for(var i=0;i<a.length;i++){if(a[i]>lo+1&&a[i]<hi-1)return true}return false}

  // map flow/cross → screen x/y
  function XY(f,g){return isH?{x:f,y:g}:{x:g,y:f}}
  var totalW=isH?flowTotal:crossTotal, totalH=isH?crossTotal:flowTotal;

  var svg=d3.select('#tm2-svg'),root=svg.select('#tm2-g');root.selectAll('*').remove();

  // --- stage bands + labels ---
  var bandG=root.append('g').attr('class','tm2-bands');
  colMeta.forEach(function(m){
    var c=m.c;
    var hasCond=lvTm2HasCond(c);
    var depthCls=(c.depth>0?' tm2-band-child':'')+(hasCond?' tm2-band-cond-stage':'');
    var bandColor=(c.depth>0&&c.bpIdx>=0)?lvBpColor(c.bpIdx):'var(--accent)';
    // band spans the stage's flow-depth and the full cross extent.
    var f0=m.f-12, fdepth=m.depth+24, g0=18, gext=crossMax-18+12;
    var tl=XY(f0,g0);
    var sz=isH?{w:fdepth,h:gext}:{w:gext,h:fdepth};
    var grp=bandG.append('g').attr('transform','translate('+tl.x+','+tl.y+')');
    grp.append('rect').attr('class','tm2-band'+depthCls).attr('width',Math.max(10,sz.w)).attr('height',Math.max(10,sz.h)).attr('rx',10).style('--lv-bp',bandColor);
    // label pinned at the band's flow-start. A conditional stage gets a taller box so
    // the IF-pill can wrap below the stage name. foreignObject HARD-CLIPS its content, so
    // size the box to the actual measured label height (never clip the pill).
    var lblW=isH?Math.max(fdepth-8,200):Math.min(gext-8,300);
    var lblH=hasCond?(Math.max(tm2MeasureLabelHeight(c,lblW),28+CONDBAND)+4):28;
    var fo=grp.append('foreignObject').attr('x',6).attr('y',4).attr('width',lblW).attr('height',lblH);
    var div=document.createElementNS('http://www.w3.org/1999/xhtml','div');
    div.className='tm2-band-label'+depthCls+(hasCond?' has-cond':'');div.style.setProperty('--lv-bp',bandColor);
    div.innerHTML=lvTm2StageLabel(c);
    fo.node().appendChild(div);
  });

  // --- sequence/flow edges (task + linked-workflow). Drawn always. ---
  var edgeG=root.append('g').attr('class','tm2-edges');
  // A SEPARATE layer for on-demand data-flow arrows (drawn only for a clicked field
  // or selected task — there can be 100+, so we never dump them all).
  var dfG=root.append('g').attr('class','tm2-df-edges');
  // center in flow/cross terms
  function ctr(tid){var p=pos[tid];if(!p)return null;return{cf:p.f+p.cardFlow/2,cg:p.g+p.cardCross/2,fl:p.cardFlow,cr:p.cardCross,col:p.col}}
  flowEdges.forEach(function(e){
    var s=ctr(e.from),t=ctr(e.to);if(!s||!t)return;
    var lane=skipLaneG[e.from+'>'+e.to];
    var d=tm2EdgePath(s,t,XY,lane,colHasBetween);
    // All step-to-step arrows render with the SAME grey task-flow style (no distinct
    // purple for sub-workflow boundaries — the linked cards already show provenance via
    // their colored header/tint). data-kind preserves the real kind for any logic.
    edgeG.append('path').attr('class','tm2-edge tm2-edge-task').attr('d',d)
      .attr('data-from',e.from).attr('data-to',e.to).attr('data-kind',e.kind==='child'?'child':'task')
      .attr('marker-end','url(#tm2-arr)');
  });
  // Build the full data-flow pair map once (deduped per pair, all fields aggregated)
  // and stash the layout context so the on-demand renderer can route arrows later.
  var dfMap={};
  lvDfRawEdges().forEach(function(e){
    if(!e.data)return;if(taskCol[e.from]==null||taskCol[e.to]==null||e.from===e.to)return;
    var k=e.from+'>'+e.to;(dfMap[k]=dfMap[k]||{from:e.from,to:e.to,fields:[]}).fields.push(e.data);
  });
  tm2Ctx={ctr:ctr,XY:XY,MF:MF,skipBandH:skipBandH,labelBand:LABELBAND,dfMap:dfMap,colHasBetween:colHasBetween};

  // --- task cards ---
  var cardG=root.append('g').attr('class','tm2-cards lane-grid');
  Object.keys(pos).forEach(function(tid){
    var p=pos[tid];var t=taskMap[tid];if(!t)return;
    var tl=XY(p.f,p.g);
    // The card is always 210 wide × sh tall on screen. In horizontal, flow=x so card
    // top-left = (f,g). In vertical, flow=y so the card top-left = (g, f) — the card's
    // 210-width sits on the cross (x) axis and its height along flow (y). XY already
    // maps that; we just use screen size sw×sh.
    var fo=cardG.append('foreignObject').attr('x',tl.x).attr('y',tl.y).attr('width',p.sw).attr('height',p.sh).attr('class','tm2-card-fo').attr('data-tid',tid);
    var wrap=document.createElementNS('http://www.w3.org/1999/xhtml','div');
    wrap.innerHTML=lvRenderCard(t);
    fo.node().appendChild(wrap.firstChild);
  });

  var D={w:totalW,h:totalH};
  tm2NatW=D.w;tm2NatH=D.h;
  svg.attr('viewBox','0 0 '+D.w+' '+D.h).attr('width',D.w).attr('height',D.h);
  // When the field legend is shown it floats over the right side; add right padding to
  // the scroll wrap so the rightmost cards can be scrolled clear of it.
  var wrap=document.querySelector('#tp-tmap2 .tm2-svg-wrap');
  if(wrap)wrap.style.paddingRight=tm2ShowDataFlow?'250px':'';
  // wire card selection (delegated) + apply any existing highlight
  var cardsHost=cardG.node();
  if(cardsHost)cardsHost.addEventListener('click',tm2CardAreaClick);
  tm2ApplyHighlight();
  // Task Map is the "read the stages & tasks" view, so it OPENS AT NATURAL 1:1 — the
  // stage header names stay full-size and legible. Fit-to-Screen is an explicit overview
  // action (tm2FitMode); only re-apply it on rebuild if the user actually chose it.
  if(tm2FitMode)tm2Fit();else tm2ApplyScale(1);
}
var tm2NatW=0,tm2NatH=0,tm2Scale=1,tm2Ctx=null,tm2FitMode=true;

// Orthogonal edge router in the flow/cross frame, mapped to screen by XY(f,g).
// f = position along the flow axis (stage direction), g = along the cross axis.
//   same stage     → short connector down the cross gutter
//   adjacent ahead  → out the flow side, mid-step in the gutter, into target
//   skip ahead      → up into the reserved skip lane (clear), across, into target
//   backward        → detour around the cross-far side
function tm2EdgePath(s,t,XY,lane,colHasBetween){
  var GUT=24;
  function P(f,g){var p=XY(f,g);return p.x+','+p.y}
  // flow-axis edges of each card (the sides facing along the stage-advance direction)
  var sFlowEnd=s.cf+s.fl/2;       // source's leading (downstream) flow edge
  var tFlowStart=t.cf-t.fl/2;     // target's trailing (upstream) flow edge
  if(s.col===t.col){
    // Are there OTHER cards stacked between the two endpoints in this column? If so a
    // straight cross connector would slice through them — bow out into the clear flow
    // gap past the column's downstream edge, run along the cross there, and return into
    // the target's downstream edge. Both cards share a flow extent (horizontal mode), so
    // sFlowEnd===tFlowEnd and the vertical run sits in the empty inter-stage gutter.
    var lo=Math.min(s.cg,t.cg), hi=Math.max(s.cg,t.cg);
    var blocked=colHasBetween&&colHasBetween(s.col,lo,hi);
    if(blocked){
      var sideF=Math.max(sFlowEnd,t.cf+t.fl/2)+GUT;  // flow position out in the gap
      var tEndF=t.cf+t.fl/2;                          // target's downstream flow edge
      return 'M'+P(sFlowEnd,s.cg)+' L'+P(sideF,s.cg)+' L'+P(sideF,t.cg)+' L'+P(tEndF,t.cg);
    }
    if(Math.abs(s.cf-t.cf)<1){ // aligned on flow, nothing between → straight cross connector
      var g0=t.cg>=s.cg?s.cg+s.cr/2:s.cg-s.cr/2, g1=t.cg>=s.cg?t.cg-t.cr/2:t.cg+t.cr/2;
      return 'M'+P(s.cf,g0)+' L'+P(t.cf,g1);
    }
    var fg=s.cf+s.fl/2+GUT;
    var cs=t.cg>=s.cg?s.cg+s.cr/2:s.cg-s.cr/2, ct=t.cg>=s.cg?t.cg-t.cr/2:t.cg+t.cr/2;
    return 'M'+P(s.cf,cs)+' L'+P(fg,cs)+' L'+P(fg,ct)+' L'+P(t.cf,ct);
  }
  if(t.col>s.col){
    if(lane!=null){
      // Skip route: out past source → up to the clear lane → across to the flow-gap
      // JUST BEFORE the target (tFlowStart-GUT, empty gutter) → down to the target's
      // cross-center → into its leading edge. The vertical drop stays in the gutter,
      // so it never crosses cards stacked above the target in its column.
      var exF=sFlowEnd+GUT, dropF=tFlowStart-GUT;
      return 'M'+P(sFlowEnd,s.cg)+
             ' L'+P(exF,s.cg)+
             ' L'+P(exF,lane)+
             ' L'+P(dropF,lane)+
             ' L'+P(dropF,t.cg)+
             ' L'+P(tFlowStart,t.cg);
    }
    if(Math.abs(s.cg-t.cg)<1)return 'M'+P(sFlowEnd,s.cg)+' L'+P(tFlowStart,t.cg);
    var midF=(sFlowEnd+tFlowStart)/2;
    return 'M'+P(sFlowEnd,s.cg)+' L'+P(midF,s.cg)+' L'+P(midF,t.cg)+' L'+P(tFlowStart,t.cg);
  }
  // backward (target is in an earlier stage). If a clear lane is given (data flow),
  // route up into it and across — never through cards. Otherwise detour cross-far.
  if(lane!=null){
    // drop in the gutter just AFTER the target (its downstream side, tEnd+GUT, empty),
    // then into the target's trailing edge — keeps the vertical run clear of cards.
    var exB=sFlowEnd+GUT, tEnd=t.cf+t.fl/2, dropB=tEnd+GUT;
    return 'M'+P(sFlowEnd,s.cg)+
           ' L'+P(exB,s.cg)+
           ' L'+P(exB,lane)+
           ' L'+P(dropB,lane)+
           ' L'+P(dropB,t.cg)+
           ' L'+P(tEnd,t.cg);
  }
  var by=Math.max(s.cg+s.cr/2,t.cg+t.cr/2)+GUT+10;
  var rf=sFlowEnd+GUT, lf=tFlowStart-GUT;
  return 'M'+P(sFlowEnd,s.cg)+' L'+P(rf,s.cg)+' L'+P(rf,by)+' L'+P(lf,by)+' L'+P(lf,t.cg)+' L'+P(tFlowStart,t.cg);
}

// --- Task Map 2 card selection: highlight a clicked task + its direct neighbors and
// the edges touching it; dim the rest. Mirrors Task Map 1's lvCardClick semantics but
// operates on TM2's own SVG DOM (lvApplyTraceClasses targets #lv-grid, not TM2).
function tm2CardAreaClick(ev){
  var fo=ev.target.closest&&ev.target.closest('.tm2-card-fo');
  if(!fo){tm2ActiveTaskId=null;tm2TraceField=null;tm2SyncFieldLegendSelection();tm2ApplyHighlight();return;}
  var tid=fo.getAttribute('data-tid');
  tm2ActiveTaskId=(tm2ActiveTaskId===tid)?null:tid;
  tm2TraceField=null;tm2SyncFieldLegendSelection();
  tm2ApplyHighlight();
}
function tm2ApplyHighlight(){
  var g=document.getElementById('tm2-g');if(!g)return;
  lvGetSeqEdges();
  var up=tm2ActiveTaskId?(lvSeqAdjCache.up[tm2ActiveTaskId]||new Set()):null;
  var dn=tm2ActiveTaskId?(lvSeqAdjCache.dn[tm2ActiveTaskId]||new Set()):null;
  var ff=tm2TraceField?lvGetFieldFlow().map[tm2TraceField]:null;
  var anySel=tm2ActiveTaskId||tm2TraceField;
  // cards
  g.querySelectorAll('.tm2-card-fo').forEach(function(fo){
    var tid=fo.getAttribute('data-tid');var card=fo.querySelector('.lv-card');if(!card)return;
    card.classList.remove('lv-active','lv-related-up','lv-related-dn','lv-dim','lv-traced','lv-fprod','lv-fcons');
    if(!anySel)return;
    if(tm2ActiveTaskId){
      if(tid===tm2ActiveTaskId)card.classList.add('lv-active');
      else if(up.has(tid))card.classList.add('lv-related-up');
      else if(dn.has(tid))card.classList.add('lv-related-dn');
      else card.classList.add('lv-dim');
    }else if(ff){
      var prod=ff.producers[tid],cons=ff.consumers[tid];
      if(prod||cons){card.classList.add('lv-traced');if(prod)card.classList.add('lv-fprod');if(cons)card.classList.add('lv-fcons');}
      else card.classList.add('lv-dim');
    }
  });
  // sequence/flow edges:
  //   - Data Flow ON  → the GREEN data-flow arrows are the whole story, so every
  //     grey/purple sequence arrow dims, whether a task or a field is selected. This
  //     keeps the data-flow view uniformly green (no competing grey "task flow" arrows).
  //   - Data Flow OFF → a selected task pops its touching sequence edges; the rest dim.
  g.querySelectorAll('.tm2-edges .tm2-edge').forEach(function(p){
    p.classList.remove('tm2-edge-dim','tm2-edge-hi');
    if(!anySel)return;
    if(tm2ShowDataFlow){p.classList.add('tm2-edge-dim');return;}
    var f=p.getAttribute('data-from'),to=p.getAttribute('data-to');
    if(tm2ActiveTaskId&&(f===tm2ActiveTaskId||to===tm2ActiveTaskId))p.classList.add('tm2-edge-hi');
    else p.classList.add('tm2-edge-dim');
  });
  // data-flow edges are drawn ON DEMAND (never all 100+ at once): for the selected
  // task's data dependencies, or for the clicked field's producers→consumers.
  tm2DrawDfEdges();
}

// Render only the relevant data-flow arrows into the #tm2-df-edges layer:
//   - a traced field → every pair that carries it
//   - a selected task → every pair touching it
//   - nothing selected → none (keeps the canvas clean even with Data Flow on)
function tm2DrawDfEdges(){
  if(!tm2Ctx)return;
  var dfG=d3.select('#tm2-g').select('.tm2-df-edges');if(dfG.empty())return;
  dfG.selectAll('*').remove();
  if(!tm2ShowDataFlow)return;
  var field=tm2TraceField, active=tm2ActiveTaskId;
  if(!field&&!active)return;
  dfG.raise(); // draw on-demand data-flow arrows ABOVE the cards so they're fully visible
  var ctr=tm2Ctx.ctr,XY=tm2Ctx.XY,dfMap=tm2Ctx.dfMap,labelBand=tm2Ctx.labelBand,skipBandH=tm2Ctx.skipBandH,colHasBetween=tm2Ctx.colHasBetween;
  var keys=Object.keys(dfMap).filter(function(k){
    var e=dfMap[k];
    if(field)return e.fields.indexOf(field)!==-1;
    return e.from===active||e.to===active;
  });
  // Spread the across-legs of the drawn arrows across distinct rows within the reserved
  // band (Phase 2) so a multi-consumer field doesn't stack every arrow on one line. The
  // band spans [labelBand .. labelBand+skipBandH]; rows are clamped to fit it so a lane
  // never bleeds into the stage labels above or the cards below. Sequence skip edges are
  // dimmed while data flow is on, so the band is visually free to reuse here.
  var LANED=10, bandTop=labelBand+4;
  var laneRows=skipBandH>0?Math.max(1,Math.floor(skipBandH/LANED)):1, laneI=0;
  keys.forEach(function(k){
    var e=dfMap[k];var s=ctr(e.from),t=ctr(e.to);if(!s||!t)return;
    // route through the clear band (below labels, above cards) whenever the pair spans
    // >1 stage OR is backward, so the arrow never crosses intervening cards.
    var span=t.col-s.col;
    var needLane=(Math.abs(span)>1||span<0);
    var dfLane=needLane?(bandTop+(laneI++%laneRows)*LANED):null;
    dfG.append('path').attr('class','tm2-edge tm2-edge-df lv-edge-fhi').attr('d',tm2EdgePath(s,t,XY,dfLane,colHasBetween))
      .attr('marker-end','url(#tm2-arr-df)').attr('data-from',e.from).attr('data-to',e.to);
  });
}

// Field legend (Data Flow ON) — reuses Task Map 1's lvGetFieldFlow() field set, but
// with TM2's own click handler/selection state.
function tm2RenderFieldLegend(){
  var ff=lvGetFieldFlow();var n=ff.list.length;
  var h='<div class="lv-field-legend" id="tm2-field-legend">';
  h+='<div class="lv-fl-head"><div class="lv-fl-title">Data Fields <span class="lv-fl-count">'+n+'</span></div>';
  h+='<button class="lv-fl-clear" id="tm2-fl-clear" style="display:'+(tm2TraceField?'':'none')+'" onclick="tm2ExitTrace()">Clear</button></div>';
  h+='<div class="lv-fl-selcount" id="tm2-fl-selcount"></div>';
  if(n>8)h+='<input class="lv-fl-search" id="tm2-fl-search" placeholder="Filter fields…" oninput="tm2FieldLegendFilter(this.value)">';
  h+='<div class="lv-fl-list">';
  ff.list.forEach(function(f){
    var np=Object.keys(f.producers).length,nc=Object.keys(f.consumers).length;
    var sel=tm2TraceField===f.field?' active':'';
    h+='<div class="lv-fl-item'+sel+'" data-field="'+escHtml(f.field)+'" data-search="'+escHtml(f.field.toLowerCase())+'" title="'+escHtml(f.field)+(f.type?' ('+escHtml(f.type)+')':'')+'">';
    h+='<span class="lv-fl-dot"></span><span class="lv-fl-name">'+escHtml(f.field)+'</span>';
    h+='<span class="lv-fl-io"><span class="lv-fl-io-p">'+np+'&#8593;</span><span class="lv-fl-io-c">'+nc+'&#8595;</span></span></div>';
  });
  h+='</div></div>';
  return h;
}
function tm2FieldLegendClick(ev){
  var item=ev.target.closest&&ev.target.closest('.lv-fl-item');if(!item||!item.dataset.field)return;
  var f=item.dataset.field;
  tm2TraceField=(tm2TraceField===f)?null:f;tm2ActiveTaskId=null;
  tm2SyncFieldLegendSelection();tm2ApplyHighlight();
}
function tm2ExitTrace(){tm2TraceField=null;tm2ActiveTaskId=null;tm2SyncFieldLegendSelection();tm2ApplyHighlight();}
function tm2FieldLegendFilter(q){tm2FilterLegendForState(q);}
function tm2SyncFieldLegendSelection(){
  var panel=document.getElementById('tm2-field-legend');if(!panel)return;
  panel.querySelectorAll('.lv-fl-item').forEach(function(it){it.classList.toggle('active',it.dataset.field===tm2TraceField)});
  var clr=document.getElementById('tm2-fl-clear');if(clr)clr.style.display=(tm2TraceField||tm2ActiveTaskId)?'':'none';
  var cnt=document.getElementById('tm2-fl-selcount');
  if(cnt){
    if(tm2TraceField){var ff=lvGetFieldFlow().map[tm2TraceField];var np=ff?Object.keys(ff.producers).length:0,nc=ff?Object.keys(ff.consumers).length:0;cnt.textContent=np+' produce · '+nc+' consume';}
    else if(tm2ActiveTaskId){
      // count how many LISTED (flowing) fields this task touches
      var t=taskMap[tm2ActiveTaskId],fset={};
      if(t){(t.inputs||[]).forEach(function(i){fset[i.n]=1});(t.outputs||[]).forEach(function(o){fset[o.n]=1});}
      var listed=lvGetFieldFlow().list.filter(function(f){return fset[f.field]}).length;
      cnt.textContent=tm2ActiveTaskId+': '+listed+' data field'+(listed===1?'':'s');
    }
    else cnt.textContent='';
  }
  // When a TASK is selected, filter the legend to ONLY the fields that task uses
  // (input or output) — so the user sees that card's data at a glance. A traced field
  // or a typed search filter takes precedence; otherwise no filter.
  var searchVal=(document.getElementById('tm2-fl-search')||{}).value||'';
  tm2FilterLegendForState(searchVal);
}
// Apply the active filter to legend rows: text search if present, else the selected
// task's field set, else show all.
function tm2FilterLegendForState(q){
  q=(q||'').trim().toLowerCase();
  var taskFields=null;
  if(!q&&tm2ActiveTaskId&&taskMap[tm2ActiveTaskId]){
    taskFields={};var t=taskMap[tm2ActiveTaskId];
    (t.inputs||[]).forEach(function(i){taskFields[i.n]=1});
    (t.outputs||[]).forEach(function(o){taskFields[o.n]=1});
  }
  document.querySelectorAll('#tm2-field-legend .lv-fl-item').forEach(function(it){
    var show;
    if(q)show=it.dataset.search.indexOf(q)!==-1;
    else if(taskFields)show=!!taskFields[it.dataset.field];
    else show=true;
    it.style.display=show?'':'none';
  });
}

// Build a stage band label: "3. Trust Document Collection" (+ child BP sublabel).
function lvTm2StageLabel(c){
  var num=c.stage.id!=null?'<span class="tm2-band-num">'+escHtml(String(c.stage.id))+'</span>':'';
  var name=escHtml(c.stage.name||'');
  var sub=c.bpName?'<span class="tm2-band-sub">&#8627; '+escHtml(c.bpName)+'</span>':'';
  // Number pill + name share one row (the .tm2-band-title); the condition pill (if any)
  // sits below it when the label wraps (.has-cond flex column).
  var title='<span class="tm2-band-title">'+num+'<span class="tm2-band-nametext">'+name+'</span>'+sub+'</span>';
  var cond='';
  if(c.stage&&c.stage.condition){
    // Mirror Swimlanes: an "IF …" pill under the stage name showing the FULL condition
    // (no truncation). The band height is MEASURED (tm2MeasureLabelHeight) so the box
    // grows to fit however many lines the condition wraps to — never clipped.
    var fullCond=String(c.stage.condition).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
    var lines=summarizeConditionLines(c.stage.condition,44,99);
    cond='<div class="tm2-band-cond" title="'+escHtml(fullCond)+'">'+lines.map(escHtml).join('<br>')+'</div>';
  }
  return title+cond;
}
// Does this stage carry a condition? Used to reserve extra band lead-space.
function lvTm2HasCond(c){return !!(c&&c.stage&&c.stage.condition)}
// Measure a conditional stage's rendered header height (name line + wrapped IF-pill) at
// a representative band width, so the layout can reserve EXACTLY enough cross-space for
// it (no clipped pills). Returns total px height of the .tm2-band-label box.
var tm2LabelProbe=null;
function tm2MeasureLabelHeight(c,widthPx){
  if(!tm2LabelProbe){tm2LabelProbe=document.createElement('div');tm2LabelProbe.id='tm2-label-probe';
    tm2LabelProbe.style.cssText='position:absolute;left:-9999px;top:-9999px;visibility:hidden';
    document.body.appendChild(tm2LabelProbe);}
  var depthCls=(c.depth>0?' tm2-band-child':'');
  // Wrap in #tp-tmap2 so the scoped .tm2-band-* CSS applies during measurement.
  tm2LabelProbe.innerHTML='<div id="tp-tmap2"><div class="tm2-band-label has-cond'+depthCls+'" style="width:'+widthPx+'px">'+lvTm2StageLabel(c)+'</div></div>';
  var el=tm2LabelProbe.querySelector('.tm2-band-label');
  var h=el?Math.ceil(el.getBoundingClientRect().height):24;
  tm2LabelProbe.innerHTML='';
  return h;
}

// Measure a task card's rendered height by probing it offscreen once (fixed width).
var tm2MeasureCache={};
function tm2MeasureCard(t){
  if(tm2MeasureCache[t.id])return tm2MeasureCache[t.id];
  var probe=document.getElementById('tm2-probe');
  if(!probe){probe=document.createElement('div');probe.id='tm2-probe';probe.className='lane-grid';
    probe.style.cssText='position:absolute;left:-9999px;top:-9999px;width:210px;visibility:hidden';
    document.body.appendChild(probe);}
  probe.innerHTML=lvRenderCard(t);
  var el=probe.firstChild;var r=el.getBoundingClientRect();
  var dim={w:210,h:Math.max(54,Math.ceil(r.height)||64)};
  probe.innerHTML='';   // don't leave the last-measured card's markup parked in <body>
  tm2MeasureCache[t.id]=dim;return dim;
}

// Apply a CSS scale() to the SVG wrap (origin top-left), same as Task Map 1's scale.
function tm2ApplyScale(s){
  var wrap=document.querySelector('#tp-tmap2 .tm2-svg-wrap');if(!wrap)return;
  if(s>=0.999){wrap.style.transform='';wrap.style.transformOrigin='';}
  else{wrap.style.transform='scale('+s+')';wrap.style.transformOrigin='top left';}
  tm2Scale=s;
}
// Fit to screen: scale so the CROSS axis (height in horizontal, width in vertical)
// fits the viewport; the flow axis keeps natural size and scrolls — like Task Map 1.
function tm2Fit(){
  tm2FitMode=true;   // remember: subsequent rebuilds/resizes keep fitting until Reset
  var sc=document.querySelector('#tp-tmap2 .tm2-scroll');if(!sc||!tm2NatW||!tm2NatH)return;
  var vw=sc.clientWidth,vh=sc.clientHeight;if(!vw||!vh){tm2ApplyScale(1);return;}
  var sy=vh/tm2NatH,sx=vw/tm2NatW;
  var s=tm2Orient==='h'?Math.min(sy,1):Math.min(sx,1);
  // Floor at 0.7 so titles (14px) stay legible: below this we'd rather clamp and let the
  // user scroll than shrink text into unreadability. Prioritize fit, but keep it readable.
  if(s<0.7)s=0.7;if(s>1)s=1;
  tm2ApplyScale(s);
  sc.scrollLeft=0;sc.scrollTop=0;
}
function tm2Reset(){tm2FitMode=false;tm2ApplyScale(1);}

// ==============================================================
// PDF EXPORT (print-based, zero dependencies)
// ==============================================================
// Export the named diagram view to PDF via the browser's native print → "Save as PDF".
// Switches to the view, lays it out at NATURAL 1:1 and full size (so the whole diagram
// prints, not just the on-screen viewport), tags <body> with a printing-<view> class that
// the @media print CSS uses to isolate just that diagram, prints, then restores all state.
var _pdfPrev=null;
function exportViewPDF(view){
  if(_pdfPrev)return;                     // a print is already in flight
  if(curTab!==view)switchTab(view);
  // Defer so the tab's render (rAF-driven) has applied before we measure/expand.
  requestAnimationFrame(function(){requestAnimationFrame(function(){_pdfDoExport(view)})});
}
function _pdfDoExport(view){
  _pdfPrev={view:view};
  var bodyCls='printing-'+view;
  var pad=24,pageW=0,pageH=0;
  if(view==='map'){
    // Stage Map: SVG with a d3-zoomed #simple-g. Save the current zoom transform + SVG
    // size, then reset to identity at natural size so the whole graph lays out.
    var svg=document.getElementById('simple-svg');var g=document.getElementById('simple-g');
    var P=window._sLayout||{_W:1200,_H:800};
    _pdfPrev.svgW=svg.getAttribute('width');_pdfPrev.svgH=svg.getAttribute('height');
    _pdfPrev.svgStyleW=svg.style.width;_pdfPrev.svgStyleH=svg.style.height;
    _pdfPrev.gTransform=g.getAttribute('transform');
    _pdfPrev.zoomT=(typeof simpleZoom!=='undefined'&&simpleZoom)?d3.zoomTransform(svg):null;
    // Size the SVG to the CONTENT only (the @page margin provides the visual padding —
    // baking pad into the SVG too would overflow the printable area onto a 2nd page).
    pageW=Math.ceil(P._W+pad*2);pageH=Math.ceil(P._H+pad*2);
    svg.setAttribute('width',Math.ceil(P._W));svg.setAttribute('height',Math.ceil(P._H));
    svg.style.width=Math.ceil(P._W)+'px';svg.style.height=Math.ceil(P._H)+'px';
    g.setAttribute('transform','translate(0,0)');
  }else if(view==='tmap2'){
    // Task Map: CSS transform on the wrap. Save + clear it (natural 1:1).
    var w=document.querySelector('#tp-tmap2 .tm2-svg-wrap');
    if(w){_pdfPrev.tmTransform=w.style.transform;_pdfPrev.tmPad=w.style.paddingRight;w.style.transform='';w.style.paddingRight='0';}
    _pdfPrev.tmScale=tm2Scale;tm2Scale=1;
    pageW=Math.ceil((tm2NatW||1200)+pad*2);pageH=Math.ceil((tm2NatH||800)+pad*2);
  }else if(view==='lane'){
    // Swimlanes: CSS zoom on the wrap. Save + clear it (natural 1:1), then redraw edges
    // so the overlay SVG matches the un-zoomed grid before printing.
    var lw=document.querySelector('#tp-lane .lv-grid-wrap');
    if(lw){_pdfPrev.lvZoom=lw.style.zoom;lw.style.zoom='';}
    _pdfPrev.lvScale=lvCurrentScale;lvCurrentScale=1;
    if(typeof lvDrawEdges==='function')lvDrawEdges();
    // Measure the grid at natural (un-zoomed) size for the page dimensions.
    var grid=document.getElementById('lv-grid');
    var gw=grid?Math.max(grid.scrollWidth,lw?lw.scrollWidth:0):1200;
    var gh=grid?Math.max(grid.scrollHeight,lw?lw.scrollHeight:0):800;
    pageW=Math.ceil(gw+pad*2);pageH=Math.ceil(gh+pad*2);
  }
  // Inject an @page sized to the WHOLE diagram so it prints on ONE page (no slicing).
  // CSS px == 1/96in; Chrome honors a custom @page size with preferCSSPageSize. The page
  // is content + the @page margin (pad) on each side + SLACK, so the printable area is
  // strictly LARGER than the content — sub-pixel rounding can't spill onto a 2nd page.
  if(pageW&&pageH){
    var SLACK=16;
    var st=document.getElementById('pdf-page-style');if(!st){st=document.createElement('style');st.id='pdf-page-style';document.head.appendChild(st);}
    st.textContent='@media print{@page{size:'+(pageW+SLACK)+'px '+(pageH+SLACK)+'px;margin:'+pad+'px}'+
      'body[class*="printing-"] .tm2-scroll,body[class*="printing-"] .lv-scroll{padding:0!important}'+
      'body[class*="printing-"] #simple-svg,body[class*="printing-"] #tm2-svg{padding:0!important}}';
  }
  document.body.classList.add(bodyCls);
  // Restore on afterprint (fires whether the user saves or cancels).
  var restore=function(){
    window.removeEventListener('afterprint',restore);
    var p=_pdfPrev;_pdfPrev=null;if(!p)return;
    document.body.classList.remove('printing-'+p.view);
    var ps=document.getElementById('pdf-page-style');if(ps)ps.parentNode.removeChild(ps);
    if(p.view==='map'){
      var svg=document.getElementById('simple-svg'),g=document.getElementById('simple-g');
      if(p.svgW==null)svg.removeAttribute('width');else svg.setAttribute('width',p.svgW);
      if(p.svgH==null)svg.removeAttribute('height');else svg.setAttribute('height',p.svgH);
      svg.style.width=p.svgStyleW||'';svg.style.height=p.svgStyleH||'';
      if(p.gTransform==null)g.removeAttribute('transform');else g.setAttribute('transform',p.gTransform);
      if(p.zoomT&&typeof simpleZoom!=='undefined'&&simpleZoom){d3.select(svg).call(simpleZoom.transform,p.zoomT);}
    }else if(p.view==='tmap2'){
      var w=document.querySelector('#tp-tmap2 .tm2-svg-wrap');
      tm2Scale=p.tmScale!=null?p.tmScale:1;
      if(w){w.style.paddingRight=p.tmPad||'';}
      tm2ApplyScale(tm2Scale);
    }else if(p.view==='lane'){
      lvCurrentScale=p.lvScale!=null?p.lvScale:1;
      lvApplyScale(lvCurrentScale);
      if(typeof lvDrawEdges==='function')requestAnimationFrame(lvDrawEdges);
    }
  };
  window.addEventListener('afterprint',restore);
  // Give layout one more frame to settle at full size, then open the print dialog.
  requestAnimationFrame(function(){requestAnimationFrame(function(){window.print()})});
}

// INIT
// ==============================================================
(function populateTabCounts(){
  var nAgentTasks=0;stages.forEach(function(s){s.tasks.forEach(function(t){if(t.agentClass&&t.agentClass!=='human')nAgentTasks++})});
  if(typeof childStages!=='undefined')childStages.forEach(function(s){s.tasks.forEach(function(t){if(t.agentClass&&t.agentClass!=='human')nAgentTasks++})});
  var el;
  el=document.getElementById('tc-fields');if(el){var fids={};var fsList=fullProcess?stages.concat(childStages):stages;fsList.forEach(function(s){s.tasks.forEach(function(t){t.outputs.forEach(function(o){if(o.id)fids[o.id+'_'+o.n]=1});t.inputs.forEach(function(i){if(i.id)fids[i.id+'_'+i.n]=1})})});el.textContent=Object.keys(fids).length}
  el=document.getElementById('tc-agents');if(el)el.textContent=nAgentTasks;
})();
if(childBlueprints.length){var fpw=document.getElementById('fp-toggle-wrap');if(fpw)fpw.style.display=''}
switchTab('map');
colorMap=getColorMap();
updateSvgMarkers();
</script>
