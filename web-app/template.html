// Returns the condition text wrapped into up to `maxLines` lines, each up to
// ~`maxLen` chars. Tries a short comparator-style summary first ("X is Y") and
// falls back to greedy word wrapping. Keeps the leading "IF" only on line 1.
function summarizeConditionLines(raw,maxLen,maxLines){
  maxLen=maxLen||40;maxLines=maxLines||2;
  if(!raw)return['IF'];
  var s=String(raw).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();

  if(s.length<=maxLen)return['IF '+s];
  var ops=[' is not ',' is ',' equals ',' not equal ',' >= ',' <= ',' != ',' == ',' = ',' > ',' < ',' contains ',' in '];
  for(var i=0;i<ops.length;i++){
    var op=ops[i];
    var idx=s.toLowerCase().indexOf(op);
    if(idx>0){
      var left=s.substring(0,idx).trim();
      var right=s.substring(idx+op.length).trim();
      var lt=left.split(/[ .]/).pop();
      var compact='IF '+lt+' '+op.trim()+' '+right;
      if(compact.length<=maxLen)return[compact];
    }
  }
  // Greedy word-wrap "IF <text>" into up to maxLines
  var words=('IF '+s).split(' '),lines=[],cur='';
  for(var j=0;j<words.length;j++){
    var w=words[j];
    if(!cur){cur=w;continue}
    if((cur+' '+w).length<=maxLen){cur+=' '+w}
    else{lines.push(cur);cur=w;if(lines.length>=maxLines-1)break}
  }
  if(cur)lines.push(cur);
  // Truncate the last line if we hit the line limit and there are leftover words
  if(lines.length===maxLines){
    var consumed=lines.join(' ').split(' ').length;
    if(consumed<words.length){
      var last=lines[lines.length-1];
      while(last.length>maxLen-1)last=last.replace(/\s?\S+$/,'');
      lines[lines.length-1]=(last||lines[lines.length-1].substring(0,maxLen-1))+'…';
    }

}

function renderFullProcessGraph(){

  var tip=d3.select('#tooltip');

  var CLUSTER_GAP=40,CHILD_HGAP=24;

  var linkedChildIdxs={};
  var childToParentStage={};

    if(t._isChildLink&&t._childIdx!=null){
      linkedChildIdxs[t._childIdx]=true;
      if(childToParentStage[t._childIdx]==null)childToParentStage[t._childIdx]=s.id;
    }
  })});

  });

  // Returns: {localW, localH, clusterW, clusterH, totalW, totalH, nodes, edges,
  //           subClusters:[{ci, offX, offY, layout}], stageChildMap:{stageId:[ci,...]}}
  var allClLayouts={};

    if(allClLayouts[ci])return allClLayouts[ci];
    var cb=childBlueprints[ci];
    if(!cb||!cb.stages.length){allClLayouts[ci]=null;return null}

    // Build stage→child mapping within this child blueprint
    var stageChildMap={};
    cb.stages.forEach(function(s){s.tasks.forEach(function(t){
      if(t._isChildLink&&t._childIdx!=null){
        if(!stageChildMap[s.id])stageChildMap[s.id]=[];
        if(stageChildMap[s.id].indexOf(t._childIdx)<0)stageChildMap[s.id].push(t._childIdx);
      }

      var tw=0,valid=gcs.filter(function(gci){return!!gcLayouts[gci]});

    parentNodeW[s.id]=Math.max(NW,tw+EMBED_PAD*2);
    parentNodeH[s.id]=EMBED_TOP+maxClH+EMBED_PAD+CL_PAD_BOT+ce+te;
  });

  // === PARENT DAGRE LAYOUT (using inflated dimensions) ===
  var pdg=new dagreD3.graphlib.Graph()
    .setGraph({rankdir:_simpleRankdir(),ranksep:55,nodesep:40,marginx:20,marginy:40})
    .setDefaultEdgeLabel(function(){return{}});
  stages.forEach(function(s){pdg.setNode(nid(s.id),{width:parentNodeW[s.id],height:parentNodeH[s.id]})});
  var rpEdges=reduceEdges(stageFlow,stages);
  rpEdges.forEach(function(e){pdg.setEdge(nid(e[0]),nid(e[1]))});
  dagreD3.dagre.layout(pdg);

  var parentPos={};
  stages.forEach(function(s){
    var nd=pdg.node(nid(s.id));
    parentPos[s.id]={x:nd.x,y:nd.y,w:parentNodeW[s.id],h:parentNodeH[s.id]};
  });

  // === Position child clusters INSIDE their parent stage cards ===
  var clusterAbsPos={};
  function positionCluster(ci,cx,cy){
    var cl=allClLayouts[ci];if(!cl)return;
    clusterAbsPos[ci]={x:cx,y:cy,w:cl.clusterW,h:cl.clusterH};
    cl.subClusters.forEach(function(sc){
      var ax=cx-cl.clusterW/2+CL_PAD_LR+sc.offX;
      var ay=cy-cl.clusterH/2+CL_PAD_TOP+sc.offY;
      positionCluster(sc.ci,ax,ay);
    });
  }
  Object.keys(parentChildMap).forEach(function(sid){
    var children=parentChildMap[sid];
    var valid=children.filter(function(ci){return!!allClLayouts[ci]});
    if(!valid.length)return;
    var tw=0;valid.forEach(function(ci){tw+=allClLayouts[ci].totalW});
    tw+=(valid.length-1)*CHILD_HGAP;
    var pp=parentPos[sid];
    var startX=pp.x-tw/2;
    valid.forEach(function(ci){
      var cl=allClLayouts[ci];
      var cy=pp.y-pp.h/2+EMBED_TOP+cl.totalH/2;
      positionCluster(ci,startX+cl.totalW/2,cy);
      startX+=cl.totalW+CHILD_HGAP;
    });
  });

  // === Compute total graph dimensions ===
  var W=0,H=0;
  stages.forEach(function(s){
    var p=parentPos[s.id];
    W=Math.max(W,p.x+p.w/2+40);H=Math.max(H,p.y+p.h/2+40);
  });

  // No separate cluster containers — all children are embedded inside their parent stage cards

  // === RENDER Layer 2: Edges ===
  var ag=g.append('g').attr('class','seq-g');
  // Build a path string from a list of points (optionally translated by ox,oy).
  function ptsToPath(pts,ox,oy){
    ox=ox||0;oy=oy||0;
    var d='M'+(pts[0].x+ox)+','+(pts[0].y+oy);
    for(var i=1;i<pts.length;i++)d+=' L'+(pts[i].x+ox)+','+(pts[i].y+oy);
    return d;
  }
  // Path between two PARENT stages using dagre's ROUTED polyline points — the
  // same structured multi-segment routing as the toggle-OFF view (and routed
  // around cards). pdg points share parentPos' coordinate space (no offset).
  // Falls back to a straight center-to-center line if dagre has no points.
  function pdgEdgePath(e0,e1){
    var ed=pdg.edge(nid(e0),nid(e1));
    if(ed&&ed.points&&ed.points.length>=2)return ptsToPath(ed.points);
    var a=parentPos[e0],b=parentPos[e1];
    if(!a||!b)return null;
    return 'M'+a.x+','+a.y+' L'+b.x+','+b.y;
  }

  // Identify parent stages that link to children (suppress direct edges through clusters)
  var stagesWithChildren={};
  Object.keys(childToParentStage).forEach(function(ci){stagesWithChildren[childToParentStage[ci]]=+ci});

  // (Parent flow edges drawn in Layer 5 on top of nodes)

  // Find exit node (last stage with no outgoing flow edges) for a child blueprint
  function findExitNode(cb,cl){
    var outSet={};
    (cb.flow||[]).forEach(function(e){outSet[e[0]]=true});
    for(var i=cb.stages.length-1;i>=0;i--){
      if(!outSet[cb.stages[i].id]&&cl.nodes[cb.stages[i].id])return cl.nodes[cb.stages[i].id];
    }
    return cl.nodes[cb.stages[cb.stages.length-1].id];
  }


  // Return edges from parent stages with children to next parent stages.
  // Use dagre's routed polyline so it matches the structured look (purple style).
  Object.keys(childToParentStage).forEach(function(ci){
    var sid=childToParentStage[ci];
    if(!parentPos[sid])return;
    rpEdges.forEach(function(e){
      if(e[0]===+sid&&parentPos[e[1]]){
        var d=pdgEdgePath(e[0],e[1]);
        if(!d)return;
        ag.append('path').attr('d',d).attr('class','cross-edge').attr('marker-end','url(#arr-cross)');
      }
    });
  });

  // === RENDER Layer 3: Parent stage nodes ===
  var ng=g.append('g');
  stages.forEach(function(s){
    var p=parentPos[s.id],pw=p.w,ph=p.h;
    var px=p.x-pw/2,py=p.y-ph/2;
    var hasChildren=parentChildMap[s.id]&&parentChildMap[s.id].length;
    var sg=ng.append('g').attr('class','stage-node').attr('data-sid',s.id)
      .attr('transform','translate('+px+','+py+')').style('cursor','pointer');
    sg.append('rect').attr('class','sn-rect'+(hasChildren?' has-children':'')).attr('width',pw).attr('height',ph)
      .attr('rx',8).attr('ry',8);
    var labelX=36;
    var titleSize=13,titleLineH=15;
    var tLines=titleLines(s,pw,labelX,titleSize);
    var titleNode=sg.append('text').attr('class','sn-label').attr('x',labelX).attr('y',26);
    tLines.forEach(function(line,i){
      titleNode.append('tspan').attr('x',labelX).attr('dy',i===0?0:titleLineH).text(line);
    });
    var subY=26+(tLines.length-1)*titleLineH+16;
    sg.append('text').attr('class','sn-sub').attr('x',labelX).attr('y',subY)
      .text(s.tasks.length?s.tasks.length+' task'+(s.tasks.length>1?'s':'')+(hasChildren?' • linked workflow':''):'Gate');
    decorateStageNode(sg,s,pw,ph,{hasChildren:!!hasChildren,isChildStage:false});
    _attachStageClick(sg,s);
  });

  // === RENDER Layer 4: Child stage nodes (recursive) ===
  // Rendered height per child stage MUST equal the height dagre laid out with
  // (stageHeights), which already accounts for wrapped title + condition text +
  // any embedded grandchildren. Returning a smaller value (e.g. bare CNH) makes
  // the card too short to hold its content. Fall back to CNH only if missing.
  function getChildStageH(ci,sid){
    var cl=allClLayouts[ci];if(!cl)return CNH;
    if(cl.stageHeights&&cl.stageHeights[sid]!=null)return cl.stageHeights[sid];
    return CNH;
  }
  function drawClusterNodes(ci){
    var cp=clusterAbsPos[ci],cl=allClLayouts[ci],cb=childBlueprints[ci];
    if(!cp||!cl)return;
    var offX=cp.x-cp.w/2+CL_PAD_LR,offY=cp.y-cp.h/2+CL_PAD_TOP;
    cb.stages.forEach(function(s){
      var ln=cl.nodes[s.id];if(!ln)return;
      var stageH=getChildStageH(ci,s.id);
      var stageW=(cl.stageWidths&&cl.stageWidths[s.id])||CNW;
      var gx=offX+ln.lx-stageW/2,gy=offY+ln.ly-stageH/2;
      var hasGc=cl.stageChildMap[s.id]&&cl.stageChildMap[s.id].length;
      var sg=ng.append('g').attr('class','stage-node').attr('data-sid',s.id)
        .attr('transform','translate('+gx+','+gy+')').style('cursor','pointer');
      sg.append('rect').attr('class','sn-rect'+(hasGc?' has-children':'')).attr('width',stageW).attr('height',stageH)
        .attr('rx',8).attr('ry',8)
        .attr('stroke-dasharray',hasGc?null:'6 3');
      // Child stage IDs are like "C1.1" → badge shows "C1." (3 chars, ~31px wide
      // ending at x≈41). Start the title past the badge so it isn't clipped.
      var labelX=46;
      var titleSize=12,titleLineH=14;
      var tLines=titleLines(s,stageW,labelX,titleSize);
      var titleNode=sg.append('text').attr('class','sn-label').attr('x',labelX).attr('y',22).attr('font-size','12px');
      tLines.forEach(function(line,i){
        titleNode.append('tspan').attr('x',labelX).attr('dy',i===0?0:titleLineH).text(line);
      });
      var subY=22+(tLines.length-1)*titleLineH+14;
      sg.append('text').attr('class','sn-sub').attr('x',labelX).attr('y',subY).attr('font-size','10px')
        .text(s.tasks.length?s.tasks.length+' task'+(s.tasks.length>1?'s':'')+(hasGc?' • linked':''):'Gate');
      decorateStageNode(sg,s,stageW,stageH,{hasChildren:!!hasGc,isChildStage:true});
      _attachStageClick(sg,s);
    });
    // Draw grandchild sub-cluster nodes recursively
    cl.subClusters.forEach(function(sc){drawClusterNodes(sc.ci)});
  }
  Object.keys(linkedChildIdxs).forEach(function(ci){drawClusterNodes(+ci)});

  // === RENDER Layer 5: All flow edges ON TOP of nodes ===
  // Re-draw parent flow edges on top so they're visible over tall cards. Use
  // dagre's routed polyline points (structured/linear, routed around cards) —
  // the same look as the toggle-OFF view, orientation-correct for free.
  rpEdges.forEach(function(e){
    if(stagesWithChildren[e[0]]!=null)return;
    if(!parentPos[e[0]]||!parentPos[e[1]])return;
    var d=pdgEdgePath(e[0],e[1]);
    if(!d)return;
    g.append('path').attr('d',d)
      .attr('fill','none').attr('stroke',cssVar('--edge-seq')).attr('stroke-width',cssVar('--edge-seq-w')).attr('opacity',cssVar('--edge-seq-op'))
      .attr('marker-end','url(#arr-seq)');
  });
  // Child stage flow edges — render dagre's ROUTED polyline points (same as the
  // toggle-OFF view) translated by the cluster offset. This restores the
  // structured multi-segment look and is orientation-correct for free.
  var childEdgeG=g.append('g').attr('class','child-flow-g');
  function drawChildFlowEdges(ci){
    var cp=clusterAbsPos[ci],cl=allClLayouts[ci],cb=childBlueprints[ci];
    if(!cp||!cl)return;
    var offX=cp.x-cp.w/2+CL_PAD_LR,offY=cp.y-cp.h/2+CL_PAD_TOP;
    (cl.edges||[]).forEach(function(ed){
      if(!ed.points||ed.points.length<2)return;
      var d='M'+(offX+ed.points[0].x)+','+(offY+ed.points[0].y);
      for(var i=1;i<ed.points.length;i++)d+=' L'+(offX+ed.points[i].x)+','+(offY+ed.points[i].y);
      childEdgeG.append('path').attr('d',d)
        .attr('fill','none').attr('stroke',cssVar('--edge-seq')).attr('stroke-width',cssVar('--edge-seq-w')).attr('opacity',cssVar('--edge-seq-op'))
        .attr('marker-end','url(#arr-seq)');
    });
    cl.subClusters.forEach(function(sc){drawChildFlowEdges(sc.ci)});
  }
  Object.keys(linkedChildIdxs).forEach(function(ci){drawChildFlowEdges(+ci)});

  simpleZoom=d3.zoom().scaleExtent([.03,3])
    .filter(_simpleZoomFilter)
    .on('zoom',function(){g.attr('transform',d3.event.transform)});
  svg.call(simpleZoom).on('dblclick.zoom',null);
  // Pad bounds so obstacle detours (which push control points ~40px past a card
  // edge) are never clipped on the initial fit.
  window._sLayout={_W:W+50,_H:H+50};
  fitGraph();
  if(simpleDataFlowOn)drawSimpleDataFlow();
}

function renderSimpleGraph(sList,flowEdges,isChild){
  var svg=d3.select('#simple-svg'),g=svg.select('#simple-g');
  g.selectAll('*').remove();
  var tip=d3.select('#tooltip');
  var NW=260,NH=64,GAP=55,MT=40;
  var backBtn=document.getElementById('btn-back-parent');
  var noteEl=document.getElementById('graph-note');
  if(isChild){
    backBtn.style.display='';
    noteEl.textContent='Child Blueprint \u00b7 '+sList.length+' stages | Click stage for details';
  }else{
    backBtn.style.display='none';
  }
  var reducedFlow=reduceEdges(flowEdges,sList);
  // Use dagre for automatic stage-level layout
  // Sanitize IDs for dagre (dots are treated as hierarchy separators)
  function nid(id){return ('s'+id).replace(/\./g,'-')}
  var dg=new dagreD3.graphlib.Graph().setGraph({rankdir:_simpleRankdir(),ranksep:GAP,nodesep:40,marginx:20,marginy:MT}).setDefaultEdgeLabel(function(){return{}});
  sList.forEach(function(s){dg.setNode(nid(s.id),{width:NW,height:NH+condExtraHeight(s,NW)+titleExtraHeight(s,NW,36,13,15),label:s})});
  var linkedFromView={};
  if(!isChild&&childBlueprints.length){
    sList.forEach(function(s){s.tasks.forEach(function(t){
      if(t._isChildLink&&t._childIdx!=null)linkedFromView[t._childIdx]=s.id;
    })});
    Object.keys(linkedFromView).forEach(function(ci){
      var cb=childBlueprints[ci];if(!cb)return;
      dg.setNode('child_'+ci,{width:180,height:48,_cbIdx:+ci});
    });
  }
  reducedFlow.forEach(function(e){dg.setEdge(nid(e[0]),nid(e[1]))});
  if(!isChild&&childBlueprints.length){
    Object.keys(linkedFromView).forEach(function(ci){
      dg.setEdge(nid(linkedFromView[ci]),'child_'+ci);
    });
  }
  dagreD3.dagre.layout(dg);
  var W=dg.graph().width||800,H=dg.graph().height||600;
  // Draw edges (sequential arrows)
  var ag=g.append('g').attr('class','seq-g');
  dg.edges().forEach(function(e){
    var edge=dg.edge(e);
    if(!edge||!edge.points)return;
    var pts=edge.points;
    var d='M'+pts[0].x+','+pts[0].y;
    for(var i=1;i<pts.length;i++)d+=' L'+pts[i].x+','+pts[i].y;
    var isCrossEdge=e.w.indexOf('child_')===0||e.v.indexOf('child_')===0||(e.v.indexOf('sC')===0)!==(e.w.indexOf('sC')===0);
    ag.append('path').attr('d',d).attr('fill','none')
      .attr('stroke',isCrossEdge?cssVar('--edge-linked'):cssVar('--edge-seq'))
      .attr('stroke-width',isCrossEdge?cssVar('--edge-linked-w'):cssVar('--edge-seq-w'))
      .attr('opacity',isCrossEdge?cssVar('--edge-linked-op'):cssVar('--edge-seq-op'))
      .attr('stroke-dasharray',isCrossEdge?'5 3':null)
      .attr('marker-end',isCrossEdge?'url(#arr-cross)':'url(#arr-seq)');
  });
  // Draw stage nodes
  var ng=g.append('g');
  sList.forEach(function(s){
    var nd=dg.node(nid(s.id));if(!nd)return;
    var px=nd.x-nd.width/2,py=nd.y-nd.height/2;
    var sg=ng.append('g').attr('class','stage-node').attr('data-sid',s.id)
      .attr('transform','translate('+px+','+py+')').style('cursor','pointer');
    var isChildNode=typeof s.id==='string'&&s.id.indexOf('C')===0;
    sg.append('rect').attr('class','sn-rect').attr('width',nd.width).attr('height',nd.height)
      .attr('rx',8).attr('ry',8)
      .attr('stroke-dasharray',isChildNode?'6 3':null);
    // Child stage IDs ("C1.1") render a wider "C1." badge — push the title clear
    // of it. Parent badges are 1-2 chars so 36 is unchanged for them.
    var labelX=isChildNode?46:36;
    var titleSize=13,titleLineH=15;
    var tLines=titleLines(s,nd.width,labelX,titleSize);
    var titleNode=sg.append('text').attr('class','sn-label').attr('x',labelX).attr('y',24);
    tLines.forEach(function(line,i){
      titleNode.append('tspan').attr('x',labelX).attr('dy',i===0?0:titleLineH).text(line);
    });
    var subY=24+(tLines.length-1)*titleLineH+16;
    sg.append('text').attr('class','sn-sub').attr('x',labelX).attr('y',subY)
      .text(s.tasks.length?s.tasks.length+' task'+(s.tasks.length>1?'s':''):'Gate');
    decorateStageNode(sg,s,nd.width,nd.height,{hasChildren:false,isChildStage:isChildNode});
    _attachStageClick(sg,s);
  });
  // Child subprocess nodes (parent view only)
  if(!isChild&&childBlueprints.length){
    childBlueprints.forEach(function(cb,ci){
      var cnd=dg.node('child_'+ci);if(!cnd)return;
      var cpx=cnd.x-cnd.width/2,cpy=cnd.y-cnd.height/2;
      var cTasks=0;cb.stages.forEach(function(s){cTasks+=s.tasks.length});
      var cg=ng.append('g').attr('transform','translate('+cpx+','+cpy+')').style('cursor','pointer');
      cg.append('rect').attr('class','child-rect').attr('width',cnd.width).attr('height',cnd.height).attr('rx',8);
      var cLabel=cb.name.length>22?cb.name.substring(0,21)+'\u2026':cb.name;
      cg.append('text').attr('class','child-label').attr('x',cnd.width/2).attr('y',cnd.height/2-6).attr('text-anchor','middle').text(cLabel);
      cg.append('text').attr('x',cnd.width/2).attr('y',cnd.height/2+10).attr('text-anchor','middle').attr('font-size','9px').attr('fill',cssVar('--text-dim')).text(cb.stages.length+' stages \u00b7 '+cTasks+' tasks');
      cg.on('click',(function(idx){return function(){renderSimpleChildView(idx)}})(ci));
    });
  }
  // Zoom/pan
  simpleZoom=d3.zoom().scaleExtent([.1,3])
    .filter(_simpleZoomFilter)
    .on('zoom',function(){g.attr('transform',d3.event.transform)});
  svg.call(simpleZoom).on('dblclick.zoom',null);
  window._sLayout={_W:W,_H:H};
  fitGraph();
  if(simpleDataFlowOn)drawSimpleDataFlow();
}

var simpleDataFlowOn=false;
function toggleSimpleDataFlow(){
  simpleDataFlowOn=document.getElementById('sv-df-toggle').checked;
  if(simpleDataFlowOn)drawSimpleDataFlow();
  else d3.selectAll('#simple-g .sv-df-edge').remove();

function buildSimpleEdgeMap(){
  var edges={};
  var srcStages=fullProcess?stages.concat(childStages):(simpleShowingChild&&childBlueprints[simpleChildIdx]?childBlueprints[simpleChildIdx].stages:stages);
  srcStages.forEach(function(s){s.tasks.forEach(function(t){
    t.inputs.forEach(function(inp){
      srcStages.forEach(function(s2){s2.tasks.forEach(function(t2){
        if(t2.id===t.id)return;
        t2.outputs.forEach(function(o){
          if(o.n===inp.n&&o.id===inp.id){
            var fs=s2.id,ts=s.id;
            if(fs!==ts){
              var k=fs+'->'+ts;
              if(!edges[k])edges[k]={from:fs,to:ts,count:0};
              edges[k].count++;
            }
          }
        });
      })});
    });
  })});
  return Object.values(edges);
}
function drawSimpleDataFlow(){
  d3.selectAll('#simple-g .sv-df-edge').remove();
  var g=d3.select('#simple-g');
  var entries;
  if(!simpleShowingChild&&!fullProcess){
    entries=Object.values(stageEdgeMap).map(function(e){return{from:e.from,to:e.to,count:e.fields instanceof Set?e.fields.size:1}});
  }else{
    entries=buildSimpleEdgeMap();
  }
  if(!entries.length)return;
  var nodePos={};
  d3.selectAll('#simple-g .stage-node').each(function(){
    var el=d3.select(this);var sid=el.attr('data-sid');
    var t=el.attr('transform');
    var m=t.match(/translate\(([\d.\-]+),([\d.\-]+)\)/);
    if(m){
      var rect=el.select('.sn-rect');
      var w=+rect.attr('width'),h=+rect.attr('height');
      nodePos[sid]={x:+m[1]+w/2,y:+m[2]+h/2,w:w,h:h};
    }
  });
  var dfg=g.append('g').attr('class','sv-df-edge');
  var horiz=simpleOrient==='h';
  entries.forEach(function(e){
    var src=nodePos[e.from],tgt=nodePos[e.to];
    if(!src||!tgt)return;
    var x1,y1,x2,y2;
    if(horiz){x1=src.x+src.w/2;y1=src.y;x2=tgt.x-tgt.w/2;y2=tgt.y;}
    else{x1=src.x;y1=src.y+src.h/2;x2=tgt.x;y2=tgt.y-tgt.h/2;}
    var dx=x2-x1,dy=y2-y1;
    var path;
    if(horiz){
      if(Math.abs(dy)<10)path='M'+x1+','+y1+' L'+x2+','+y2;
      else{var cp1x=x1+dx*.3,cp2x=x1+dx*.7;path='M'+x1+','+y1+' C'+cp1x+','+y1+' '+cp2x+','+y2+' '+x2+','+y2;}
    }else{
      if(Math.abs(dx)<10)path='M'+x1+','+y1+' L'+x2+','+y2;
      else{var cp1y=y1+dy*.3,cp2y=y1+dy*.7;path='M'+x1+','+y1+' C'+x1+','+cp1y+' '+x2+','+cp2y+' '+x2+','+y2;}
    }
    dfg.append('path').attr('d',path).attr('fill','none').attr('stroke',cssVar('--edge-df')).attr('stroke-width',cssVar('--edge-df-w')).attr('opacity',cssVar('--edge-df-op')).attr('stroke-dasharray','2 3');
    var lx=(x1+x2)/2,ly=(y1+y2)/2;
    if(e.count>0)dfg.append('text').attr('x',lx).attr('y',ly-4).attr('text-anchor','middle').attr('font-size','9px').attr('fill',cssVar('--edge-df')).attr('font-weight','600').text(e.count+' field'+(e.count!==1?'s':''));
  });
}

function toggleSeqArrows(){}


function fitGraph(){
  if(!window._sLayout||!simpleZoom)return;
  var P=window._sLayout,svg=d3.select('#simple-svg');
  var rect=svg.node().getBoundingClientRect();
  var sw=rect.width||800,sh=rect.height||600;
  if(sw<50||sh<50){requestAnimationFrame(fitGraph);return}
  var pad=24;
  var sc=Math.min((sw-pad*2)/P._W,(sh-pad*2)/P._H);
  sc=Math.min(sc,2.5);sc=Math.max(sc,0.08);
  var tx=(sw-P._W*sc)/2;
  var ty=Math.max(pad,(sh-P._H*sc)/2);
  svg.transition().duration(400).call(simpleZoom.transform,d3.zoomIdentity.translate(tx,ty).scale(sc));
}
function resetZoom(){if(simpleZoom)d3.select('#simple-svg').transition().duration(300).call(simpleZoom.transform,d3.zoomIdentity)}
function updateSimpleFilters(){
  if(!window._sLayout)return;

function openStageSP(s){
  var h='';
  if(s.condition)h+='<div class="sp-section"><span class="sp-pill cond">IF: '+escHtml(s.condition)+'</span></div>';
  // Stage-level meta: total duration if available across all tasks.
  var stageDurSec=0,allHaveDue=s.tasks.length>0;
  s.tasks.forEach(function(t){if(t.dueSec)stageDurSec+=t.dueSec;else allHaveDue=false});
  if(stageDurSec>0){
    var dd=Math.floor(stageDurSec/86400),hh=Math.floor((stageDurSec%86400)/3600),mm=Math.floor((stageDurSec%3600)/60);
    var parts=[];if(dd)parts.push(dd+'d');if(hh)parts.push(hh+'h');if(mm)parts.push(mm+'m');
    var dStr=parts.join(' ')||'<1m';
    h+='<div class="sp-section sp-stage-meta">';
    h+='<span class="sp-stage-meta-pill">⏱ '+(allHaveDue?'Total':'Sum')+': '+dStr+'</span>';
    h+='</div>';
  }
  h+='<div class="sp-section"><h4>Tasks ('+s.tasks.length+')</h4>';
  s.tasks.forEach(function(t,i){
    var isAg=t.agentClass&&t.agentClass!=='human';
    var col=isAg?'var(--agent-pill-text)':'var(--accent)';
    h+='<div class="sp-tcard" style="border-left:3px solid '+col+'">';
    h+='<div class="sp-tcard-head"><span class="abadge '+badgeCls(t)+'">'+t.agent+'</span>';
    if(t.ttype)h+=' <span style="font-size:10px;color:var(--text-dim)">'+t.ttype+'</span>';
    h+='</div>';
    h+='<div class="sp-tcard-name">'+escHtml(t.id+': '+t.name)+'</div>';
    if(t.desc){
      var d=t.desc.length>150?t.desc.substring(0,150)+'…':t.desc;
      h+='<div class="sp-tcard-desc">'+escHtml(d)+'</div>';
    }
    // I/O as two-column pill grid (inputs warning-tinted, outputs success-tinted).
    if(t.inputs.length||t.outputs.length){
      h+='<div class="sp-tcard-io">';
      h+='<div class="sp-io-col sp-io-in"><span class="sp-io-label">Inputs</span><span class="sp-io-count">'+t.inputs.length+'</span></div>';
      h+='<div class="sp-io-col sp-io-out"><span class="sp-io-label">Outputs</span><span class="sp-io-count">'+t.outputs.length+'</span></div>';
      h+='</div>';
    }
    var meta=[];
    if(t.docs&&t.docs.length)meta.push(t.docs.length+' doc'+(t.docs.length>1?'s':''));
    if(t.dueSec){
      var sec=t.dueSec,dd2=Math.floor(sec/86400),hh2=Math.floor((sec%86400)/3600),mm2=Math.floor((sec%3600)/60);
      var parts2=[];if(dd2)parts2.push(dd2+'d');if(hh2)parts2.push(hh2+'h');if(mm2)parts2.push(mm2+'m');
      meta.push('⏱ '+parts2.join(' '));
    }
    if(meta.length)h+='<div class="sp-tcard-meta">'+meta.join(' &middot; ')+'</div>';
    if(t.deps&&t.deps.length){
      h+='<div class="sp-tcard-deps">';
      t.deps.forEach(function(d){h+='<span>Depends on: '+escHtml(d)+'</span>'});
      h+='</div>';
    }
    if(t.docs&&t.docs.length){
      h+='<div class="sp-tcard-docs">';
      t.docs.forEach(function(dn){h+='<span><span class="ft-icon ft-doc"></span> '+escHtml(dn)+'</span>'});
      h+='</div>';
    }

function openTaskSP(t){

    var parts=[];if(dd)parts.push(dd+'d');if(hh)parts.push(hh+'h');if(mm)parts.push(mm+'m');
    h+=(parts.length?parts.join(' '):'< 1m')+'</div></div>';
  }

    h+='<div class="sp-section"><h4>Stage Start Condition</h4>';

  if(t.inputs.length){

    t.inputs.forEach(function(i){h+='<div style="font-size:12px;padding:2px 0;color:var(--warning-text-muted)">&larr; '+i.n+' <span style="color:var(--text-dim)">('+i.t+')</span>'+(i.src?' <span style="color:var(--orange)">from '+i.src+'</span>':'')+'</div>'});
    h+='</div>';

  if(t.outputs.length){

    t.outputs.forEach(function(o){
      var consumers=[];

      h+='<div style="font-size:12px;padding:2px 0;color:var(--green)">'+(o.req?'<span class="req-ast">*</span> ':'')+'&rarr; '+o.n+' <span style="color:var(--text-dim)">('+o.t+')</span>';

function jumpToTask(tid){

// "Starts ..." label for a stage header, phrased like the real Regrello app.
// Conditions take precedence (they're the meaningful trigger); otherwise fall
// back to the workflow-start / after-previous trigger text.
function sfStartsLabel(s){
  if(s.condition){
    var n=String(s.condition).split(/\bAND\b|\bOR\b/i).filter(function(x){return x.trim()}).length;
    return{cls:'sf-stage-cond',html:'Starts when '+n+' condition'+(n!==1?'s are':' is')+' met',title:String(s.condition)};
  }
  var tg=s.trigger||'';
  if(/workflow start/i.test(tg))return{cls:'sf-stage-trigger',html:'Starts <span class="sf-trig-strong">when the workflow starts</span>'};
  var m=tg.match(/^After (.+) completes?$/i);
  if(m)return{cls:'sf-stage-trigger',html:'Starts after <span class="sf-trig-strong">'+escHtml(m[1])+'</span>'};
  if(tg)return{cls:'sf-stage-trigger',html:'Starts <span class="sf-trig-strong">'+escHtml(tg)+'</span>'};
  return null;
}
function renderStageBox(s,isChildStage){
  var childCls=isChildStage?' child-stage':'';
  var starts=sfStartsLabel(s);
  var startsHtml=starts?'<div class="'+starts.cls+'"'+(starts.title?' title="'+escHtml(starts.title)+'"':'')+'>'+starts.html+'</div>':'';
  if(!s.tasks.length){
    var h='<div class="sf-gate-box'+childCls+'" data-sid="'+s.id+'">';
    h+='<div class="sf-stage-box-hdr">';
    h+='<div class="sf-gate-box-name" style="flex:1">'+escHtml(s.name)+'</div>'+startsHtml;
    h+='</div>';
    h+='<div class="sf-gate-box-msg">Gate / Review &mdash; no automated tasks</div>';
    h+='</div>';
    return h;
  }
  var h='<div class="sf-stage-box'+childCls+'" data-sid="'+s.id+'">';
  h+='<div class="sf-stage-box-hdr">';
  h+='<div class="sf-stage-label">'+escHtml(s.name)+'</div>'+startsHtml;
  h+='</div>';
  h+='<div class="sf-stage-body">';
  s.tasks.forEach(function(t){
    if(t._isChildLink&&!fullProcess)h+=renderChildInvokeCard(t);
    else if(t._isChildLink&&fullProcess&&t._childIdx!=null&&childBlueprints[t._childIdx])h+=renderChildBpContainer(t,childBlueprints[t._childIdx]);
    else h+=renderCanvasTaskCard(t);
  });
  h+='</div></div>';
  return h;
}

// "Time to complete" label from dueSec, phrased like the real app.
function sfDurLabel(sec){
  if(!sec)return'';
  var dd=Math.floor(sec/86400),hh=Math.floor((sec%86400)/3600),mm=Math.floor((sec%3600)/60);
  var p=[];if(dd)p.push(dd+' day'+(dd>1?'s':''));if(hh)p.push(hh+' hour'+(hh>1?'s':''));if(mm)p.push(mm+' min');
  return p.length?p.join(' '):'< 1 min';
}

function sfToggleTask(taskId){
  // A card-initiated full trace blocks toggling (cards are dimmed). A Data-subtab field
  // selection is cleared first (and the canvas un-dimmed) so the task can open normally.
  if(sfTraceField&&!sfTraceFromData)return;
  if(sfTraceFromData){sfTraceField=null;sfTraceFromData=false;sfTracedTaskIds.clear();renderProcessCanvas();}
  function setOpen(id,on){
    var td=document.getElementById('sf-td-'+id);if(!td)return;
    td.classList.toggle('open',on);
    var head=td.previousElementSibling;
    if(head){var ic=head.querySelector('.expand-i');if(ic)ic.classList.toggle('open',on);}
    var row=td.closest('.tcard');if(row)row.classList.toggle('open-row',on);
  }
  if(sfExpandedTaskId===taskId){
    setOpen(taskId,false);
    sfExpandedTaskId=null;
  }else{
    if(sfExpandedTaskId)setOpen(sfExpandedTaskId,false);
    setOpen(taskId,true);
    sfExpandedTaskId=taskId;
    sfFormSel=0;   // start at the task's first form when a new card opens
  }
  renderContextPanel();
}

function sfTraceFieldClick(fieldName,fromData){
  if(sfTraceField===fieldName&&(!!sfTraceFromData===!!fromData)){sfExitTrace();return}
  sfTraceField=fieldName;
  sfTraceFromData=!!fromData;
  sfTracedTaskIds.clear();
  var fi=fieldIndex[fieldName];
  if(fi){
    fi.producers.forEach(function(p){sfTracedTaskIds.add(p.taskId)});
    fi.consumers.forEach(function(c){sfTracedTaskIds.add(c.taskId)});
  }
  // If field has no connections, find all tasks that have it as input or output
  if(!sfTracedTaskIds.size){
    var allStages=allStagesList();
    allStages.forEach(function(s){s.tasks.forEach(function(t){
      var has=false;
      t.inputs.forEach(function(i){if(i.n===fieldName)has=true});
      t.outputs.forEach(function(o){if(o.n===fieldName)has=true});
      if(has)sfTracedTaskIds.add(t.id);
    })});
  }
  renderProcessCanvas();renderContextPanel();
}

function sfExitTrace(){
  sfTraceField=null;sfTraceFromData=false;sfTracedTaskIds.clear();sfExpandedTaskId=null;
  renderProcessCanvas();renderContextPanel();
}
// Clear a Data-subtab field selection but stay on the Data tab (return to the full field list).
function sfClearDataField(){
  sfTraceField=null;sfTraceFromData=false;sfTracedTaskIds.clear();
  renderProcessCanvas();renderContextPanel();
}

function applyTraceHighlights(){
  document.querySelectorAll('#sf-canvas .tcard').forEach(function(c){
    var tid=c.dataset.tid;
    if(sfTracedTaskIds.has(tid)){
      c.classList.remove('dimmed');
      var td=c.querySelector('.tdetail');if(td)td.classList.add('open');
      var ic=c.querySelector('.expand-i');if(ic)ic.classList.add('open');
      c.querySelectorAll('.sf-field-link').forEach(function(fl){
        var fn=fl.dataset.field||'';
        if(fn===sfTraceField){fl.classList.add('traced');fl.classList.remove('dimfield')}
        else{fl.classList.add('dimfield');fl.classList.remove('traced')}
      });
    }else{
      c.classList.add('dimmed');
      var td=c.querySelector('.tdetail');if(td)td.classList.remove('open');
      var ic=c.querySelector('.expand-i');if(ic)ic.classList.remove('open');
    }
  });
  document.querySelectorAll('#sf-canvas .sf-stage-box').forEach(function(box){
    var hasTr=false;
    box.querySelectorAll('.tcard').forEach(function(c){if(sfTracedTaskIds.has(c.dataset.tid))hasTr=true});
    box.classList.toggle('dimmed',!hasTr);
  });
  document.querySelectorAll('#sf-canvas .sf-gate-box').forEach(function(g){g.classList.add('dimmed')});
  document.querySelectorAll('.fp-child-container').forEach(function(ct){
    var anyTr=false;
    ct.querySelectorAll('.tcard').forEach(function(c){if(sfTracedTaskIds.has(c.dataset.tid))anyTr=true});
    ct.style.opacity=anyTr?'':'0.25';
  });
}

function renderTraceBar(){
  var fi=fieldIndex[sfTraceField];
  if(fi){
    var pc=fi.producers.length,cc=fi.consumers.length;
    return'<div class="sf-trace-bar"><strong>Tracing:</strong> '+fi.name+' <span style="color:var(--text-dim)">('+fi.type+')</span> &mdash; '+pc+' producer'+(pc!==1?'s':'')+', '+cc+' consumer'+(cc!==1?'s':'')+'<span class="sf-trace-close" onclick="sfExitTrace()">&times;</span></div>';
  }
  return'<div class="sf-trace-bar"><strong>Tracing:</strong> '+escHtml(sfTraceField)+' <span style="color:var(--text-dim)">(no connections)</span> &mdash; in '+sfTracedTaskIds.size+' task'+(sfTracedTaskIds.size!==1?'s':'')+'<span class="sf-trace-close" onclick="sfExitTrace()">&times;</span></div>';
}

var sfBreadcrumbStack=[];
function sfEnterChildBP(childIdx){
  if(fullProcess)return;
  clearFilters();
  if(sfViewingChild)sfBreadcrumbStack.push(sfViewingChildIdx);
  sfViewingChild=true;sfViewingChildIdx=childIdx||0;sfExpandedTaskId=null;
  renderProcessCanvas();renderContextPanel();
}
function sfExitChildBP(){
  clearFilters();
  sfExpandedTaskId=null;
  if(sfBreadcrumbStack.length){
    sfViewingChildIdx=sfBreadcrumbStack.pop();
  }else{
    sfViewingChild=false;sfViewingChildIdx=0;
  }
  renderProcessCanvas();renderContextPanel();
}

function renderBreadcrumb(){
  if(!sfViewingChild)return'';
  var h='<div class="sf-breadcrumb"><span class="sf-bc-link" onclick="sfGoToRoot()">Parent Blueprint</span>';
  sfBreadcrumbStack.forEach(function(ci,i){
    var cb=childBlueprints[ci];
    h+='<span class="sf-bc-sep">&gt;</span><span class="sf-bc-link" onclick="sfGoToCrumb('+i+')">'+escHtml(cb?cb.name:'Child')+'</span>';
  });
  var cur=childBlueprints[sfViewingChildIdx];
  h+='<span class="sf-bc-sep">&gt;</span><span>'+escHtml(cur?cur.name:'Child Blueprint')+'</span>';
  h+='</div>';
  return h;
}
function sfGoToRoot(){
  clearFilters();
  sfBreadcrumbStack=[];sfViewingChild=false;sfViewingChildIdx=0;sfExpandedTaskId=null;
  renderProcessCanvas();renderContextPanel();
}
function sfGoToCrumb(idx){
  clearFilters();
  sfViewingChildIdx=sfBreadcrumbStack[idx];
  sfBreadcrumbStack=sfBreadcrumbStack.slice(0,idx);
  sfExpandedTaskId=null;
  renderProcessCanvas();renderContextPanel();
}

function sfSetCtxTab(name){
  // leaving the Data tab clears any field the Data tab had selected (its canvas trace)
  if(name!=='data'&&sfTraceFromData){sfTraceField=null;sfTraceFromData=false;sfTracedTaskIds.clear();renderProcessCanvas();}
  sfCtxTab=name;renderContextPanel();
}

// The right panel is a sub-tabbed view (Overview / Data / Documents / Forms), like the real
// Regrello workflow detail pane. Field-trace is a transient overlay that takes over the panel
// (the canvas trace-bar already signals it) so the subtab bar hides while tracing. When a task
// card is open, the subtabs scope to that task; otherwise they show the whole blueprint.
function renderContextPanel(){
  var el=document.getElementById('sf-context');if(!el)return;
  // A field trace started from inside a task CARD takes over the whole panel (the canvas
  // trace-bar signals it). A field selected from the DATA subtab keeps the subtab bar.
  if(sfTraceField&&!sfTraceFromData){el.innerHTML=renderCtxField(sfTraceField);return}
  var tid=sfExpandedTaskId;
  var hasForms=(typeof formsData!=='undefined'&&formsData&&formsData.length);
  // subtab definitions with scoped counts
  var fieldCount,docCount,formCount;
  if(tid){
    var t=taskMap[tid]||{inputs:[],outputs:[],docs:[]};
    fieldCount=sfTaskFieldList(tid).length;
    docCount=t.docs?t.docs.length:0;
    formCount=hasForms?getFormsForTask(tid).length:0;
  }else{
    fieldCount=sfFieldList().length;
    docCount=sfAllDocs().length;
    formCount=hasForms?formsData.length:0;
  }
  var tabs=[['overview','Overview',null],['data','Data',fieldCount],['documents','Documents',docCount],['forms','Forms',formCount]];
  var h='<div class="sf-subtabs">';
  tabs.forEach(function(tb){
    var cnt=(tb[2]!=null)?' <span class="sf-subtab-count">'+tb[2]+'</span>':'';
    h+='<div class="sf-subtab'+(sfCtxTab===tb[0]?' active':'')+'" onclick="sfSetCtxTab(\''+tb[0]+'\')">'+tb[1]+cnt+'</div>';
  });
  h+='</div>';
  if(tid){
    var tt=taskMap[tid];
    h+='<div class="sf-scope-banner"><span class="sf-scope-id">'+tid+'</span><span class="sf-scope-name">'+escHtml(tt?tt.name:'')+'</span><span class="sf-scope-x" title="Back to blueprint" onclick="sfToggleTask(\''+tid+'\')">&times;</span></div>';
  }
  h+='<div id="sf-ctx-content">';
  if(sfCtxTab==='data')h+=renderCtxData(tid);
  else if(sfCtxTab==='documents')h+=renderCtxDocs(tid);
  else if(sfCtxTab==='forms')h+=renderCtxForms(tid);
  else h+=(tid?renderCtxTaskOverview(tid):renderCtxSummary());
  h+='</div>';
  el.innerHTML=h;
}

function renderCtxSummary(){
  var sList=allStagesList();
  var totalTasks=0,agentCounts={},humanAssignees={},fieldSet=new Set();
  sList.forEach(function(s){s.tasks.forEach(function(t){
    totalTasks++;
    if(t._isChildLink){
      var key=t.agent;
      if(!humanAssignees[key])humanAssignees[key]={count:0,cls:'a-linked',ac:'human'};
      humanAssignees[key].count++;
    }else if(t.agentClass==='human'){
      var key=t.agent;
      if(!humanAssignees[key])humanAssignees[key]={count:0,cls:'a-human'+(t.ht?' ht-'+t.ht:''),ac:'human'};
      humanAssignees[key].count++;
    }else{
      var key=t.agent;
      if(!agentCounts[key])agentCounts[key]={count:0,cls:'a-'+t.agentClass,ac:t.agentClass};
      agentCounts[key].count++;
    }
    t.inputs.forEach(function(i){fieldSet.add(i.n)});
    t.outputs.forEach(function(o){fieldSet.add(o.n)});
  })});
  var cbName=sfViewingChild&&childBlueprints[sfViewingChildIdx]?childBlueprints[sfViewingChildIdx].name:'Child';
  var h='<div class="sf-ctx-section"><h3>'+(fullProcess?'Full Process':(sfViewingChild?escHtml(cbName):'Parent'))+' Blueprint Overview</h3>';
  h+='<div class="sf-ctx-stat"><span>Stages</span><strong>'+sList.length+'</strong></div>';
  h+='<div class="sf-ctx-stat"><span>Tasks</span><strong>'+totalTasks+'</strong></div>';
  h+='<div class="sf-ctx-stat"><span>Unique Fields</span><strong>'+fieldSet.size+'</strong></div>';
  h+='</div>';
  var hKeys=Object.keys(humanAssignees);
  if(hKeys.length){
    h+='<div class="sf-ctx-section"><h4>Assignee Breakdown</h4>';
    hKeys.forEach(function(k){
      var a=humanAssignees[k];
      h+='<div class="sf-ctx-stat filterable" data-agentname="'+escHtml(k)+'" onclick="toggleAgentFilter(\''+k.replace(/'/g,"\\'")+'\')">';
      h+='<span><span class="abadge '+a.cls+'" style="font-size:11px;padding:2px 8px 2px 5px">'+escHtml(k)+'</span></span><strong>'+a.count+'</strong></div>';
    });
    h+='</div>';
  }
  var acKeys=Object.keys(agentCounts);
  if(acKeys.length){
    h+='<div class="sf-ctx-section"><h4>Agent Breakdown</h4>';
    acKeys.forEach(function(ac){
      var a=agentCounts[ac];
      h+='<div class="sf-ctx-stat filterable" data-agentname="'+escHtml(ac)+'" onclick="toggleAgentFilter(\''+ac.replace(/'/g,"\\'")+'\')">';
      h+='<span><span class="abadge '+a.cls+'" style="font-size:11px;padding:2px 8px 2px 5px">'+escHtml(ac)+'</span></span><strong>'+a.count+'</strong></div>';
    });
    h+='</div>';
  }
  h+='<button class="sf-filter-clear'+(FS.agents.size?' vis':'')+'" onclick="clearFilters()">Clear Filters</button>';
  h+='<div class="sf-ctx-section" style="margin-top:16px;font-size:12px;color:var(--text-dim)">Click a task to see its details.<br>Click an agent to filter. Click a field to trace it.</div>';
  return h;
}

function renderCtxTaskOverview(taskId){
  var t=taskMap[taskId];if(!t)return'';
  var sid=taskToStage[taskId];
  if(!sid){childStages.forEach(function(s){s.tasks.forEach(function(t){if(t.id===taskId)sid=s.id})})}
  var parentStage=null;
  var sList=allStagesList();
  if(sid){var s=sList.find(function(st){return st.id===sid});if(s){parentStage=s}}
  var sName=parentStage?parentStage.name:'';
  var h='<div class="sf-ctx-section"><h3>Task '+t.id+'</h3>';
  h+='<div style="font-size:15px;font-weight:600;margin-bottom:4px">'+t.name+'</div>';
  h+='<div style="margin-bottom:4px"><span class="abadge '+badgeCls(t)+'">'+t.agent+'</span>';
  if(t.ttype)h+=' <span style="font-size:11px;color:var(--text-dim);margin-left:4px">'+t.ttype+(t.itype?' / '+t.itype:'')+'</span>';
  h+='</div>';
  if(sName)h+='<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Stage '+sid+': '+sName+'</div>';
  h+='</div>';
  // Description
  if(t.desc){
    h+='<div class="sf-ctx-section"><h4>Description</h4>';
    var d=t.desc.length>1000?t.desc.substring(0,1000)+'…':t.desc;
    h+='<div style="font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap">'+escHtml(d)+'</div></div>';
  }
  // (Documents live in the Documents subtab; Inputs/Outputs detail in the Data subtab.)
  // Stage start condition
  if(parentStage&&parentStage.condition){
    h+='<div class="sf-ctx-section"><h4>Stage Start Condition</h4>';
    h+='<div style="font-size:12px;color:var(--conditional);line-height:1.4">IF: '+escHtml(parentStage.condition)+'</div></div>';
  }
  // Time to complete
  if(t.dueSec){
    h+='<div class="sf-ctx-section"><h4>Time to Complete</h4><div style="font-size:12px;color:var(--text)">';
    var sec=t.dueSec,dd=Math.floor(sec/86400),hh=Math.floor((sec%86400)/3600),mm=Math.floor((sec%3600)/60);
    var parts=[];if(dd)parts.push(dd+'d');if(hh)parts.push(hh+'h');if(mm)parts.push(mm+'m');
    h+=(parts.length?parts.join(' '):'< 1m')+'</div></div>';
  }
  // Task dependencies (explicit deps from parser)
  if(t.deps&&t.deps.length){
    h+='<div class="sf-ctx-section"><h4>Task Prerequisites</h4>';
    t.deps.forEach(function(d){h+='<div style="font-size:12px;padding:2px 0;color:var(--text-dim)">Depends on: '+escHtml(d)+'</div>'});
    h+='</div>';
  }
  // Data dependencies (upstream/downstream)
  var a=adj[taskId];
  if(a&&(a.up.size||a.dn.size)){
    h+='<div class="sf-ctx-section"><h4>Data Dependencies</h4>';
    if(a.up.size){
      h+='<div style="margin-bottom:6px">';
      a.up.forEach(function(u){var tm=taskMap[u];h+='<span class="sf-ctx-tag cons" title="'+(tm?tm.name:'')+'">&#8592; '+u+(tm?': '+tm.name:'')+'</span>'});
      h+='</div>';
    }
    if(a.dn.size){
      h+='<div>';
      a.dn.forEach(function(d){var tm=taskMap[d];h+='<span class="sf-ctx-tag prod" title="'+(tm?tm.name:'')+'">&#8594; '+d+(tm?': '+tm.name:'')+'</span>'});
      h+='</div>';
    }
    h+='</div>';
  }
  // Inputs
  if(t.inputs.length){
    h+='<div class="sf-ctx-section"><h4>Inputs ('+t.inputs.length+')</h4>';
    t.inputs.forEach(function(i){
      h+='<div style="font-size:12px;padding:3px 0"><span style="color:var(--warning-text-muted)">'+i.n+'</span> <span style="color:var(--text-dim)">('+i.t+')</span>';
      if(i.src)h+=' <span style="color:var(--orange);font-size:12px">&larr; '+i.src+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }
  // Outputs
  if(t.outputs.length){
    h+='<div class="sf-ctx-section"><h4>Outputs ('+t.outputs.length+')</h4>';
    t.outputs.forEach(function(o){
      var consumers=[];
      parentEdges.forEach(function(e){if(e.from===t.id&&e.data===o.n)consumers.push(e.to)});
      h+='<div style="font-size:12px;padding:3px 0">'+(o.req?'<span class="req-ast">*</span> ':'')+'<span style="color:var(--green)">'+o.n+'</span> <span style="color:var(--text-dim)">('+o.t+')</span>';
      if(consumers.length)h+=' <span style="color:var(--danger-text-muted);font-size:12px">&rarr; '+consumers.join(', ')+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }
  return h;
}

// ---- Right-panel subtab content helpers ----
// Blueprint-wide aggregates (respect Full-Process / child-BP scope via allStagesList()).
// Every field in the current scope (parent / child / full-process), in first-appearance order.
// Field NAMES come from walking the visible tasks (so the list reflects what you're looking at),
// but each field's producer/consumer task IDs come from the authoritative cross-blueprint
// fieldIndex — so the counts + detail match the canvas trace (which also uses fieldIndex).
function sfFieldList(){
  var order=[],seen={};
  allStagesList().forEach(function(s){s.tasks.forEach(function(t){
    (t.outputs||[]).forEach(function(o){if(!seen[o.n]){seen[o.n]=1;order.push({n:o.n,t:o.t})}});
    (t.inputs||[]).forEach(function(i){if(!seen[i.n]){seen[i.n]=1;order.push({n:i.n,t:i.t})}});
  })});
  return order.map(function(o){return sfFieldEntry(o.n,o.t)});
}
// Build a {n,t,producers[],consumers[]} entry for a field, pulling producer/consumer task IDs
// from fieldIndex (deduped, preserving order). Falls back to the visible-scope scan if the field
// is absent from fieldIndex.
function sfFieldEntry(name,type){
  var fi=(typeof fieldIndex!=='undefined')?fieldIndex[name]:null;
  var prod=[],cons=[];
  if(fi){
    fi.producers.forEach(function(p){if(prod.indexOf(p.taskId)<0)prod.push(p.taskId)});
    fi.consumers.forEach(function(c){if(cons.indexOf(c.taskId)<0)cons.push(c.taskId)});
    type=type||fi.type;
  }else{
    allStagesList().forEach(function(s){s.tasks.forEach(function(t){
      (t.outputs||[]).forEach(function(o){if(o.n===name&&prod.indexOf(t.id)<0)prod.push(t.id)});
      (t.inputs||[]).forEach(function(i){if(i.n===name&&cons.indexOf(t.id)<0)cons.push(t.id)});
    })});
  }
  return{n:name,t:type||'',producers:prod,consumers:cons};
}
// The fields used by one task (its outputs then inputs), in the same {n,t,producers,consumers} shape
// but with producers/consumers spanning the WHOLE scope (so you see who else touches each field).
function sfTaskFieldList(taskId){
  var all=sfFieldList(),t=taskMap[taskId];if(!t)return[];
  var names=[],seen={};
  (t.outputs||[]).forEach(function(o){if(!seen[o.n]){seen[o.n]=1;names.push(o.n)}});
  (t.inputs||[]).forEach(function(i){if(!seen[i.n]){seen[i.n]=1;names.push(i.n)}});
  var byName={};all.forEach(function(f){byName[f.n]=f});
  return names.map(function(n){return byName[n]}).filter(Boolean);
}
function sfAllDocs(){
  var out=[];
  allStagesList().forEach(function(s){s.tasks.forEach(function(t){
    (t.docs||[]).forEach(function(dn){out.push({doc:dn,tid:t.id})});
  })});
  return out;
}
function getFormsForTask(taskId){
  if(typeof formsData==='undefined'||!formsData)return[];
  return formsData.filter(function(f){return f.taskIds&&f.taskIds.indexOf(taskId)!==-1});
}
// Task chips for a field's producers / consumers.
function sfFieldTaskChips(ids,cls){
  if(!ids.length)return'<span class="sf-io-none">none</span>';
  return ids.map(function(tid){var tm=taskMap[tid];return'<span class="sf-ctx-tag '+cls+'" title="'+escHtml(tm?tm.name:'')+'">'+tid+(tm?': '+escHtml((tm.name||'').substring(0,28)):'')+'</span>'}).join('');
}
// One collapsed field row (name + type + small producer/consumer counts); clicking selects it.
function sfFieldListRow(f){
  var esc=String(f.n).replace(/'/g,"\\'");
  var meta=[];
  if(f.producers.length)meta.push('<span class="sf-fld-prod">&#8593;'+f.producers.length+'</span>');
  if(f.consumers.length)meta.push('<span class="sf-fld-cons">&#8595;'+f.consumers.length+'</span>');
  var h='<div class="sf-fld-row" onclick="sfTraceFieldClick(\''+esc+'\',true)">';
  h+=ftIcon(f.t)+'<span class="sf-fld-name">'+escHtml(f.n)+'</span>';
  h+='<span class="sf-fld-type">'+escHtml(f.t||'')+'</span>';
  h+='<span class="sf-fld-meta">'+meta.join('')+'</span>';
  h+='</div>';
  return h;
}
// Data subtab. No field selected → the full field list (all fields in order, each with its
// producer/consumer tasks). A field selected (sfTraceField, from this tab) → just that field's
// producing/consuming tasks, with a back link. Scoped to a task when a card is open.
function renderCtxData(taskId){
  var list=taskId?sfTaskFieldList(taskId):sfFieldList();
  // ---- selected-field detail ----
  if(sfTraceField&&sfTraceFromData){
    var sel=null;list.forEach(function(f){if(f.n===sfTraceField)sel=f});
    // field may sit outside the task's own list; fall back to the full scope so detail still shows
    if(!sel){sfFieldList().forEach(function(f){if(f.n===sfTraceField)sel=f})}
    var h='<div class="sf-fld-back" onclick="sfClearDataField()">&#8592; All fields</div>';
    if(!sel){
      h+='<div class="sf-ctx-section"><div class="sf-fld-detail-name">'+escHtml(sfTraceField)+'</div>';
      h+='<div class="sf-ctx-empty">Appears in '+sfTracedTaskIds.size+' task'+(sfTracedTaskIds.size!==1?'s':'')+' but has no tracked data-flow connections.</div></div>';
      return h;
    }
    h+='<div class="sf-ctx-section"><div class="sf-fld-detail-name">'+ftIcon(sel.t)+escHtml(sel.n)+'</div>';
    h+='<div class="sf-fld-detail-type">'+escHtml(sel.t||'')+'</div></div>';
    h+='<div class="sf-ctx-section"><h4>Produced By ('+sel.producers.length+')</h4>'+sfFieldTaskChips(sel.producers,'prod')+'</div>';
    h+='<div class="sf-ctx-section"><h4>Consumed By ('+sel.consumers.length+')</h4>'+sfFieldTaskChips(sel.consumers,'cons')+'</div>';
    h+='<div class="sf-ctx-section" style="font-size:11px;color:var(--text-dim)">These tasks are highlighted in the process. Click the field again to clear.</div>';
    return h;
  }
  // ---- full field list ----
  if(!list.length)return'<div class="sf-ctx-empty">No data fields'+(taskId?' on this task.':' in scope.')+'</div>';
  var h='<div class="sf-ctx-section" style="margin-bottom:8px"><h4>Fields ('+list.length+')</h4></div>';
  h+='<div class="sf-fld-list">';
  list.forEach(function(f){h+=sfFieldListRow(f)});
  h+='</div>';
  h+='<div class="sf-ctx-section" style="margin-top:12px;font-size:11px;color:var(--text-dim)">Click a field to see just the tasks that produce or consume it.</div>';
  return h;
}
function renderCtxDocs(taskId){
  var rows;
  if(taskId){var t=taskMap[taskId]||{};rows=(t.docs||[]).map(function(dn){return{doc:dn}})}
  else rows=sfAllDocs();
  if(!rows.length)return'<div class="sf-ctx-empty">No documents attached.</div>';
  var h='<div class="sf-ctx-section"><h4>Documents ('+rows.length+')</h4>';
  rows.forEach(function(r){
    h+='<div class="sf-doc-row"><span class="ft-icon ft-doc"></span><span>'+escHtml(r.doc)+'</span>'+(r.tid?'<span class="sf-doc-owner">Task '+r.tid+'</span>':'')+'</div>';
  });
  h+='</div>';
  return h;
}
function sfFormSelect(i){sfFormSel=i;renderContextPanel()}

  var h='';

    h+='<div class="sf-form-chips">';

  var h='<div class="sf-ctx-section"><h3>Field Trace</h3>';

  h+='</div>';
  // Producers
  if(fi.producers.length){

      var tm=taskMap[p.taskId];var bp=p.bp==='child'?' <span style="color:var(--subprocess-text)">[Child]</span>':'';

  // Consumers
  if(fi.consumers.length){
    h+='<div class="sf-ctx-section"><h4>Consumed By ('+fi.consumers.length+')</h4>';
    fi.consumers.forEach(function(c){
      var tm=taskMap[c.taskId];var bp=c.bp==='child'?' <span style="color:var(--subprocess-text)">[Child]</span>':'';
      h+='<span class="sf-ctx-tag cons">'+c.taskId+(tm?': '+tm.name:'')+bp+'</span>';
    });
    h+='</div>';
  }
  // Journey narrative
  var stageNums=new Set();
  fi.producers.forEach(function(p){stageNums.add(p.bp==='child'?'C'+p.stageId:p.stageId)});
  fi.consumers.forEach(function(c){stageNums.add(c.bp==='child'?'C'+c.stageId:c.stageId)});
  var sArr=[];stageNums.forEach(function(s){sArr.push(s)});
  h+='<div class="sf-ctx-section"><h4>Journey</h4>';
  h+='<div class="sf-ctx-journey">Appears in Stage'+(sArr.length>1?'s ':' ')+sArr.join(', ')+'.<br>';
  h+=fi.producers.length+' producer'+(fi.producers.length!==1?'s':'')+' &rarr; '+fi.consumers.length+' consumer'+(fi.consumers.length!==1?'s':'');
  var hasCross=fi.producers.some(function(p){return p.bp!==fi.producers[0].bp})||fi.consumers.some(function(c){return c.bp!=='parent'});
  if(hasCross)h+='<br><span style="color:var(--subprocess-text)">Crosses blueprint boundary</span>';
  h+='</div></div>';
  return h;
}

function applyDetailedFilters(){
  var q=FS.search;
  // Dim task cards in Process Flow
  document.querySelectorAll('.tcard').forEach(function(c){
    var tid=c.dataset.tid;
    var t=taskMap[tid];
    if(t)c.classList.toggle('dimmed',!isTaskVis(t));
  });
  // Dim stage boxes in process canvas
  var sList=allStagesList();
  var childHasVis=fullProcess&&childStages.some(stageHasVisTasks);
  var linkStageIds={};
  if(fullProcess)stages.forEach(function(s){s.tasks.forEach(function(t){if(t._isChildLink)linkStageIds[s.id]=true})});
  document.querySelectorAll('.sf-stage-box,.sf-gate-box').forEach(function(box){
    var sid=box.dataset.sid;
    var s=sList.find(function(st){return String(st.id)===String(sid)});
    if(!s)return;
    var vis=stageHasVisTasks(s);
    if(!vis&&fullProcess&&linkStageIds[sid]&&childHasVis)vis=true;
    box.classList.toggle('dimmed',!vis);
  });
  // Dim child containers based on their own task card visibility
  document.querySelectorAll('.fp-child-container').forEach(function(ct){
    var anyVis=false;
    ct.querySelectorAll('.tcard').forEach(function(c){
      var tid=c.dataset.tid;
      var t=taskMap[tid];
      if(t&&isTaskVis(t))anyVis=true;
    });
    ct.style.opacity=anyVis?'':'0.25';
  });
  // Field Registry — sync global search into fieldSearch
  var fs=document.getElementById('fieldSearch');
  if(fs){fs.value=q;filterFieldRows()}
  // Agent Prompts — apply global search
  ptFilter();
}

var frAllFields=[],frSortKey='usage',frSortAsc=false,frSelTypes=new Set,frMaxU=1;

function renderFieldReg(){
  var fields={};
  function proc(sList,pref){
    sList.forEach(function(s){s.tasks.forEach(function(t){
      t.outputs.forEach(function(o){
        if(!o.id)return;var k=o.id+'_'+o.n;
        if(!fields[k])fields[k]={name:o.n,type:o.t,id:o.id,prod:[],cons:[],req:false,reqTasks:[],optTasks:[]};
        fields[k].prod.push(pref+t.id);
        if(o.req){fields[k].req=true;fields[k].reqTasks.push(pref+t.id)}
        else{fields[k].optTasks.push(pref+t.id)}
      });
      t.inputs.forEach(function(i){
        if(!i.id)return;var k=i.id+'_'+i.n;
        if(!fields[k])fields[k]={name:i.n,type:i.t,id:i.id,prod:[],cons:[],req:false,reqTasks:[],optTasks:[]};
        fields[k].cons.push(pref+t.id);
      });
    })});
  }
  proc(stages,'');if(fullProcess)proc(childStages,'');
  frAllFields=Object.values(fields);
  frMaxU=Math.max.apply(null,frAllFields.map(function(f){return f.prod.length+f.cons.length}))||1;
  frSortKey='usage';frSortAsc=false;frSelTypes.clear();

  var types={};frAllFields.forEach(function(f){types[f.type]=true});
  var typeList=Object.keys(types).sort();

  var h='<input type="hidden" id="fieldSearch">';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="font-size:12px;color:var(--text-dim)">'+frAllFields.length+' unique fields</span><span style="font-size:11px;color:var(--text-dim);display:inline-flex;align-items:center;gap:4px;margin-left:12px"><span style="width:3px;height:12px;background:var(--agent-pill-text);border-radius:1px"></span> Child blueprint field</span><button class="fbtn" style="margin-left:auto" onclick="frExportCSV()">Export CSV</button></div>';

  h+='<div class="table-wrap"><table class="ftable"><thead><tr>';
  h+='<th class="sortable sort-active" data-col="name" onclick="frSort(\'name\')" style="width:200px">Field Name <span class="sort-arrow">▼</span><span class="pt-resize"></span></th>';
  h+='<th style="width:100px"><div class="ms-wrap" style="display:inline"><button class="ms-btn ms-inline" id="ms-btn-ftype" onclick="event.stopPropagation();msToggle(\'ms-panel-ftype\')" style="border:none;background:none;padding:0;font-size:12px;font-weight:600;color:var(--text-dim)">Type <span class="sort-arrow">▾</span></button>';
  h+='<div class="ms-panel ms-fixed" id="ms-panel-ftype">';
  h+='<div class="ms-actions"><button onclick="frTypeAll(true)">Select All</button><button onclick="frTypeAll(false)">Clear</button></div>';
  typeList.forEach(function(t){
    h+='<div class="ms-item"><input type="checkbox" id="ms-ft-'+t+'" onchange="frTypeToggle(\''+t+'\')"><label for="ms-ft-'+t+'"><span class="ftbadge '+(ftClsMap[t]||'ft-text')+'">'+t+'</span></label></div>';
  });
  h+='</div></div><span class="pt-resize"></span></th>';
  h+='<th style="width:60px">ID<span class="pt-resize"></span></th>';
  h+='<th class="sortable" data-col="prod" onclick="frSort(\'prod\')">Produced By <span class="sort-arrow">▼</span><span class="pt-resize"></span></th>';
  h+='<th class="sortable" data-col="cons" onclick="frSort(\'cons\')">Consumed By <span class="sort-arrow">▼</span><span class="pt-resize"></span></th>';
  h+='<th class="sortable sort-active" data-col="usage" onclick="frSort(\'usage\')" style="width:70px">Usage <span class="sort-arrow">▼</span><span class="pt-resize"></span></th>';
  h+='<th style="width:80px">Heat</th>';
  h+='</tr></thead><tbody id="fieldBody"></tbody></table></div>';
  document.getElementById('tp-fields').innerHTML=h;
  frRenderRows();

  // Column resize drag
  document.querySelectorAll('#tp-fields .pt-resize').forEach(function(handle){
    handle.addEventListener('mousedown',function(e){
      e.preventDefault();e.stopPropagation();
      var th=handle.parentElement;
      var startX=e.pageX,startW=th.offsetWidth;
      handle.classList.add('active');
      function onMove(ev){th.style.width=(startW+(ev.pageX-startX))+'px'}
      function onUp(){handle.classList.remove('active');document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)}
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
  });
}

function frSort(col){
  if(frSortKey===col)frSortAsc=!frSortAsc;
  else{frSortKey=col;frSortAsc=col==='name'}
  document.querySelectorAll('.ftable th.sortable').forEach(function(th){
    th.classList.toggle('sort-active',th.dataset.col===col);

  });

}

function frTypeToggle(t){

  frUpdateTypeBtn();frRenderRows();
}
function frTypeAll(sel){
  var panel=document.getElementById('ms-panel-ftype');if(!panel)return;
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=sel});

function frUpdateTypeBtn(){

}

function frRenderRows(){
  var tbody=document.getElementById('fieldBody');if(!tbody)return;
  var q=((document.getElementById('fieldSearch')||{}).value||'').toLowerCase().trim();
  var words=q?q.split(/\s+/).filter(function(w){return w.length>0}):[];
  var hasType=frSelTypes.size>0;

  var filtered=frAllFields.filter(function(f){
    if(hasType&&!frSelTypes.has(f.type))return false;
    if(words.length){
      var blob=(f.name+' '+f.type+' '+f.id+' '+f.prod.map(function(p){var tm=taskMap[p];return p+(tm?' '+tm.name:'')+' '+_stageNameFor(p)}).join(' ')+' '+f.cons.map(function(c){var tm=taskMap[c];return c+(tm?' '+tm.name:'')+' '+_stageNameFor(c)}).join(' ')).toLowerCase();
      if(!words.every(function(w){return blob.includes(w)}))return false;
    }
    return true;
  });

  filtered.sort(function(a,b){
    var va,vb;
    if(frSortKey==='name'){va=a.name.toLowerCase();vb=b.name.toLowerCase()}
    else if(frSortKey==='prod'){va=a.prod.length;vb=b.prod.length}
    else if(frSortKey==='cons'){va=a.cons.length;vb=b.cons.length}
    else{va=a.prod.length+a.cons.length;vb=b.prod.length+b.cons.length}
    if(va<vb)return frSortAsc?-1:1;if(va>vb)return frSortAsc?1:-1;return 0;
  });

  var h='';
  filtered.forEach(function(f){
    var u=f.prod.length+f.cons.length;
    var heat=Math.ceil((u/frMaxU)*5);
    var heatCol=[cssVar('--surface2'),cssVar('--red'),cssVar('--orange'),cssVar('--warning-text-muted'),cssVar('--green'),cssVar('--accent')][heat]||cssVar('--accent');
    var isChildField=fullProcess&&f.prod.concat(f.cons).length>0&&f.prod.concat(f.cons).every(function(id){return String(id).indexOf('C')===0});
    h+='<tr class="frow'+(isChildField?' child-row':'')+'">';
    h+='<td><span class="flink" onclick=\'openFieldModal('+JSON.stringify(f).replace(/'/g,"&#39;")+')\'>'+f.name+'</span></td>';
    h+='<td><span class="ftbadge '+(ftClsMap[f.type]||'ft-text')+'">'+f.type+'</span></td>';
    h+='<td style="color:var(--text-dim);font-size:12px">'+f.id+'</td>';
    h+='<td>'+f.prod.map(function(p){var tm=taskMap[p];return'<span class="task-chip" onclick="jumpToTask(\''+p+'\')">'+p+(tm?': '+tm.name:'')+'</span>'}).join('')+'</td>';
    h+='<td>'+f.cons.map(function(c){var tm=taskMap[c];return'<span class="task-chip" onclick="jumpToTask(\''+c+'\')">'+c+(tm?': '+tm.name:'')+'</span>'}).join('')+'</td>';
    h+='<td style="text-align:center">'+u+'</td>';
    h+='<td><div class="heat-bar"><div class="heat-fill" style="width:'+(heat*20)+'%;background:'+heatCol+'"></div></div></td>';
    h+='</tr>';
  });
  tbody.innerHTML=h;
}

function filterFieldRows(){
  frRenderRows();
}
function frExportCSV(){
  function taskLabel(tid){var t=taskMap[tid];return tid+(t?': '+t.name:'');}
  var rows=[['Field Name','Type','ID','Produced By','Consumed By','Usage','Required']];
  frAllFields.forEach(function(f){
    rows.push([
      '"'+f.name.replace(/"/g,'""')+'"',
      f.type,
      f.id,
      '"'+f.prod.map(taskLabel).join('; ').replace(/"/g,'""')+'"',
      '"'+f.cons.map(taskLabel).join('; ').replace(/"/g,'""')+'"',
      f.prod.length+f.cons.length,
      f.req?'Yes':'No'
    ]);
  });
  var csv=rows.map(function(r){return r.join(',')}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='field_registry.csv';
  a.click();
}

var copyIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
var checkIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
var csvIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

var ptAllRows=[];
var ptSortKey='id',ptSortAsc=true;
var ptSelAgents=new Set,ptSelStages=new Set;

function ptStripHtml(s){return s?s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]*>/g,'').replace(/\n{3,}/g,'\n\n').trim():''}
function ptWordCount(s){var t=ptStripHtml(s);return t?t.split(/\s+/).filter(function(w){return w.length>0}).length:0}
function ptFieldMentions(s){if(!s)return[];var m=s.match(/\[([^\]]+)\]/g);return m?m.map(function(f){return f.slice(1,-1)}):[]}

function ptBuildRows(){
  var rows=[];
  stages.forEach(function(s){s.tasks.forEach(function(t){
    if(t.agentClass==='human')return;
    var tid=t.id,p=taskPrompts[tid]||'',dc=docReaderConfig[tid];
    var plainText=dc?((dc.fields||[]).map(function(f){return f.n+': '+(f.helper||'')}).join('; ')):ptStripHtml(p);
    var fc=t.inputs.length+t.outputs.length;
    rows.push({t:t,stage:s,bp:'parent',tid:tid,ac:t.agentClass||'ai',
      wc:ptWordCount(p||(dc?plainText:'')),fc:fc,
      hasContent:(p.length>0)||!!dc,plainText:plainText})
  })});
  if(fullProcess){
    childStages.forEach(function(s){s.tasks.forEach(function(t){
      if(t.agentClass==='human')return;
      var tid=t.id,p=taskPrompts[tid]||'',dc=docReaderConfig[tid];
      var plainText=dc?((dc.fields||[]).map(function(f){return f.n+': '+(f.helper||'')}).join('; ')):ptStripHtml(p);
      var fc=t.inputs.length+t.outputs.length;
      rows.push({t:t,stage:s,bp:'child',tid:tid,ac:t.agentClass||'ai',
        wc:ptWordCount(p||(dc?plainText:'')),fc:fc,
        hasContent:(p.length>0)||!!dc,plainText:plainText})
    })});
  }
  return rows;
}

function ptSortRows(rows,key,asc){
  return rows.slice().sort(function(a,b){
    var va,vb;
    if(key==='id'){va=a.tid;vb=b.tid}
    else if(key==='agent'){va=a.t.agent.toLowerCase();vb=b.t.agent.toLowerCase()}
    else{va=a.tid;vb=b.tid}
    if(va<vb)return asc?-1:1;if(va>vb)return asc?1:-1;return 0;
  });
}

// Multi-select dropdown logic
function msToggle(id){
  var panel=document.getElementById(id);if(!panel)return;
  var isOpen=panel.classList.toggle('open');
  document.querySelectorAll('.ms-panel.open').forEach(function(p){if(p.id!==id){p.classList.remove('open');p.style.top='';p.style.left=''}});
  if(isOpen&&panel.classList.contains('ms-fixed')){
    var btn=panel.parentElement.querySelector('.ms-btn');
    if(btn){var r=btn.getBoundingClientRect();panel.style.top=(r.bottom+4)+'px';panel.style.left=r.left+'px'}
  }
  if(isOpen){
    var close=function(e){if(!panel.parentElement.contains(e.target)){panel.classList.remove('open');panel.style.top='';panel.style.left='';document.removeEventListener('click',close)}};
    setTimeout(function(){document.addEventListener('click',close)},0);
  }
}
function msSelectAll(id,group){
  var panel=document.getElementById(id);if(!panel)return;
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=true});

  else if(group==='agent'){ptSelAgents.clear();['ai','doc','excel','regrello','tabular','flash','human'].forEach(function(a){ptSelAgents.add(a)})}
  msUpdateBtn(group);ptFilter();
}
function msClearAll(id,group){
  var panel=document.getElementById(id);if(!panel)return;
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=false});
  if(group==='stage')ptSelStages.clear();else if(group==='agent')ptSelAgents.clear();
  msUpdateBtn(group);ptFilter();
}
function msToggleItem(val,group){
  var set=group==='stage'?ptSelStages:ptSelAgents;
  if(set.has(val))set.delete(val);else set.add(val);
  msUpdateBtn(group);ptFilter();
}
function msUpdateBtn(group){
  var btn=document.getElementById('ms-btn-'+group);if(!btn)return;
  var set=group==='stage'?ptSelStages:ptSelAgents;
  var label=group==='stage'?'Stages':'Agents';
  var countEl=btn.querySelector('.ms-count');

  else if(countEl)countEl.remove();

  var existing=btn.querySelector('.ms-count');
  if(set.size&&!existing){btn.innerHTML=label+' <span class="ms-count">'+set.size+'</span>'}

}

function ptCopy(tid){
  var text='';
  if(docReaderConfig[tid]){
    var cfg=docReaderConfig[tid],lines=[];
    if(cfg.form)lines.push('Form: '+cfg.form);
    (cfg.fields||[]).forEach(function(f){
      var p=[f.n,f.t];if(f.helper)p.push(f.helper);if(f.multi)p.push('Multiple: Yes');
      if(f.choices&&f.choices.length)p.push('Choices: '+f.choices.join(', '));
      lines.push(p.join(' | '));
    });
    text=lines.join('\n');
  }else if(taskPrompts[tid]){text=ptStripHtml(taskPrompts[tid])}
  if(!text)return;
  var btn=document.getElementById('ptc-'+tid);
  navigator.clipboard.writeText(text).then(function(){
    if(btn){btn.classList.add('copied');btn.textContent='\u2713';
    setTimeout(function(){btn.classList.remove('copied');btn.innerHTML=copyIcon},2000)}
  });
}

function ptCopyAll(){
  var vis=ptGetVisible();
  var lines=[];
  vis.forEach(function(tid){
    var t=taskMap[tid];if(!t)return;
    var text='';
    if(docReaderConfig[tid]){
      var cfg=docReaderConfig[tid],dl=[];
      if(cfg.form)dl.push('Form: '+cfg.form);
      (cfg.fields||[]).forEach(function(f){dl.push(f.n+': '+(f.helper||''))});
      text=dl.join('\n');
    }else if(taskPrompts[tid]){text=ptStripHtml(taskPrompts[tid])}
    if(text)lines.push('--- Task '+tid+': '+t.name+' ---\n'+text);
  });
  if(!lines.length)return;
  navigator.clipboard.writeText(lines.join('\n\n'));
}

function ptExportCSV(){
  var vis=ptGetVisible();
  var csvRows=[['Task ID','Task Name','Stage','Agent','Shared Fields','Requested Fields','Prompt'].map(function(h){return '"'+h+'"'}).join(',')];
  vis.forEach(function(tid){
    var r=ptAllRows.find(function(x){return x.tid===tid});if(!r)return;
    var text=r.plainText||'';
    var sLabel=(r.bp==='child'?'':'S')+r.stage.id+': '+r.stage.name;
    var shFields=r.t.inputs.map(function(i){return i.n+' ('+i.t+')'}).join('; ');
    var reqFields=r.t.outputs.map(function(o){return(o.req?'*':'')+o.n+' ('+o.t+')'}).join('; ');
    var row=[
      '"'+String(tid)+'"',
      '"'+r.t.name.replace(/"/g,'""')+'"',
      '"'+sLabel.replace(/"/g,'""')+'"',
      '"'+r.t.agent.replace(/"/g,'""')+'"',
      '"'+(shFields||'').replace(/"/g,'""')+'"',
      '"'+(reqFields||'').replace(/"/g,'""')+'"',
      '"'+text.replace(/"/g,'""')+'"'
    ];
    csvRows.push(row.join(','));
  });
  var blob=new Blob([csvRows.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='agent_prompts.csv';a.click();
  URL.revokeObjectURL(url);
}

function ptFilter(){
  var q=FS.search.toLowerCase();
  var hasAg=ptSelAgents.size>0;
  var trs=document.querySelectorAll('#ptTbody tr');
  var visCount=0,totalVis=0;
  trs.forEach(function(row){
    var tid=row.getAttribute('data-tid')||'';
    var ac=row.getAttribute('data-agent')||'';
    var t=taskMap[tid];
    var nm=t?(t.name||'').toLowerCase():'';
    var ag=t?(t.agent||'').toLowerCase():'';
    var pt=taskPrompts[tid]?taskPrompts[tid].toLowerCase():'';
    var inps=t?t.inputs.map(function(i){return i.n+' '+i.t}).join(' ').toLowerCase():'';
    var outs=t?t.outputs.map(function(o){return o.n+' '+o.t}).join(' ').toLowerCase():'';
    var desc=t&&t.desc?t.desc.toLowerCase():'';
    var sn=_stageNameFor(tid).toLowerCase();
    var blob=tid.toLowerCase()+' '+nm+' '+ag+' '+sn+' '+desc+' '+inps+' '+outs+' '+pt;
    var words=q?q.split(/\s+/).filter(function(w){return w.length>0}):[];
    var matchQ=!words.length||words.every(function(w){return blob.indexOf(w)!==-1});
    var matchAg=!hasAg||ptSelAgents.has(ac);
    var vis=matchQ&&matchAg;
    row.style.display=vis?'':'none';
    if(vis){totalVis++;var r=ptAllRows.find(function(x){return x.tid===tid});if(r&&r.hasContent)visCount++}
  });
  var stats=document.getElementById('ptStats');
  var filtered=q||hasAg;
  if(stats)stats.textContent=visCount+' prompts'+(filtered?' (filtered)':'');
}
