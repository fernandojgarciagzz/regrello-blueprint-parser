<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre-d3/0.6.4/dagre-d3.min.js"></script>
<style>
:root{--bg:#f7f9fb;--surface:#ffffff;--surface2:#eef1f3;--border:#dde2e6;--text:#1b2024;--text-dim:#5d656c;--text-placeholder:#88929a;--text-disabled:#b3bdc5;--text-interactive:#1672c7;--shadow-rgb:27,32,36;--accent:#1875d8;--accent-hover:#0067c9;--green:#0f8062;--green-hover:#007255;--orange:#c68006;--orange-hover:#b97400;--red:#c8414a;--red-hover:#b8323d;--neutral-soft:#eef1f3;--neutral-soft-hover:#e5e9ec;--neutral-soft-pressed:#dde2e6;--neutral-solid:#88929a;--neutral-solid-hover:#7c868e;--neutral-border:#d5dbe0;--primary-soft:#eaf3fe;--primary-border:#b7d5fb;--primary-text-muted:#1372d4;--danger-soft:#fdeceb;--danger-border:#f7c0bf;--danger-text-muted:#c33c46;--success-soft:#e4f7ef;--success-border:#acddc9;--success-text-muted:#047c5f;--warning-soft:#ffeed4;--warning-border:#f9ca92;--warning-text-muted:#955d00;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--shadow-card:0 1px 2px 0 rgba(0,0,0,.05);--shadow-1:0 1px 2px 0 rgba(0,0,0,.16),0 1px 2px 0 rgba(0,0,0,.06),0 0 2px 0 rgba(0,0,0,.06);--shadow-2:0 2px 8px 0 rgba(0,0,0,.16),0 1px 4px 0 rgba(0,0,0,.06),0 0 2px 0 rgba(0,0,0,.06);--shadow-3:0 4px 14px 0 rgba(0,0,0,.16),0 2px 8px 0 rgba(0,0,0,.06),0 0 2px 0 rgba(0,0,0,.06);--shadow-4:0 8px 24px 0 rgba(0,0,0,.16),0 4px 14px 0 rgba(0,0,0,.06),0 0 2px 0 rgba(0,0,0,.06);--tooltip-bg:#1b2024;--tooltip-text:#ffffff;--agent-ai:var(--agent-pill-text);--agent-doc:var(--agent-pill-text);--agent-excel:var(--agent-pill-text);--agent-human:var(--agent-pill-text);--agent-regrello:var(--agent-pill-text);--agent-tabular:var(--agent-pill-text);--agent-flash:var(--agent-pill-text);--agent-pill-bg:#f3edff;--agent-pill-text:#7c3aed;--subprocess:var(--neutral-solid);--subprocess-bg:rgba(136,146,154,.08);--subprocess-text:var(--neutral-solid);--conditional:var(--orange)}
:root[data-theme="dark"]{--bg:#0f1419;--surface:#1a2029;--surface2:#242c36;--border:#3a4350;--text:#e8ecf0;--text-dim:#8a95a0;--text-placeholder:#6a747e;--text-disabled:#4a535c;--text-interactive:#7ab4ff;--shadow-rgb:0,0,0;--accent:#5a9cf5;--accent-hover:#7ab4ff;--green:#34c77e;--green-hover:#4cd892;--orange:#dda030;--orange-hover:#eab040;--red:#f06060;--red-hover:#ff7070;--neutral-soft:#242c36;--neutral-soft-hover:#2c3540;--neutral-soft-pressed:#343e4a;--neutral-solid:#505a65;--neutral-solid-hover:#5a6470;--neutral-border:#3a4350;--primary-soft:#1a2a40;--primary-border:#2a4a70;--primary-text-muted:#7ab4ff;--danger-soft:#301820;--danger-border:#503030;--danger-text-muted:#f06060;--success-soft:#102820;--success-border:#204838;--success-text-muted:#34c77e;--warning-soft:#2a2010;--warning-border:#504020;--warning-text-muted:#dda030;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--shadow-card:0 1px 2px 0 rgba(0,0,0,.15);--shadow-1:0 1px 2px 0 rgba(0,0,0,.3),0 1px 2px 0 rgba(0,0,0,.15),0 0 2px 0 rgba(0,0,0,.15);--shadow-2:0 2px 8px 0 rgba(0,0,0,.3),0 1px 4px 0 rgba(0,0,0,.15),0 0 2px 0 rgba(0,0,0,.15);--shadow-3:0 4px 14px 0 rgba(0,0,0,.3),0 2px 8px 0 rgba(0,0,0,.15),0 0 2px 0 rgba(0,0,0,.15);--shadow-4:0 8px 24px 0 rgba(0,0,0,.3),0 4px 14px 0 rgba(0,0,0,.15),0 0 2px 0 rgba(0,0,0,.15);--tooltip-bg:#e8ecf0;--tooltip-text:#0f1419;--agent-ai:var(--agent-pill-text);--agent-doc:var(--agent-pill-text);--agent-excel:var(--agent-pill-text);--agent-human:var(--agent-pill-text);--agent-regrello:var(--agent-pill-text);--agent-tabular:var(--agent-pill-text);--agent-flash:var(--agent-pill-text);--agent-pill-bg:#2a1f3d;--agent-pill-text:#c4a5ff;--subprocess:var(--neutral-solid);--subprocess-bg:rgba(80,90,101,.1);--subprocess-text:var(--text-dim);--conditional:var(--orange)}
/* ── SHARED EDGE / CARD DESIGN TOKENS ──────────────────────────────────────
   One spec for every flow visualization (Stage Map, Swimlanes, Task Map) so the
   SAME logical edge or card looks identical across tabs. Color semantics:
     sequence/stage handoff = accent blue (solid)
     task-to-task           = neutral grey (dashed 4 3)
     linked workflow        = purple    (dashed 5 3)
     data flow              = green      (dashed 2 3)
   Widths/opacities are unified here; views reference these vars instead of
   redefining per-tab values. */
:root{
  /* Edge hierarchy — BOTH stage-flow and task-flow read as "important" (the task line
     no longer fades): stage = blue, solid, heaviest; task = grey, full opacity, near-
     solid with a subtle 6 2 dash that still signals "within-stage"; linked = purple
     dash; data = green fine dash. Distinction is color + dash, not visibility. */
  --edge-seq:var(--accent); --edge-seq-w:2.4; --edge-seq-op:1; --edge-seq-dash:none;
  --edge-task:var(--neutral-solid); --edge-task-w:2; --edge-task-op:.95; --edge-task-dash:6 2;
  --edge-linked:var(--agent-pill-text); --edge-linked-w:2; --edge-linked-op:.9; --edge-linked-dash:5 3;
  --edge-df:var(--green); --edge-df-w:1.7; --edge-df-op:.85; --edge-df-dash:2 3;
  --card-radius:var(--radius-sm); --card-accent-w:3px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* HEADER */
#app-header{display:flex;align-items:center;gap:16px;padding:0 32px;background:var(--surface);flex-shrink:0;min-height:56px}
.header-logo{flex-shrink:0;border-radius:4px}
.header-logo.ops-logo{border-radius:0}
:root[data-theme="dark"] .header-logo{mix-blend-mode:lighten}
#app-header h1{font-size:18px;font-weight:600;letter-spacing:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.theme-switch-cell{margin-left:auto;flex-shrink:0}
.view-toggle{display:flex;gap:2px;background:var(--neutral-soft);border:1px solid var(--border);border-radius:var(--radius-md);padding:3px;overflow:hidden;flex-shrink:0}
.view-btn{padding:7px 20px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-dim);transition:all .2s;border-radius:6px}
.view-btn:hover{color:var(--text);background:var(--surface)}
.view-btn.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-1)}
/* SEARCH BAR */
#search-bar{display:flex;align-items:center;gap:16px;padding:6px 32px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.search-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;color:var(--text);font-size:12px;min-width:120px;outline:none;transition:border .2s,box-shadow .2s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--primary-soft)}
.search-input::placeholder{color:var(--text-placeholder)}

/* CLICKABLE BREAKDOWN FILTERS */
.sf-ctx-stat.filterable{cursor:pointer;border-radius:var(--radius-sm);transition:all .15s}
.sf-ctx-stat.filterable:hover{background:var(--primary-soft)}
.sf-ctx-stat.filterable.active{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--accent)}
.sf-ctx-stat.filterable.dimmed{opacity:.35}
.sf-filter-clear{font-size:12px;color:var(--red);cursor:pointer;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;transition:all .15s;margin-top:6px;display:none}
.sf-filter-clear:hover{background:var(--danger-soft);border-color:var(--danger-border)}
.sf-filter-clear.vis{display:inline-block}

/* SIMPLE VIEW LEGEND */
.sv-legend{position:absolute;bottom:16px;left:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;font-size:12px;z-index:10;box-shadow:var(--shadow-2);max-width:220px;max-height:calc(100% - 80px);overflow-y:auto}
.sv-legend h4{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sv-legend-item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.sv-legend-item:hover{background:var(--primary-soft)}
.sv-legend-item.active{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--accent)}
.sv-legend-item.dimmed{opacity:.35}
.sv-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sv-legend-clear{font-size:11px;color:var(--red);cursor:pointer;margin-top:6px;padding:3px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;display:none;transition:all .15s}
.sv-legend-clear:hover{background:var(--danger-soft);border-color:var(--danger-border)}
.sv-legend-clear.vis{display:inline-block}

/* VIEW MODES */
.view-mode{flex:1;display:none;overflow:hidden;position:relative;opacity:0;transition:opacity .2s}
.view-mode.active{display:flex;flex-direction:column;opacity:1}

/* SIMPLE VIEW */
#tp-map .graph-toolbar{display:flex;align-items:center;gap:10px;padding:8px 30px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#tp-map .graph-toolbar button{font-size:12px;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);transition:all .15s;font-weight:400}
#tp-map .graph-toolbar button:hover{color:var(--accent);border-color:var(--accent)}
.fbtn{font-size:12px;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);transition:all .15s;font-weight:400}.fbtn:hover{color:var(--accent);border-color:var(--accent)}
.graph-note{font-size:12px;color:var(--text-dim);margin-left:auto}
#tp-map.tab-panel.active{display:flex;flex-direction:column;min-height:0}
#simple-svg{flex:1;width:100%;height:100%;min-height:0;background:var(--bg);cursor:grab;display:block}
#simple-svg:active{cursor:grabbing}
#simple-svg .node rect,#simple-svg .node polygon{transition:opacity .2s}
#simple-svg .node{cursor:pointer}
#simple-svg .edgePath path{fill:none;stroke:var(--border);stroke-width:1.5}
#simple-svg .edgeLabel text{fill:var(--text-dim);font-size:12px}
#simple-svg .cluster rect{fill:var(--subprocess-bg);stroke:var(--subprocess);stroke-dasharray:4;rx:10}
#simple-svg .cluster text{fill:var(--subprocess-text);font-size:12px}

/* DETAILED VIEW */
.tabs-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;gap:0;overflow-x:auto;flex-shrink:0;flex-wrap:nowrap}
.dtab{padding:10px 20px;cursor:pointer;font-size:12px;font-weight:400;color:var(--text-dim);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;letter-spacing:0;display:inline-flex;align-items:center;gap:6px}
.dtab:hover{color:var(--text);background:var(--neutral-soft)}
.dtab.active{color:var(--accent);border-bottom-color:var(--accent);background:transparent;font-weight:600}
.dtab .tab-count{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9999px;background:var(--neutral-soft);color:var(--text-dim);line-height:1.3}
.dtab.active .tab-count{background:var(--primary-soft);color:var(--primary-text-muted)}
.tab-count-active{display:none}
.dtab.active .tab-count-active{display:inline}
.tab-panel{flex:1;overflow-y:auto;display:none;padding:20px 32px;opacity:0;transition:opacity .15s}
.tab-panel.active{display:flex;flex-direction:column;opacity:1}

/* STAGE FLOW */
.sticky-bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;box-shadow:none}
.sticky-bar button{font-size:12px;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);transition:all .15s;font-weight:400}
.sticky-bar button:hover{color:var(--accent);border-color:var(--accent)}
.stage-block{margin-bottom:4px}
.stage-hdr{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:12px;box-shadow:none}
.stage-hdr:hover{border-color:var(--neutral-solid)}
.stage-hdr.open{border-radius:var(--radius-sm) var(--radius-sm) 0 0;border-bottom:1px dashed var(--border)}
.stage-hdr.cond{border-left:4px solid var(--warning-border)}
.stage-num{background:var(--neutral-solid,#6b7280);color:#fff;font-weight:600;font-size:12px;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stage-num.cond{background:var(--orange)}
.stage-num.child{background:var(--agent-pill-text)}
.stage-info{flex:1}
.stage-nm{font-weight:600;font-size:14px}
.stage-cond-text{font-size:12px;color:var(--warning-text-muted);margin-top:2px}
.stage-meta{font-size:12px;color:var(--text-dim);white-space:nowrap;margin-left:auto;flex-shrink:0}
.expand-i{color:var(--text-placeholder);font-size:10px;transition:transform .2s;flex-shrink:0}
.expand-i.open{transform:rotate(90deg)}
.stage-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:14px 16px;display:none}
.stage-body.open{display:block}
.arrow-dn{text-align:center;padding:4px 0;color:var(--text-dim);font-size:16px}

/* PROCESS CANVAS + CONTEXT PANEL */
.sf-layout{display:flex;flex:1;overflow:hidden;min-height:0}
.sf-canvas{flex:0 0 62.5%;overflow-y:auto;overflow-x:hidden;padding:20px 24px;border-right:1px solid var(--border)}
.sf-context{flex:0 0 37.5%;overflow-y:auto;padding:20px 24px;background:var(--bg)}
.sf-breadcrumb{display:flex;align-items:center;gap:6px;padding:8px 0;margin-bottom:12px;font-size:12px;color:var(--text-dim)}
.sf-bc-link{color:var(--accent);cursor:pointer}.sf-bc-link:hover{text-decoration:underline}
.sf-bc-sep{color:var(--text-dim)}
.sf-trace-bar{position:sticky;top:0;z-index:10;background:var(--primary-soft);border:1px solid var(--primary-border);border-radius:var(--radius-sm);padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-size:12px;box-shadow:none}
.sf-trace-bar strong{color:var(--primary-text-muted)}
.sf-trace-close{cursor:pointer;color:var(--text-dim);font-size:20px;margin-left:auto;line-height:1}.sf-trace-close:hover{color:var(--text)}
/* Process tab — Regrello "Stages" list look: solid-border cards, gray header
   strip with stage name + "Starts ..." condition on the right, flat task rows. */
.sf-stage-box{border:1px solid var(--neutral-border);border-radius:var(--radius-sm);margin-bottom:0;overflow:hidden;transition:opacity .2s;box-shadow:none;background:var(--surface)}
.sf-stage-box.dimmed{opacity:.25}
.sf-stage-box-hdr{display:flex;align-items:baseline;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--neutral-border)}
.sf-stage-badge{display:none}
.sf-stage-label{font-weight:600;font-size:14px;flex:1;letter-spacing:0;color:var(--text);line-height:1.3}
.sf-stage-trigger{font-size:12px;color:var(--text-dim);white-space:nowrap;flex-shrink:0;text-align:right}
.sf-stage-trigger .sf-trig-strong{color:var(--text);font-weight:500}
.sf-stage-cond{font-size:12px;color:var(--accent);white-space:nowrap;flex-shrink:0;text-align:right;cursor:help}
.sf-stage-body{padding:0;background:transparent}
.sf-arrow-down{text-align:center;padding:0;color:transparent;font-size:0;position:relative;height:20px;user-select:none}
.sf-arrow-down::before{content:'';position:absolute;left:30px;top:0;bottom:0;border-left:1px dashed var(--neutral-border)}
.sf-gate-box{border:1px solid var(--neutral-border);border-radius:var(--radius-sm);overflow:hidden;transition:opacity .2s;background:var(--surface);box-shadow:none}
.sf-gate-box.dimmed{opacity:.25}
.sf-gate-box .sf-stage-box-hdr{border-bottom:none}
.sf-gate-box .sf-stage-badge{display:none}
.sf-gate-box-name{font-weight:600;font-size:14px;color:var(--text)}
.sf-gate-box-msg{color:var(--text-dim);font-size:12px;padding:12px 16px}
.sf-child-invoke{border:2px dashed var(--agent-pill-text)!important;cursor:pointer;transition:all .15s}
.sf-child-invoke:hover{border-color:var(--agent-pill-text)!important;background:color-mix(in srgb,var(--agent-pill-text) 6%,transparent)}
.sf-child-badge{font-size:12px;background:var(--agent-pill-bg);color:var(--agent-pill-text);padding:2px 8px;border-radius:var(--radius-sm);margin-left:8px}
.sf-child-cols{display:grid;grid-template-columns:1fr 1px 1fr;gap:0;margin:8px 14px 10px;font-size:12px}
.sf-child-col{padding:0 10px}
.sf-child-col:first-child{padding-left:0}
.sf-child-col:last-child{padding-right:0}
.sf-child-div{background:var(--border)}
.sf-child-col-hd{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sf-child-col-hd.inp{color:var(--warning-text-muted)}
.sf-child-col-hd.out{color:var(--green)}
.sf-child-col-item{padding:2px 0;color:var(--text)}
.sf-child-glow{box-shadow:0 0 12px color-mix(in srgb,var(--agent-pill-text) 40%,transparent)}
.sf-field-link{cursor:pointer;transition:all .15s}.sf-field-link:hover{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--accent)}
.sf-field-link.traced{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 40%,transparent);font-weight:600;outline:2px solid var(--accent);outline-offset:1px}
.sf-field-link.dimfield{opacity:.4}
.sf-ctx-section{margin-bottom:22px}
.sf-ctx-section h3{font-size:15px;font-weight:600;margin:0 0 8px;letter-spacing:0;color:var(--text)}
.sf-ctx-section h4{font-size:11px;color:var(--text-dim);margin:14px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sf-ctx-stat{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--neutral-border);font-size:14px;border-radius:0}
.sf-ctx-stat:hover{background:var(--neutral-soft)}
.sf-ctx-stat strong{color:var(--accent);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.sf-ctx-tag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:9999px;margin:2px;background:var(--surface);border:1px solid var(--border);font-weight:400}
.sf-ctx-tag.prod{background:var(--success-soft);border-color:var(--success-border);color:var(--success-text-muted)}
.sf-ctx-tag.cons{background:color-mix(in srgb,var(--primary-text-muted) 8%,transparent);border-color:color-mix(in srgb,var(--primary-text-muted) 25%,transparent);color:var(--primary-text-muted)}
.sf-ctx-journey{font-size:12px;color:var(--text-dim);padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);line-height:1.5;box-shadow:none}
/* Right-panel SUBTABS (Overview / Data / Documents / Forms) — mirrors the main .dtab underline look */
.sf-subtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-20px -24px 16px;padding:0 24px;position:sticky;top:-20px;background:var(--bg);z-index:2}
.sf-subtab{padding:11px 12px;font-size:12px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.sf-subtab:hover{color:var(--text)}
.sf-subtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.sf-subtab .sf-subtab-count{font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:var(--neutral-soft);color:var(--text-dim);line-height:1.3}
.sf-subtab.active .sf-subtab-count{background:var(--primary-soft);color:var(--primary-text-muted)}
.sf-scope-banner{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--primary-soft);border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:14px;color:var(--text)}
.sf-scope-banner .sf-scope-id{font-weight:600;color:var(--accent)}
.sf-scope-banner .sf-scope-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
.sf-scope-x{cursor:pointer;color:var(--text-dim);font-size:15px;line-height:1;flex-shrink:0;padding:0 2px}
.sf-scope-x:hover{color:var(--text)}
/* Data subtab — field list + selected-field detail */
.sf-fld-list{display:flex;flex-direction:column}
.sf-fld-row{display:flex;align-items:center;gap:7px;font-size:12px;padding:7px 6px;border-bottom:1px solid var(--neutral-border);cursor:pointer;border-radius:var(--radius-sm)}
.sf-fld-row:hover{background:var(--neutral-soft)}
.sf-fld-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:500}
.sf-fld-type{color:var(--text-dim);font-size:11px;flex-shrink:0}
.sf-fld-meta{display:flex;gap:6px;flex-shrink:0;font-size:11px;font-variant-numeric:tabular-nums}
.sf-fld-prod{color:var(--success-text-muted)}
.sf-fld-cons{color:var(--primary-text-muted)}
.sf-fld-back{font-size:12px;color:var(--accent);cursor:pointer;margin-bottom:12px;display:inline-block}
.sf-fld-back:hover{text-decoration:underline}
.sf-fld-detail-name{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.sf-fld-detail-type{font-size:12px;color:var(--text-dim);margin-top:2px}
.sf-io-none{font-size:12px;color:var(--text-dim)}
.sf-doc-row{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 0;color:var(--text)}
.sf-doc-row .sf-doc-owner{color:var(--text-dim);font-size:11px;margin-left:auto;padding-left:8px;flex-shrink:0}
.sf-ctx-empty{font-size:12px;color:var(--text-dim);padding:24px 4px;text-align:center}
.sf-form-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sf-form-chip{font-size:12px;padding:5px 11px;border-radius:9999px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .15s}
.sf-form-chip:hover{border-color:var(--accent);color:var(--text)}
.sf-form-chip.active{background:var(--primary-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
/* Forms reused inside the narrow right panel: stack two-col rows + drop the floating-sheet chrome */
.sf-context .fm-sheet{max-width:none;box-shadow:none}
.sf-context .form-fields-row.two-col{flex-direction:column;gap:0}
.sf-context .form-field-spacer{display:none}

/* TASK ROWS — flat rows inside a stage card (Regrello "Stages" list look) */
.tcard{background:transparent;border:none;border-top:1px solid var(--neutral-border);border-radius:0;margin-bottom:0;overflow:hidden;transition:opacity .2s}
.tcard:first-child{border-top:none}
.tcard.dimmed{opacity:.25}
.tcard-head{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-left:none}
.tcard-head:hover{background:var(--neutral-soft)}
.tcard.open-row>.tcard-head{background:var(--neutral-soft)}
/* status circle (left), mirrors the real app's task status dot */
.sf-status-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--neutral-solid);flex-shrink:0;background:var(--surface)}
.tid{font-size:12px;font-weight:600;color:var(--primary-text-muted);background:transparent;padding:0;border-radius:0;min-width:auto;flex-shrink:0;font-variant-numeric:tabular-nums}
.tname{font-weight:600;font-size:14px;flex:1;color:var(--text);min-width:0}
/* right-side metadata: agent pill + "Starts.../Time to complete" + I/O hint */
.sf-task-right{display:flex;align-items:center;gap:14px;flex-shrink:0;margin-left:auto}
.sf-task-meta{font-size:12px;color:var(--text-dim);text-align:right;line-height:1.4;white-space:nowrap}
.sf-task-meta .sf-meta-strong{color:var(--text);font-weight:500}
.sf-io-hint{font-size:11px;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sf-io-hint .sf-io-in{color:var(--warning-text-muted);font-weight:600}
.sf-io-hint .sf-io-out{color:var(--green);font-weight:600}
.abadge{font-size:12px;padding:3px 10px 3px 6px;border-radius:9999px;white-space:nowrap;font-weight:400;letter-spacing:0;text-transform:none;background:var(--agent-pill-bg);border:none;display:inline-flex;align-items:center;gap:4px;color:var(--agent-pill-text)}

.tcard .abadge{font-size:11px;padding:2px 7px 2px 4px;gap:3px}
.tcard .abadge::before{width:14px;height:14px;-webkit-mask-size:10px 10px;mask-size:10px 10px}
.tdetail{display:none;padding:0}
.tdetail.open{display:block;background:var(--bg);border-radius:0;border-top:1px solid var(--neutral-border);padding:12px 16px 14px 42px}
.dep-chain{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:12px}
.dep-chain span{padding:2px 8px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:3px}
.dep-in{background:color-mix(in srgb,var(--primary-text-muted) 8%,transparent);color:var(--primary-text-muted);border:1px solid color-mix(in srgb,var(--primary-text-muted) 18%,transparent)}
.dep-out{background:color-mix(in srgb,var(--green) 8%,transparent);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 18%,transparent)}
.io-lbl{font-size:12px;font-weight:600;margin:8px 0 4px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
.io-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.io-lbl.inp{color:var(--warning-text-muted)}
.io-lbl.out{color:var(--green)}
.io-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.io-tag{font-size:12px;padding:3px 8px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:4px;font-weight:400}
.io-tag.inp{background:color-mix(in srgb,var(--warning-text-muted) 8%,transparent);border:1px solid color-mix(in srgb,var(--warning-text-muted) 20%,transparent);color:var(--text)}
.io-tag.out{background:color-mix(in srgb,var(--green) 6%,transparent);border:1px solid color-mix(in srgb,var(--green) 15%,transparent);color:var(--text)}
.io-tag .ft{color:var(--text-dim);font-size:12px}
.ft-icon{display:inline-block;width:16px;height:14px;position:relative;vertical-align:-2px;flex-shrink:0;background:none!important;border:none!important;padding:0;color:var(--text-dim);border-radius:0}
.ft-icon::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:13px;height:13px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.io-tag .src{color:var(--warning-text-muted);font-size:12px;font-weight:600}
.req-ast{color:var(--danger-text-muted);font-weight:600;font-size:14px;line-height:1}

/* CROSS-BP BANNER */
.xbp-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:20px;margin-bottom:20px;box-shadow:none}
.xbp-col{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;box-shadow:none}
.xbp-col h4{font-size:12px;margin-bottom:8px;font-weight:600;color:var(--text-dim)}
.xbp-arrow{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-dim)}
.xbp-arrow .arr{font-size:28px}
.xbp-arrow .lbl{font-size:12px;text-align:center;font-weight:600}
.xbp-field{font-size:12px;padding:4px 10px;border-radius:9999px;margin:3px 0;display:block;font-weight:400}
.xbp-field.pass{background:var(--primary-soft);color:var(--primary-text-muted);border:1px solid var(--primary-border)}
.xbp-field.ret{background:var(--success-soft);color:var(--success-text-muted);border:1px solid var(--success-border)}
.xbp-btn{display:inline-block;margin-top:10px;padding:6px 14px;font-size:12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);color:var(--text-dim);background:var(--surface);transition:all .15s;font-weight:400}
.xbp-btn:hover{border-color:var(--accent);color:var(--accent)}

/* FIELD REGISTRY TABLE */
.ftable{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;table-layout:fixed}
.ftable th{text-align:left;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-dim);position:sticky;top:0;z-index:2;font-weight:600;white-space:nowrap;overflow:hidden;position:relative}
.ftable th .pt-resize{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;background:transparent;transition:background .15s}
.ftable th .pt-resize:hover,.ftable th .pt-resize.active{background:var(--accent);opacity:.5}
.ftable th.sortable{cursor:pointer;user-select:none}.ftable th.sortable:hover{color:var(--text)}
.ftable th .sort-arrow{font-size:10px;margin-left:3px;color:var(--text-placeholder)}.ftable th.sort-active .sort-arrow{color:var(--accent)}
.fr-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ftable td{padding:5px 12px;border-bottom:1px solid var(--border);vertical-align:middle;height:32px}
.ftable tr:hover td{background:var(--neutral-soft)}
.ftable tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.ftbadge{font-size:12px;padding:2px 8px 2px 22px;border-radius:var(--radius-sm);white-space:nowrap;font-weight:400;letter-spacing:0;position:relative;display:inline-flex;align-items:center}
.ftbadge::before{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);width:13px;height:13px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.ft-doc{background:var(--neutral-soft);color:var(--text-dim);border:none}
