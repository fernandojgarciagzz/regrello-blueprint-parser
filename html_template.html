.heat-bar{width:60px;height:4px;background:var(--border);border-radius:9999px;display:inline-block;vertical-align:middle}
.heat-fill{height:100%;border-radius:9999px}
.flink{color:var(--primary-text-muted);cursor:pointer;font-size:12px;font-weight:600}
.flink:hover{text-decoration:underline;color:var(--accent)}

/* EDGE TABLE */
.egroup{margin-bottom:8px}
.egroup-hdr{padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;transition:all .15s;box-shadow:none}
.egroup-hdr:hover{border-color:var(--neutral-solid)}
.egroup-hdr.open{border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.egroup-body{display:none;border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);overflow:hidden;background:var(--surface)}
.egroup-body.open{display:block}
.erow{display:grid;grid-template-columns:30px 1fr 1fr auto;gap:8px;padding:8px 16px;font-size:12px;border-bottom:1px solid var(--border);align-items:center}
.erow:last-child{border-bottom:none}
.erow .earr{color:var(--text-dim)}
.erow .etgt{color:var(--green)}
.erow .eid{color:var(--text-dim);font-size:12px}

/* VISUAL GRAPH TAB */
#tp-vgraph{overflow:auto}
#vgraph-svg{width:100%;min-height:600px;background:var(--bg);cursor:grab;border:1px solid var(--border);border-radius:var(--radius-md)}
#vgraph-svg:active{cursor:grabbing}
#vgraph-svg .node rect{transition:opacity .2s}
#vgraph-svg .node{cursor:pointer}
#vgraph-svg .edgePath path{fill:none;stroke:var(--border);stroke-width:1}
#vgraph-svg .cluster rect{rx:8}
.vg-legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--text);flex-wrap:wrap;padding:6px 12px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.vg-legend-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
.vg-legend-line{width:28px;height:0;border-top:2.5px solid var(--accent)}
.vg-legend-line.task{border-color:var(--text-dim);border-width:1.5px}
.vg-legend-line.data{border-color:var(--green);border-width:1.5px}
.vg-legend-line.child{border-style:dashed;border-color:var(--agent-pill-text);border-width:2px}
.vg-df-toggle{font-size:12px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer;transition:all .15s}
.vg-df-toggle.active{background:var(--green);color:#fff;border-color:var(--green)}

/* SIDE PANEL */
#side-panel{position:fixed;top:0;right:0;width:380px;height:100vh;background:var(--surface);border-left:none;z-index:100;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;box-shadow:var(--shadow-4)}
#side-panel.open{transform:translateX(0)}
.sp-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface)}
.sp-hdr strong{color:var(--text);font-size:14px;font-weight:600;letter-spacing:0}
.sp-close{font-size:0;cursor:pointer;color:var(--text-dim);margin-left:auto;line-height:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);transition:all .15s;background-color:transparent}
.sp-close::before{content:'';width:14px;height:14px;background:var(--text-dim);-webkit-mask-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2014%2014%27%20fill%3D%27currentColor%27%3E%3Cpath%20d%3D%27M14%201.41L12.59%200L7%205.59L1.41%200L0%201.41L5.59%207L0%2012.59L1.41%2014L7%208.41L12.59%2014L14%2012.59L8.41%207L14%201.41Z%27%2F%3E%3C%2Fsvg%3E");mask-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2014%2014%27%20fill%3D%27currentColor%27%3E%3Cpath%20d%3D%27M14%201.41L12.59%200L7%205.59L1.41%200L0%201.41L5.59%207L0%2012.59L1.41%2014L7%208.41L12.59%2014L14%2012.59L8.41%207L14%201.41Z%27%2F%3E%3C%2Fsvg%3E");-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.sp-close:hover{background:var(--danger-soft)}
.sp-close:hover::before{background:var(--danger-text-muted)}
.sp-body{padding:20px 24px}
.sp-section{margin-bottom:14px}
.sp-section h4{font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600}
.sp-pill{display:inline-block;font-size:12px;padding:3px 12px;border-radius:9999px;margin:2px;font-weight:400;background:var(--neutral-soft);border:1px solid var(--neutral-border);color:var(--text)}
.sp-pill.cond{background:var(--warning-soft);color:var(--warning-text-muted);border:1px solid var(--warning-border)}
.sp-link{color:var(--primary-text-muted);cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-weight:600}
.sp-link:hover{text-decoration:underline;color:var(--accent)}
.sp-tcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;transition:all .15s}
.sp-tcard:hover{border-color:var(--neutral-solid);box-shadow:var(--shadow-1)}
.sp-tcard-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sp-tcard-head .abadge{font-size:11px;padding:2px 7px 2px 4px;gap:3px}
.sp-tcard-head .abadge::before{width:14px;height:14px;-webkit-mask-size:10px 10px;mask-size:10px 10px}
.sp-tcard-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3}
.sp-tcard-desc{font-size:11px;color:var(--text-dim);line-height:1.4;margin-bottom:4px}
.sp-tcard-meta{font-size:11px;color:var(--text-dim);margin-bottom:2px}
.sp-tcard-deps{font-size:11px;color:var(--text-dim);margin-top:4px}
.sp-tcard-deps span{display:block;padding:1px 0}
.sp-tcard-docs{font-size:11px;color:var(--accent);margin-top:4px}
.sp-tcard-docs span{display:block;padding:1px 0}

/* TOOLTIP */
#tooltip{position:fixed;background:var(--tooltip-bg);border:none;border-radius:var(--radius-sm);padding:4px 8px;font-size:12px;line-height:16px;color:var(--tooltip-text);pointer-events:none;z-index:200;max-width:280px;opacity:0;transition:opacity .15s;box-shadow:var(--shadow-3)}

/* FIELD MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(var(--shadow-rgb),.55);backdrop-filter:blur(4px);z-index:150;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.modal-overlay.open{display:flex;opacity:1}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:24px;max-width:520px;width:90%;max-height:70vh;overflow-y:auto;box-shadow:var(--shadow-3)}
.modal-close{float:right;font-size:0;cursor:pointer;color:var(--text-dim);line-height:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);transition:all .15s;background-color:transparent}
.modal-close::before{content:'';width:14px;height:14px;background:var(--text-dim);-webkit-mask-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2014%2014%27%20fill%3D%27currentColor%27%3E%3Cpath%20d%3D%27M14%201.41L12.59%200L7%205.59L1.41%200L0%201.41L5.59%207L0%2012.59L1.41%2014L7%208.41L12.59%2014L14%2012.59L8.41%207L14%201.41Z%27%2F%3E%3C%2Fsvg%3E");mask-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2014%2014%27%20fill%3D%27currentColor%27%3E%3Cpath%20d%3D%27M14%201.41L12.59%200L7%205.59L1.41%200L0%201.41L5.59%207L0%2012.59L1.41%2014L7%208.41L12.59%2014L14%2012.59L8.41%207L14%201.41Z%27%2F%3E%3C%2Fsvg%3E");-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.modal-close:hover{background:var(--danger-soft)}
.modal-close:hover::before{background:var(--danger-text-muted)}

/* MISC */
.table-wrap{overflow-x:auto;max-height:calc(100vh - 260px);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:none;background:var(--surface)}
a.jump{color:var(--accent);cursor:pointer;text-decoration:none;font-size:12px}
a.jump:hover{text-decoration:underline}

/* CUSTOM SIMPLE VIEW SVG */
#simple-svg .sn-rect{cursor:pointer;transition:opacity .2s,stroke-width .15s,stroke .15s;fill:var(--surface)!important;stroke:var(--border)!important;stroke-width:1.5}
#simple-svg .stage-node:hover .sn-rect{stroke:var(--accent)!important;stroke-width:2}
#simple-svg .sn-stripe{pointer-events:none}
#simple-svg .sn-label{font-size:12px;font-weight:600;fill:var(--text);pointer-events:none}
#simple-svg .sn-sub{font-size:12px;fill:var(--text-dim);pointer-events:none}
#simple-svg .agent-dot{display:none}
#simple-svg .seq-arrow{fill:none;stroke:var(--border);stroke-width:1.5}
#simple-svg .gw-diamond{fill:color-mix(in srgb,var(--conditional) 12%,transparent);stroke:var(--conditional);stroke-width:1.5}
#simple-svg .child-rect{fill:color-mix(in srgb,var(--agent-pill-text) 6%,transparent);stroke:var(--agent-pill-text);stroke-dasharray:6 3;cursor:pointer}
#simple-svg .child-label{font-size:12px;fill:var(--agent-pill-text);font-weight:600}
#simple-svg .cross-edge{stroke:var(--agent-pill-text);stroke-width:2.5;fill:none}
#simple-svg .join-bar{stroke:var(--border);stroke-width:1.5;fill:none}
.flow-toggle{font-size:12px;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);transition:all .15s;font-weight:400}
.flow-toggle:hover{color:var(--accent);border-color:var(--accent)}
.theme-switch{position:relative;width:44px;height:24px;border-radius:12px;background:var(--neutral-soft);border:1px solid var(--border);cursor:pointer;flex-shrink:0;transition:background .3s,border-color .3s;padding:0}
.theme-switch::before{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-dim);transition:transform .3s,background .3s}
.theme-switch .ts-icon{position:absolute;top:3px;width:16px;height:16px;transition:opacity .2s}
.theme-switch .ts-moon{left:4px;opacity:0}
.theme-switch .ts-sun{right:4px;opacity:1}
.theme-switch .ts-icon svg{width:16px;height:16px;fill:var(--text-dim)}
.theme-switch .ts-moon svg{fill:var(--text-dim)}
.theme-switch.dark{background:var(--surface2);border-color:var(--border)}
.theme-switch.dark::before{transform:translateX(20px);background:var(--primary-text-muted)}
.theme-switch.dark .ts-sun{opacity:0}
.theme-switch.dark .ts-moon{opacity:1}
.theme-switch:hover{border-color:var(--accent)}
.task-chip{display:inline-block;font-size:12px;padding:1px 6px;border-radius:3px;margin:1px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;color:var(--text);transition:all .15s}
.task-chip:hover{border-color:var(--accent);color:var(--accent)}
.flow-toggle.active{border-color:var(--accent);color:var(--accent);background:var(--primary-soft);font-weight:600}
/* AGENT PROMPTS TAB */
#tp-prompts{padding-top:0}
.prompt-toolbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:0}
.prompt-toolbar-row2{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px}
.prompt-search{min-width:180px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;outline:none;transition:border .2s,box-shadow .2s}
.prompt-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--primary-soft)}
.prompt-search::placeholder{color:var(--text-placeholder)}
.prompt-filter-sel{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;outline:none;cursor:pointer;font-weight:400;transition:all .15s}
.prompt-filter-sel:hover{border-color:var(--accent)}
.prompt-stats{color:var(--text-dim);font-size:12px;margin-left:auto;font-weight:400}
.pt-export-btn{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:12px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-weight:400}
.pt-export-btn:hover{border-color:var(--accent);color:var(--accent)}
.pt-export-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Multi-select dropdown */
.ms-wrap{position:relative;display:inline-block}
.ms-btn{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:400;box-shadow:none}
.ms-btn:hover,.ms-btn.open{border-color:var(--accent)}
.ms-btn .ms-count{background:var(--primary-soft);color:var(--primary-text-muted);font-size:12px;padding:1px 6px;border-radius:var(--radius-sm);font-weight:600}
.ms-btn::after{content:'\25BC';font-size:8px;color:var(--text-dim);margin-left:2px}
.ms-btn.ms-inline::after{display:none}
.ms-panel{display:none;position:absolute;top:100%;left:0;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-3);min-width:240px;max-height:280px;overflow-y:auto;z-index:20;padding:6px 0}
.ms-panel.open{display:block}
.ms-panel.ms-fixed{position:fixed}
.ms-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:var(--text);transition:background .1s}
.ms-item:hover{background:var(--primary-soft)}
.ms-item input{accent-color:var(--accent);margin:0;cursor:pointer}
.ms-item label{cursor:pointer;flex:1}
.ms-divider{border-top:1px solid var(--border);margin:4px 0}
.ms-actions{display:flex;gap:4px;padding:6px 10px;border-top:1px solid var(--border)}
.ms-actions button{flex:1;padding:5px 0;border:none;background:none;color:var(--primary-text-muted);font-size:12px;cursor:pointer;border-radius:9999px;font-weight:600;transition:background .15s}
.ms-actions button:hover{background:var(--primary-soft)}
/* Prompt table (full view) */
.pt-table-wrap{overflow:auto;max-height:calc(100vh - 200px)}
.pt{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.pt thead th{position:sticky;top:0;z-index:5;background:var(--surface2);text-align:left;padding:8px 12px;color:var(--text-dim);font-weight:600;font-size:12px;border-bottom:1px solid var(--border)}
.pt tbody td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.pt tbody tr:hover{background:var(--neutral-soft)}
.pt tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.pt-col-id{white-space:nowrap;font-weight:600;font-size:12px;color:var(--text-dim);width:54px}
.pt-col-name{font-weight:400;color:var(--text);width:160px;font-size:12px}
.pt-col-stage{color:var(--text-dim);font-size:12px;width:120px}
.pt-col-agent{width:130px}
.pt-col-fields{font-size:12px;width:120px;vertical-align:top}
.pt-field-item{display:flex;align-items:center;gap:4px;padding:1px 0;color:var(--text);line-height:1.4}
.pt-field-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-field-empty{color:var(--text-placeholder)}
.pt-col-prompt{color:var(--text)}
.pt-col-actions{width:32px;text-align:center}
.pt-copy-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);transition:all .15s;flex-shrink:0;box-shadow:none}
.pt-copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.pt-copy-btn.copied{border-color:var(--success-border);color:var(--success-text-muted);background:var(--success-soft)}
.pt-copy-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prompt-text{font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.7;word-wrap:break-word;color:var(--text);margin:0}
.prompt-text p{margin:0 0 8px 0}.prompt-text p:last-child{margin-bottom:0}
.prompt-text ul,.prompt-text ol{margin:4px 0 8px 0;padding-left:24px}.prompt-text li{margin:2px 0}
.prompt-text code{background:var(--neutral-soft);padding:2px 7px;border-radius:var(--radius-sm);font-family:'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;border:1px solid var(--neutral-border)}
.prompt-text strong{font-weight:600}
.field-mention{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);padding:1px 5px;border-radius:var(--radius-sm);font-weight:400;font-size:12px;border:none}
.prompt-conditional{font-style:italic;color:var(--warning-text-muted);margin:8px 0 4px 0;padding:6px 12px;border-left:3px solid var(--warning-border);background:var(--warning-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:12px;border:1px solid var(--warning-border);border-left-width:3px}
.prompt-empty{font-size:12px;font-style:italic;color:var(--text-placeholder);padding:0}
.dr-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;color:var(--text);margin-top:4px}
.dr-table th{text-align:left;padding:5px 10px;color:var(--text-dim);border-bottom:1px solid var(--border);font-weight:600;font-size:12px}
.dr-table td{padding:4px 10px;border-bottom:1px solid var(--border);height:32px}
.dr-table td:first-child{font-weight:600}
.dr-table tr:hover td{background:var(--neutral-soft)}
.dr-form-label{color:var(--text);font-weight:600;font-size:12px;margin-bottom:8px}
.task-chip{display:inline-block;padding:2px 8px;border-radius:var(--radius-sm);font-size:12px;margin:1px 2px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);white-space:nowrap;transition:all .15s;font-weight:400;line-height:1.35}
.task-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--primary-soft)}
/* Full Process toggle */
.fp-toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text-dim);user-select:none;flex-shrink:0}
.fp-toggle input{display:none}
.fp-slider{position:relative;width:44px;height:24px;border-radius:12px;background:var(--neutral-soft);border:1px solid var(--border);transition:all .2s}
.fp-slider::before{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-dim);transition:transform .2s,background .2s}
.fp-toggle input:checked+.fp-slider{background:var(--primary-soft);border-color:var(--primary-border)}
.fp-toggle input:checked+.fp-slider::before{transform:translateX(20px);background:var(--accent)}
/* Child blueprint container */
.fp-child-container{border:2px dashed var(--agent-pill-text);border-radius:var(--radius-md,12px);padding:16px;margin:4px 0;background:color-mix(in srgb,var(--agent-pill-text) 3%,transparent);position:relative}
.fp-child-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--agent-pill-text) 20%,transparent)}
.fp-child-header .fp-child-title{font-size:13px;font-weight:600;color:var(--agent-pill-text)}
.fp-child-header .fp-child-badge{font-size:11px;background:var(--agent-pill-bg);color:var(--agent-pill-text);padding:2px 8px;border-radius:var(--radius-sm);font-weight:600}
.fp-child-io{display:grid;grid-template-columns:1fr 1px 1fr;gap:0;padding:10px 12px;background:var(--surface);border:1px solid color-mix(in srgb,var(--agent-pill-text) 15%,transparent);border-radius:var(--radius-sm);font-size:12px}
.fp-child-io-col{padding:0 10px}.fp-child-io-col:first-child{padding-left:0}.fp-child-io-col:last-child{padding-right:0}
.fp-child-io-div{background:color-mix(in srgb,var(--agent-pill-text) 20%,transparent)}
.fp-child-io-hd{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.fp-child-io-hd.inp{color:var(--warning-text-muted)}.fp-child-io-hd.out{color:var(--green)}
.fp-child-io-item{padding:2px 0;color:var(--text)}
.fp-child-stages{padding:4px 0}
.sf-stage-box.child-stage{border-color:var(--agent-pill-text)!important;border-style:dashed!important}
.sf-stage-box.child-stage .sf-stage-badge{background:var(--agent-pill-text)!important}
.sf-gate-box.child-stage{border-color:var(--agent-pill-text)!important;border-style:dashed!important}
.ftable tr.child-row td:first-child{box-shadow:inset 3px 0 0 var(--agent-pill-text)}
.pt tbody tr.child-row td:first-child{box-shadow:inset 3px 0 0 var(--agent-pill-text)}
</style>
</head>
<body>

<!-- HEADER -->
<div id="app-header">
  {{HEADER_HTML}}
</div>
<!-- SEARCH BAR -->
<div id="search-bar">
  <label id="fp-toggle-wrap" class="fp-toggle" style="display:none"><input type="checkbox" id="fp-toggle" onchange="toggleFullProcess()"><span class="fp-slider"></span><span>Full Process</span></label>
  <input class="search-input" id="searchBox" placeholder="Search tasks, fields, agents..." oninput="onFilterChange()">
</div>

<!-- SIMPLE VIEW -->
<div id="simple-view" class="view-mode">
  <div class="graph-toolbar">
    <button onclick="fitGraph()">Fit to Screen</button>
    <button onclick="resetZoom()">Reset Zoom</button>
    <button class="flow-toggle active" id="btn-seq" onclick="toggleSeqArrows()">Process Flow</button>
    <button id="btn-back-parent" style="display:none;background:var(--subprocess-bg);border-color:var(--subprocess);color:var(--subprocess-text)" onclick="simpleBackToParent()">&larr; Back to Parent</button>
    <span class="graph-note" id="graph-note">{{GRAPH_NOTE}}</span>
  </div>
  <svg id="simple-svg"><defs><marker id="arr-seq" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dde1e6"/></marker><marker id="arr-cross" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><g id="simple-g"></g></svg>
  <div class="sv-legend" id="sv-legend"></div>
</div>

<!-- DETAILED VIEW -->
<div id="detailed-view" class="view-mode active">
  <div class="tabs-bar">
    <div class="dtab active" data-tab="stageflow" onclick="switchTab('stageflow')">Process Flow</div>
    <div class="dtab" data-tab="fields" onclick="switchTab('fields')">Field Registry <span class="tab-count" id="tc-fields"></span></div>
    <div class="dtab" data-tab="prompts" onclick="switchTab('prompts')">Agent Prompts <span class="tab-count" id="tc-agents"></span></div>
    <div class="dtab" data-tab="vgraph" onclick="switchTab('vgraph')">Visual Graph</div>
  </div>
  <div class="tab-panel active" data-tab="stageflow" id="tp-stageflow"></div>
  <div class="tab-panel" data-tab="fields" id="tp-fields"></div>
  <div class="tab-panel" data-tab="prompts" id="tp-prompts"></div>
  <div class="tab-panel" data-tab="vgraph" id="tp-vgraph"></div>
</div>

<!-- SIDE PANEL -->
<div id="side-panel">
  <div class="sp-hdr"><strong id="sp-title"></strong><span class="sp-close" onclick="closeSP()">&times;</span></div>
  <div class="sp-body" id="sp-body"></div>
</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- FIELD MODAL -->
<div class="modal-overlay" id="field-modal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ==============================================================
// DATA MODEL (generated by rex_parser.py)
// ==============================================================

{{DATA_SECTION}}

// ==============================================================
// FILTER STATE (shared across all views)
// ==============================================================
const FS={search:'',agents:new Set};
function isTaskVis(t){
  var q=FS.search.toLowerCase();
  if(q){
    var parts=[t.id,t.name,t.agent,t.agentClass];
    t.inputs.forEach(function(i){parts.push(i.n,i.t)});
    t.outputs.forEach(function(o){parts.push(o.n,o.t)});
    var p=taskPrompts[t.id];if(p)parts.push(p.replace(/<[^>]*>/g,''));
    var blob=parts.join(' ').toLowerCase();
    var words=q.split(/\s+/).filter(function(w){return w.length>0});
    var ms=words.every(function(w){return blob.includes(w)});
  }else{var ms=true}
  var ma=FS.agents.size===0||FS.agents.has(t.agent);
  return ms&&ma;
}
function stageHasVisTasks(s){
  if(!s.tasks.length)return true;
  return s.tasks.some(isTaskVis);
}
function dominantAgent(s){
  var c={};s.tasks.forEach(t=>{c[t.agentClass]=(c[t.agentClass]||0)+1});
  var best='ai',max=0;for(var k in c)if(c[k]>max){max=c[k];best=k}return best;
}

function onFilterChange(){
  var box=document.getElementById('searchBox');
  if(box)FS.search=box.value;
  applyAllFilters();
}
function toggleAgentFilter(name){
  if(FS.agents.has(name))FS.agents.delete(name);
  else FS.agents.add(name);
  applyAllFilters();
  refreshCtxFilters();
  updateFilterUI();
}
function clearFilters(){
  FS.search='';FS.agents.clear();
  var box=document.getElementById('searchBox');if(box)box.value='';
  applyAllFilters();
  refreshCtxFilters();
  updateFilterUI();
}
function refreshCtxFilters(){
  if(curView!=='detailed'||curTab!=='stageflow')return;
  if(!sfTraceField&&!sfExpandedTaskId){
    renderContextPanel();
  }
}
function updateFilterUI(){
  var hasF=FS.agents.size>0;
  document.querySelectorAll('.sf-ctx-stat.filterable').forEach(function(el){
    var an=el.dataset.agentname;
    if(!an)return;
    if(!hasF){el.classList.remove('active','dimmed')}
    else if(FS.agents.has(an)){el.classList.add('active');el.classList.remove('dimmed')}
    else{el.classList.add('dimmed');el.classList.remove('active')}
  });
  document.querySelectorAll('.sf-filter-clear').forEach(function(b){b.classList.toggle('vis',hasF)});
  document.querySelectorAll('.sv-legend-item').forEach(function(el){
    var an=el.dataset.agentname;
    if(!an)return;
    if(!hasF){el.classList.remove('active','dimmed')}
    else if(FS.agents.has(an)){el.classList.add('active');el.classList.remove('dimmed')}
    else{el.classList.add('dimmed');el.classList.remove('active')}
  });
  document.querySelectorAll('.sv-legend-clear').forEach(function(b){b.classList.toggle('vis',hasF)});
}
function applyAllFilters(){
  if(curView==='simple')updateSimpleFilters();
  else applyDetailedFilters();
}

// ==============================================================
// VIEW / TAB SWITCHING
// ==============================================================
var curView='detailed',curTab='stageflow';
var sfViewingChild=false,sfViewingChildIdx=0,sfExpandedTaskId=null,sfTraceField=null,sfTracedTaskIds=new Set();
var fullProcess=false;
function activeChildStages(){return sfViewingChild&&childBlueprints[sfViewingChildIdx]?childBlueprints[sfViewingChildIdx].stages:[]}
function allStagesList(){return fullProcess?stages.concat(childStages):(sfViewingChild?activeChildStages():stages)}
function toggleFullProcess(){
  fullProcess=document.getElementById('fp-toggle').checked;
  renderedTabs={};
  if(curView==='simple'){window._simpleRendered=false;renderSimpleView()}
  else{renderTab(curTab)}
  applyAllFilters();
}
var renderedTabs={};
function switchView(v){
  curView=v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  var sv=document.getElementById('simple-view'),dv=document.getElementById('detailed-view');
  sv.classList.toggle('active',v==='simple');dv.classList.toggle('active',v==='detailed');
  if(v==='simple'){if(!window._simpleRendered)renderSimpleView()}
  else{renderTab(curTab)}
  applyAllFilters();
}
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.dtab').forEach(d=>d.classList.toggle('active',d.dataset.tab===t));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.dataset.tab===t));
  renderTab(t);
  applyAllFilters();
}
function renderTab(t){
  if(renderedTabs[t])return;
  renderedTabs[t]=true;
  switch(t){
    case'stageflow':renderStageFlow();break;
    case'fields':renderFieldReg();break;
    case'prompts':renderPrompts();break;
    case'vgraph':renderVisualGraph();break;
  }
}

// ==============================================================
// SIMPLE VIEW (Custom SVG layout engine)
// ==============================================================
var simpleZoom,showSeq=true,simpleShowingChild=false;
function reduceEdges(edges){
  var adj={};
  edges.forEach(function(e){if(!adj[e[0]])adj[e[0]]=new Set();adj[e[0]].add(String(e[1]))});
  return edges.filter(function(e){
    var src=e[0],tgt=String(e[1]),visited=new Set(),queue=[];
    (adj[src]||new Set()).forEach(function(n){if(n!==tgt){visited.add(n);queue.push(n)}});
    while(queue.length){var cur=queue.shift();if(cur===tgt)return false;
      (adj[cur]||new Set()).forEach(function(n){if(!visited.has(n)){visited.add(n);queue.push(n)}});}
    return true;
  });
}
function renderSimpleView(){
  window._simpleRendered=true;
  simpleShowingChild=false;
  if(fullProcess&&childBlueprints.length){
    renderFullProcessGraph();
  }else{
    renderSimpleGraph(stages,stageFlow,stageEdgeMap,false);
  }
  buildSvLegend();
}
function renderFullProcessGraph(){
  var svg=d3.select('#simple-svg'),g=svg.select('#simple-g');
  g.selectAll('*').remove();
  var tip=d3.select('#tooltip');
  document.getElementById('btn-back-parent').style.display='none';

  var NW=260,NH=64,CNW=220,CNH=52;
  var CLUSTER_GAP=40,CHILD_HGAP=24;
  var CL_PAD_TOP=28,CL_PAD_BOT=14,CL_PAD_LR=16;

  function nid(id){return('s'+id).replace(/\./g,'-')}

  // === Build parent→child mapping from parent stages ===
  var linkedChildIdxs={};
  var childToParentStage={};
  stages.forEach(function(s){s.tasks.forEach(function(t){
    if(t._isChildLink&&t._childIdx!=null){
      linkedChildIdxs[t._childIdx]=true;
      if(childToParentStage[t._childIdx]==null)childToParentStage[t._childIdx]=s.id;
    }
  })});
  var parentChildMap={};
  Object.keys(childToParentStage).forEach(function(ci){
    var sid=childToParentStage[ci];
    if(!parentChildMap[sid])parentChildMap[sid]=[];
    parentChildMap[sid].push(+ci);
  });

  // === Recursive layout: compute layout + total bounding box for a child blueprint ===
  // Returns: {localW, localH, clusterW, clusterH, totalW, totalH, nodes, edges,
  //           subClusters:[{ci, offX, offY, layout}], stageChildMap:{stageId:[ci,...]}}
  var allClLayouts={};
  function layoutChildBp(ci){
    if(allClLayouts[ci])return allClLayouts[ci];
    var cb=childBlueprints[ci];
    if(!cb||!cb.stages.length){allClLayouts[ci]=null;return null}

    // Build stage→child mapping within this child blueprint
    var stageChildMap={};
    cb.stages.forEach(function(s){s.tasks.forEach(function(t){
      if(t._isChildLink&&t._childIdx!=null){
        if(!stageChildMap[s.id])stageChildMap[s.id]=[];
        if(stageChildMap[s.id].indexOf(t._childIdx)<0)stageChildMap[s.id].push(t._childIdx);
      }
    })});

    // Recursively layout grandchildren first
    var gcLayouts={};
    Object.keys(stageChildMap).forEach(function(sid){
      stageChildMap[sid].forEach(function(gci){
        gcLayouts[gci]=layoutChildBp(gci);
      });
    });

    // Compute inflated widths for child stages that have grandchildren
    var stageWidths={};
    cb.stages.forEach(function(s){
      var gcs=stageChildMap[s.id];
      if(!gcs||!gcs.length){stageWidths[s.id]=CNW;return}
      var tw=0,valid=gcs.filter(function(gci){return!!gcLayouts[gci]});
      valid.forEach(function(gci){tw+=gcLayouts[gci].totalW});
      tw+=(valid.length-1)*CHILD_HGAP;
      stageWidths[s.id]=Math.max(CNW,tw);
    });

    // Dagre layout for this child's stages
    var cdg=new dagreD3.graphlib.Graph()
      .setGraph({rankdir:'TB',ranksep:28,nodesep:24,marginx:12,marginy:12})
      .setDefaultEdgeLabel(function(){return{}});
    cb.stages.forEach(function(cs){cdg.setNode(nid(cs.id),{width:stageWidths[cs.id],height:CNH})});
    var crf=reduceEdges(cb.flow);
    crf.forEach(function(e){cdg.setEdge(nid(e[0]),nid(e[1]))});
    dagreD3.dagre.layout(cdg);

    var localW=cdg.graph().width||(CNW+24);
    var localH=cdg.graph().height||(CNH+24);
    var nodes={};
    cb.stages.forEach(function(cs){
      var cnd=cdg.node(nid(cs.id));
      nodes[cs.id]={lx:cnd.x,ly:cnd.y};
    });
    var edges=[];
    cdg.edges().forEach(function(e){
      var edge=cdg.edge(e);
      if(edge&&edge.points)edges.push({points:edge.points.map(function(p){return{x:p.x,y:p.y}})});
    });

    // Position grandchild clusters below their parent stages (within local coords)
    var subClusters=[];
    var maxGcBottom=localH;
    Object.keys(stageChildMap).forEach(function(sid){
      var gcs=stageChildMap[sid].filter(function(gci){return!!gcLayouts[gci]});
      if(!gcs.length)return;
      var tw=0;
      gcs.forEach(function(gci){tw+=gcLayouts[gci].totalW});
      tw+=(gcs.length-1)*CHILD_HGAP;
      var sn=nodes[sid];if(!sn)return;
      var startX=sn.lx-tw/2;
      gcs.forEach(function(gci){
        var gcl=gcLayouts[gci];
        var offX=startX+gcl.totalW/2;
        var offY=sn.ly+CNH/2+CLUSTER_GAP+gcl.totalH/2;
        subClusters.push({ci:gci,offX:offX,offY:offY,layout:gcl});
        var bottom=offY+gcl.totalH/2;
        if(bottom>maxGcBottom)maxGcBottom=bottom;
        startX+=gcl.totalW+CHILD_HGAP;
      });
    });

    // Shift local stages down if needed (add vertical space per rank for grandchildren)
    var rankMap2={};
    cb.stages.forEach(function(s){
      var ly=Math.round(nodes[s.id].ly);
      if(!rankMap2[ly])rankMap2[ly]=[];
      rankMap2[ly].push(s.id);
    });
    var rankYs2=Object.keys(rankMap2).map(Number).sort(function(a,b){return a-b});
    var cumShift2=0;
    rankYs2.forEach(function(ry){
      var maxH=0;
      rankMap2[ry].forEach(function(sid){
        var gcs=(stageChildMap[sid]||[]).filter(function(gci){return!!gcLayouts[gci]});
        gcs.forEach(function(gci){
          var h=gcLayouts[gci].totalH+CLUSTER_GAP;
          if(h>maxH)maxH=h;
        });
      });
      rankMap2[ry].forEach(function(sid){nodes[sid].ly+=cumShift2});
      if(maxH>0)cumShift2+=maxH;
    });
    // Re-position sub-clusters after shift
    subClusters=[];
    Object.keys(stageChildMap).forEach(function(sid){
      var gcs=stageChildMap[sid].filter(function(gci){return!!gcLayouts[gci]});
      if(!gcs.length)return;
      var tw=0;
      gcs.forEach(function(gci){tw+=gcLayouts[gci].totalW});
      tw+=(gcs.length-1)*CHILD_HGAP;
      var sn=nodes[sid];if(!sn)return;
      var startX=sn.lx-tw/2;
      gcs.forEach(function(gci){
        var gcl=gcLayouts[gci];
        subClusters.push({ci:gci,offX:startX+gcl.totalW/2,offY:sn.ly+CNH/2+CLUSTER_GAP+gcl.totalH/2,layout:gcl});
        startX+=gcl.totalW+CHILD_HGAP;
      });
    });

    // Compute total bounding box (local stages + grandchild sub-clusters)
    var totalW=localW,totalH=0;
    cb.stages.forEach(function(s){
      var ly=nodes[s.id].ly;
      totalH=Math.max(totalH,ly+CNH/2);
    });
    subClusters.forEach(function(sc){
      var r=sc.offX+sc.layout.totalW/2;
      var b=sc.offY+sc.layout.totalH/2;
      if(r>totalW)totalW=r;
      if(b>totalH)totalH=b;
    });
    // Also recompute edge points after shift
    edges=[];
    cdg.edges().forEach(function(e){
      var edge=cdg.edge(e);
      if(!edge||!edge.points)return;
      // We can't reuse dagre points after shift; recompute from node positions
    });
    // Simpler: just store edge src/tgt IDs and draw from node positions later
    var edgePairs=[];
    cdg.edges().forEach(function(e){edgePairs.push([e.v,e.w])});

    var clW=totalW+CL_PAD_LR*2;
    var clH=totalH+CL_PAD_TOP+CL_PAD_BOT;
    allClLayouts[ci]={localW:localW,localH:localH,
      clusterW:clW,clusterH:clH,totalW:clW,totalH:clH,
      nodes:nodes,edgePairs:edgePairs,subClusters:subClusters,
      stageChildMap:stageChildMap};
    return allClLayouts[ci];
  }

  // Layout all linked children (recursively)
  Object.keys(linkedChildIdxs).forEach(function(ci){layoutChildBp(+ci)});

  // Count all stages recursively
  var totalChildStages=0;
  function countStages(ci){
    var cb=childBlueprints[ci];if(!cb)return;
    totalChildStages+=cb.stages.length;
    var cl=allClLayouts[ci];if(!cl)return;
    cl.subClusters.forEach(function(sc){countStages(sc.ci)});
  }
  Object.keys(linkedChildIdxs).forEach(function(ci){countStages(+ci)});
  document.getElementById('graph-note').textContent='Full Process: '+stages.length+' parent + '+totalChildStages+' child stages';

  // === Compute parent node widths (inflated to fit children below) ===
  var parentNodeW={};
  stages.forEach(function(s){
    var children=parentChildMap[s.id];
    if(!children||!children.length){parentNodeW[s.id]=NW;return}
    var tw=0,valid=children.filter(function(ci){return!!allClLayouts[ci]});
    valid.forEach(function(ci){tw+=allClLayouts[ci].totalW});
    tw+=(valid.length-1)*CHILD_HGAP;
    parentNodeW[s.id]=Math.max(NW,tw);
  });

  // === PARENT DAGRE LAYOUT (using inflated widths) ===
  var pdg=new dagreD3.graphlib.Graph()
    .setGraph({rankdir:'TB',ranksep:36,nodesep:30,marginx:20,marginy:40})
    .setDefaultEdgeLabel(function(){return{}});
  stages.forEach(function(s){pdg.setNode(nid(s.id),{width:parentNodeW[s.id],height:NH})});
  var rpEdges=reduceEdges(stageFlow);
  rpEdges.forEach(function(e){pdg.setEdge(nid(e[0]),nid(e[1]))});
  dagreD3.dagre.layout(pdg);

  var parentPos={};
  stages.forEach(function(s){
    var nd=pdg.node(nid(s.id));
    parentPos[s.id]={x:nd.x,y:nd.y};
  });

  // === Shift parent ranks down to make room for child clusters ===
  var rankMap={};
  stages.forEach(function(s){
    var y=Math.round(parentPos[s.id].y);
    if(!rankMap[y])rankMap[y]=[];
    rankMap[y].push(s.id);
  });
  var rankYs=Object.keys(rankMap).map(Number).sort(function(a,b){return a-b});
  var cumShift=0;
  rankYs.forEach(function(ry){
    var maxH=0;
    rankMap[ry].forEach(function(sid){
      if(!parentChildMap[sid])return;
      parentChildMap[sid].forEach(function(ci){
        if(allClLayouts[ci]&&allClLayouts[ci].totalH>maxH)maxH=allClLayouts[ci].totalH;
      });
    });
    rankMap[ry].forEach(function(sid){parentPos[sid].y+=cumShift});
    if(maxH>0)cumShift+=maxH+CLUSTER_GAP;
  });

  // === Position top-level child clusters below parents ===
  var clusterAbsPos={};
  function positionCluster(ci,cx,cy){
    var cl=allClLayouts[ci];if(!cl)return;
    clusterAbsPos[ci]={x:cx,y:cy,w:cl.clusterW,h:cl.clusterH};
    cl.subClusters.forEach(function(sc){
      var ax=cx-cl.clusterW/2+CL_PAD_LR+sc.offX;
      var ay=cy-cl.clusterH/2+CL_PAD_TOP+sc.offY;
      positionCluster(sc.ci,ax,ay);
    });
  }
  Object.keys(parentChildMap).forEach(function(sid){
    var children=parentChildMap[sid];
    var valid=children.filter(function(ci){return!!allClLayouts[ci]});
    if(!valid.length)return;
    var tw=0;valid.forEach(function(ci){tw+=allClLayouts[ci].totalW});
    tw+=(valid.length-1)*CHILD_HGAP;
    var px=parentPos[sid].x,py=parentPos[sid].y;
    var startX=px-tw/2;
    valid.forEach(function(ci){
      var cl=allClLayouts[ci];
      positionCluster(ci,startX+cl.totalW/2,py+NH/2+CLUSTER_GAP+cl.totalH/2);
      startX+=cl.totalW+CHILD_HGAP;
    });
  });

  // === Compute total graph dimensions ===
  var W=0,H=0;
  stages.forEach(function(s){
    var p=parentPos[s.id];
    W=Math.max(W,p.x+NW/2+40);H=Math.max(H,p.y+NH/2+40);
  });
  Object.keys(clusterAbsPos).forEach(function(ci){
    var c=clusterAbsPos[ci];
    W=Math.max(W,c.x+c.w/2+40);H=Math.max(H,c.y+c.h/2+40);
  });

  // === RENDER Layer 1: Cluster containers ===
  var clg=g.append('g').attr('class','cluster-g');
  Object.keys(clusterAbsPos).forEach(function(ci){
    var cp=clusterAbsPos[ci],cb=childBlueprints[ci];
    var cx=cp.x-cp.w/2,cy=cp.y-cp.h/2;
    var cg2=clg.append('g').attr('transform','translate('+cx+','+cy+')');
    cg2.append('rect').attr('width',cp.w).attr('height',cp.h).attr('rx',10).attr('ry',10)
      .attr('fill','color-mix(in srgb,'+cssVar('--agent-pill-text')+' 4%,transparent)')
      .attr('stroke',cssVar('--agent-pill-text')).attr('stroke-width',2);
    var maxCh=Math.floor((cp.w-24)/7);
    var cLabel=cb.name.length>maxCh?cb.name.substring(0,maxCh-1)+'…':cb.name;
    cg2.append('text').attr('x',12).attr('y',18).attr('font-size','11px')
      .attr('font-weight',600).attr('fill',cssVar('--agent-pill-text')).text(cLabel);
  });

  // === RENDER Layer 2: Edges ===
  var ag=g.append('g').attr('class','seq-g');
  function drawBezier(x1,y1,x2,y2,cls,marker){
    var midY=(y1+y2)/2;
    var p=ag.append('path').attr('d','M'+x1+','+y1+' C'+x1+','+midY+' '+x2+','+midY+' '+x2+','+y2);
    if(cls)p.attr('class',cls);
    else p.attr('fill','none').attr('stroke',cssVar('--border')).attr('stroke-width',1.5);
    p.attr('marker-end','url(#'+(marker||'arr-seq')+')');
  }

  // Parent flow edges
  rpEdges.forEach(function(e){
    var src=parentPos[e[0]],tgt=parentPos[e[1]];
    if(src&&tgt)drawBezier(src.x,src.y+NH/2,tgt.x,tgt.y-NH/2);
  });

  // Recursive: draw child internal edges + cross-edges
  function drawClusterEdges(ci){
    var cp=clusterAbsPos[ci],cl=allClLayouts[ci],cb=childBlueprints[ci];
    if(!cp||!cl)return;
    var offX=cp.x-cp.w/2+CL_PAD_LR,offY=cp.y-cp.h/2+CL_PAD_TOP;
    // Internal flow edges (use stored node positions)
    cl.edgePairs.forEach(function(pair){
      var sn=null,tn=null;
      cb.stages.forEach(function(s){
        if(nid(s.id)===pair[0])sn=cl.nodes[s.id];
        if(nid(s.id)===pair[1])tn=cl.nodes[s.id];
      });
      if(sn&&tn)drawBezier(offX+sn.lx,offY+sn.ly+CNH/2,offX+tn.lx,offY+tn.ly-CNH/2);
    });
    // Cross-edges to grandchildren
    cl.subClusters.forEach(function(sc){
      var gcBp=childBlueprints[sc.ci],gcp=clusterAbsPos[sc.ci],gcl=allClLayouts[sc.ci];
      if(!gcp||!gcl||!gcBp.stages.length)return;
      // Find parent stage within this child that links to grandchild
      Object.keys(cl.stageChildMap).forEach(function(sid){
        if(cl.stageChildMap[sid].indexOf(sc.ci)<0)return;
        var sn=cl.nodes[sid];if(!sn)return;
        var firstGc=gcBp.stages[0];
        var gcNode=gcl.nodes[firstGc.id];if(!gcNode)return;
        var gcOff={x:gcp.x-gcp.w/2+CL_PAD_LR,y:gcp.y-gcp.h/2+CL_PAD_TOP};
        drawBezier(offX+sn.lx,offY+sn.ly+CNH/2,gcOff.x+gcNode.lx,gcOff.y+gcNode.ly-CNH/2,'cross-edge','arr-cross');
      });
      drawClusterEdges(sc.ci);
    });
  }

  // Cross-edges from parent stages to top-level children
  Object.keys(childToParentStage).forEach(function(ci){
    var sid=childToParentStage[ci],cp=clusterAbsPos[ci],cl=allClLayouts[ci];
    if(!cp||!cl)return;
    var cb=childBlueprints[ci];if(!cb.stages.length)return;
    var firstNode=cl.nodes[cb.stages[0].id];if(!firstNode)return;
    var offX=cp.x-cp.w/2+CL_PAD_LR,offY=cp.y-cp.h/2+CL_PAD_TOP;
    drawBezier(parentPos[sid].x,parentPos[sid].y+NH/2,offX+firstNode.lx,offY+firstNode.ly-CNH/2,'cross-edge','arr-cross');
    drawClusterEdges(+ci);
  });

  // === RENDER Layer 3: Parent stage nodes ===
  var ng=g.append('g');
  stages.forEach(function(s){
    var p=parentPos[s.id],px=p.x-NW/2,py=p.y-NH/2;
    var dom=dominantAgent(s),col=cm(dom);
    var sg=ng.append('g').attr('class','stage-node').attr('data-sid',s.id)
      .attr('transform','translate('+px+','+py+')').style('cursor','pointer');
    sg.append('rect').attr('class','sn-rect').attr('width',NW).attr('height',NH)
      .attr('rx',8).attr('ry',8).attr('fill',col+'15').attr('stroke',col).attr('stroke-width',1.5);
    if(s.condition)sg.append('rect').attr('class','sn-stripe').attr('width',5).attr('height',NH).attr('fill',cssVar('--conditional')).attr('rx',2);
    var ac={};s.tasks.forEach(function(t){ac[t.agentClass]=true});
    Object.keys(ac).forEach(function(a,i){sg.append('circle').attr('class','agent-dot').attr('cx',NW-12-i*14).attr('cy',12).attr('r',5).attr('fill',cm(a))});
    var padX=s.condition?14:10;
    var lbl='S'+s.id+': '+s.name,maxCh=Math.floor((NW-padX-8)/7);
    if(lbl.length>maxCh)lbl=lbl.substring(0,maxCh-1)+'…';
    sg.append('text').attr('class','sn-label').attr('x',padX).attr('y',NH/2-4).text(lbl);
    sg.append('text').attr('class','sn-sub').attr('x',padX).attr('y',NH/2+12)
      .text(s.tasks.length?s.tasks.length+' task'+(s.tasks.length>1?'s':''):'Gate');
    if(s.condition){
      var gwg=ng.append('g').attr('transform','translate('+(px-20)+','+(p.y)+')');
      gwg.append('polygon').attr('class','gw-diamond').attr('points','0,-9 9,0 0,9 -9,0');
      gwg.append('title').text('IF: '+s.condition);
    }
    sg.on('click',function(){highlightSimple(s.id);openStageSP(s)});
    sg.on('mouseover',function(){
      if(!s.condition)return;
      tip.html('<strong>Condition:</strong><br>'+s.condition)
        .style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px').style('opacity',1);
    }).on('mousemove',function(){tip.style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px')})
    .on('mouseout',function(){tip.style('opacity',0)});
  });

  // === RENDER Layer 4: Child stage nodes (recursive) ===
  function drawClusterNodes(ci){
    var cp=clusterAbsPos[ci],cl=allClLayouts[ci],cb=childBlueprints[ci];
    if(!cp||!cl)return;
    var offX=cp.x-cp.w/2+CL_PAD_LR,offY=cp.y-cp.h/2+CL_PAD_TOP;
    cb.stages.forEach(function(s){
      var ln=cl.nodes[s.id];if(!ln)return;
      var gx=offX+ln.lx-CNW/2,gy=offY+ln.ly-CNH/2;
      var dom=dominantAgent(s),col=cm(dom);
      var sg=ng.append('g').attr('class','stage-node').attr('data-sid',s.id)
        .attr('transform','translate('+gx+','+gy+')').style('cursor','pointer');
      sg.append('rect').attr('class','sn-rect').attr('width',CNW).attr('height',CNH)
        .attr('rx',8).attr('ry',8).attr('fill',col+'15')
        .attr('stroke',cssVar('--agent-pill-text')).attr('stroke-width',1.5).attr('stroke-dasharray','6 3');
      if(s.condition)sg.append('rect').attr('class','sn-stripe').attr('width',4).attr('height',CNH).attr('fill',cssVar('--conditional')).attr('rx',2);
      var padX=s.condition?12:8;
      var lbl=s.id+': '+s.name,maxCh=Math.floor((CNW-padX-6)/6.5);
      if(lbl.length>maxCh)lbl=lbl.substring(0,maxCh-1)+'…';
      sg.append('text').attr('class','sn-label').attr('x',padX).attr('y',CNH/2-3).attr('font-size','11px').text(lbl);
      sg.append('text').attr('class','sn-sub').attr('x',padX).attr('y',CNH/2+10).attr('font-size','10px')
        .text(s.tasks.length?s.tasks.length+' task'+(s.tasks.length>1?'s':''):'Gate');
      sg.on('click',function(){highlightSimple(s.id);openStageSP(s)});
      sg.on('mouseover',function(){
        if(!s.condition)return;
        tip.html('<strong>Condition:</strong><br>'+s.condition)
          .style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px').style('opacity',1);
      }).on('mousemove',function(){tip.style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px')})
      .on('mouseout',function(){tip.style('opacity',0)});
    });
    cl.subClusters.forEach(function(sc){drawClusterNodes(sc.ci)});
  }
  Object.keys(linkedChildIdxs).forEach(function(ci){drawClusterNodes(+ci)});

  simpleZoom=d3.zoom().scaleExtent([.03,3]).on('zoom',function(){g.attr('transform',d3.event.transform)});
  svg.call(simpleZoom);
  window._sLayout={_W:W,_H:H};
  fitGraph();
}
function renderSimpleChildView(childIdx){
  clearFilters();
  simpleShowingChild=true;
  var ci=childIdx||0;
  var cb=childBlueprints[ci];if(!cb)return;
  var cStages=cb.stages, cFlow=cb.flow;
  var cEdgeMap={};
  cStages.forEach(function(cs){cs.tasks.forEach(function(t){
    t.inputs.forEach(function(inp){
      var srcTask=null;
      cStages.forEach(function(cs2){cs2.tasks.forEach(function(t2){
        t2.outputs.forEach(function(o){if(o.n===inp.n&&t2.id!==t.id)srcTask={tid:t2.id,sid:cs2.id}});
      })});
      if(srcTask){
        var k=srcTask.sid+'->'+cs.id;
        if(srcTask.sid!==cs.id){
          if(!cEdgeMap[k])cEdgeMap[k]={from:srcTask.sid,to:cs.id,fields:new Set};
          cEdgeMap[k].fields.add(inp.n);
        }
      }
    });
  })});
  renderSimpleGraph(cStages,cFlow,cEdgeMap,true);
  buildSvLegend();
}
function simpleBackToParent(){
  clearFilters();
  simpleShowingChild=false;
  renderSimpleGraph(stages,stageFlow,stageEdgeMap,false);
  buildSvLegend();
  document.getElementById('btn-back-parent').style.display='none';
  var note=document.getElementById('graph-note');
  note.textContent=stages.length+' stages | Click stage for details';
  closeSP();
}
function renderSimpleGraph(sList,flowEdges,edgeMap,isChild){
  var svg=d3.select('#simple-svg'),g=svg.select('#simple-g');
  g.selectAll('*').remove();
  var tip=d3.select('#tooltip');
  var NW=260,NH=64,GAP=28,MT=40;
  var backBtn=document.getElementById('btn-back-parent');
  var noteEl=document.getElementById('graph-note');
  if(isChild){
    backBtn.style.display='';
    noteEl.textContent='Child Blueprint \u00b7 '+sList.length+' stages | Click stage for details';
  }else{
    backBtn.style.display='none';
  }
  var reducedFlow=reduceEdges(flowEdges);
  // Use dagre for automatic stage-level layout
  // Sanitize IDs for dagre (dots are treated as hierarchy separators)
  function nid(id){return ('s'+id).replace(/\./g,'-')}
  var dg=new dagreD3.graphlib.Graph().setGraph({rankdir:'TB',ranksep:GAP,nodesep:30,marginx:20,marginy:MT}).setDefaultEdgeLabel(function(){return{}});
  sList.forEach(function(s){dg.setNode(nid(s.id),{width:NW,height:NH,label:s})});
  if(!isChild&&childBlueprints.length){
    childBlueprints.forEach(function(cb,ci){dg.setNode('child_'+ci,{width:180,height:48,_cbIdx:ci})});
  }
  reducedFlow.forEach(function(e){dg.setEdge(nid(e[0]),nid(e[1]))});
  if(!isChild&&childBlueprints.length){
    stages.forEach(function(s){s.tasks.forEach(function(t){
      if(t._isChildLink&&t._childIdx!=null)dg.setEdge(nid(s.id),'child_'+t._childIdx);
    })});
  }
  dagreD3.dagre.layout(dg);
  var W=dg.graph().width||800,H=dg.graph().height||600;
  // Draw edges (sequential arrows)
  var ag=g.append('g').attr('class','seq-g');
  dg.edges().forEach(function(e){
    var edge=dg.edge(e);
    if(!edge||!edge.points)return;
    var pts=edge.points;
    var d='M'+pts[0].x+','+pts[0].y;
    for(var i=1;i<pts.length;i++)d+=' L'+pts[i].x+','+pts[i].y;
    var isCrossEdge=e.w.indexOf('child_')===0||e.v.indexOf('child_')===0||(e.v.indexOf('sC')===0)!==(e.w.indexOf('sC')===0);
    ag.append('path').attr('d',d).attr('fill','none')
      .attr('stroke',isCrossEdge?cssVar('--agent-pill-text'):cssVar('--border'))
      .attr('stroke-width',1.5)
      .attr('stroke-dasharray',isCrossEdge?'4 3':null)
      .attr('marker-end','url(#arr-seq)');
  });
  // Draw stage nodes
  var ng=g.append('g');
  sList.forEach(function(s){
    var nd=dg.node(nid(s.id));if(!nd)return;
    var px=nd.x-nd.width/2,py=nd.y-nd.height/2;
    var dom=dominantAgent(s),col=cm(dom);
    var sg=ng.append('g').attr('class','stage-node').attr('data-sid',s.id)
      .attr('transform','translate('+px+','+py+')').style('cursor','pointer');
    var isChildNode=typeof s.id==='string'&&s.id.indexOf('C')===0;
    sg.append('rect').attr('class','sn-rect').attr('width',nd.width).attr('height',nd.height)
      .attr('rx',8).attr('ry',8).attr('fill',col+'15').attr('stroke',isChildNode?cssVar('--agent-pill-text'):col).attr('stroke-width',1.5)
      .attr('stroke-dasharray',isChildNode?'6 3':null);
    if(s.condition)sg.append('rect').attr('class','sn-stripe').attr('width',5).attr('height',nd.height).attr('fill',cssVar('--conditional')).attr('rx',2);
    var ac={};s.tasks.forEach(function(t){ac[t.agentClass]=true});
    Object.keys(ac).forEach(function(a,i){sg.append('circle').attr('class','agent-dot').attr('cx',nd.width-12-i*14).attr('cy',12).attr('r',5).attr('fill',cm(a))});
    var lbl=(isChild||isChildNode?'':'S')+s.id+': '+s.name,maxCh=Math.floor(nd.width/7.5);
    if(lbl.length>maxCh)lbl=lbl.substring(0,maxCh-1)+'\u2026';
    sg.append('text').attr('class','sn-label').attr('x',s.condition?14:10).attr('y',nd.height/2-4).text(lbl);
    sg.append('text').attr('class','sn-sub').attr('x',s.condition?14:10).attr('y',nd.height/2+12)
      .text(s.tasks.length?s.tasks.length+' task'+(s.tasks.length>1?'s':''):'Gate');
    if(s.condition){
      var gwg=ng.append('g').attr('transform','translate('+(px-20)+','+(nd.y)+')');
      gwg.append('polygon').attr('class','gw-diamond').attr('points','0,-9 9,0 0,9 -9,0');
      gwg.append('title').text('IF: '+s.condition);
    }
    sg.on('click',function(){highlightSimple(s.id);openStageSP(s)});
    sg.on('mouseover',function(){
      if(!s.condition)return;
      tip.html('<strong>Condition:</strong><br>'+s.condition)
        .style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px').style('opacity',1);
    }).on('mousemove',function(){tip.style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px')})
    .on('mouseout',function(){tip.style('opacity',0)});
  });
  // Child subprocess nodes (parent view only)
  if(!isChild&&childBlueprints.length){
    childBlueprints.forEach(function(cb,ci){
      var cnd=dg.node('child_'+ci);if(!cnd)return;
      var cpx=cnd.x-cnd.width/2,cpy=cnd.y-cnd.height/2;
      var cTasks=0;cb.stages.forEach(function(s){cTasks+=s.tasks.length});
      var cg=ng.append('g').attr('transform','translate('+cpx+','+cpy+')').style('cursor','pointer');
      cg.append('rect').attr('class','child-rect').attr('width',cnd.width).attr('height',cnd.height).attr('rx',8);
      var cLabel=cb.name.length>22?cb.name.substring(0,21)+'\u2026':cb.name;
      cg.append('text').attr('class','child-label').attr('x',cnd.width/2).attr('y',cnd.height/2-6).attr('text-anchor','middle').text(cLabel);
      cg.append('text').attr('x',cnd.width/2).attr('y',cnd.height/2+10).attr('text-anchor','middle').attr('font-size','9px').attr('fill',cssVar('--text-dim')).text(cb.stages.length+' stages \u00b7 '+cTasks+' tasks');
      cg.on('click',(function(idx){return function(){renderSimpleChildView(idx)}})(ci));
    });
  }
  // Zoom/pan
  simpleZoom=d3.zoom().scaleExtent([.1,3]).on('zoom',function(){g.attr('transform',d3.event.transform)});
  svg.call(simpleZoom);
  window._sLayout={_W:W,_H:H};
  fitGraph();
}

function highlightSimple(sid){
  var curFlow;
  if(fullProcess&&childBlueprints.length){
    curFlow=stageFlow.slice();
    function addFlowRecursive(cbList){
      cbList.forEach(function(cb){
        cb.flow.forEach(function(f){curFlow.push(f)});
        cb.stages.forEach(function(s){s.tasks.forEach(function(t){
          if(t._isChildLink&&t._childIdx!=null){
            var gc=childBlueprints[t._childIdx];
            if(gc&&gc.stages.length)curFlow.push([s.id,gc.stages[0].id]);
          }
        })});
        var gcIdxs=cb.childIdxs||[];
        var gcBps=gcIdxs.map(function(i){return childBlueprints[i]}).filter(Boolean);
        if(gcBps.length)addFlowRecursive(gcBps);
      });
    }
    addFlowRecursive(childBlueprints);
    stages.forEach(function(s){s.tasks.forEach(function(t){
      if(t._isChildLink&&t._childIdx!=null){var cb=childBlueprints[t._childIdx];if(cb&&cb.stages.length)curFlow.push([s.id,cb.stages[0].id])}
    })});
  }else if(simpleShowingChild&&childBlueprints[sfViewingChildIdx]){
    curFlow=childBlueprints[sfViewingChildIdx].flow;
  }else{curFlow=stageFlow}
  var conn=new Set;
  curFlow.forEach(function(e){if(e[0]===sid)conn.add(e[1]);if(e[1]===sid)conn.add(e[0])});
  d3.selectAll('#simple-g .stage-node').each(function(){
    var el=d3.select(this),nid=el.attr('data-sid');
    // Handle both numeric and string IDs (child stages use 'C1.1' format)
    var match=nid==sid||conn.has(nid)||conn.has(+nid);
    el.style('opacity',match||+nid===sid?1:.2);
    if(nid==sid)el.select('.sn-rect').attr('stroke-width',3);
  });
  setTimeout(function(){d3.selectAll('#simple-g .stage-node').style('opacity',1).selectAll('.sn-rect').attr('stroke-width',1.5)},3000);
}
function toggleSeqArrows(){showSeq=!showSeq;document.getElementById('btn-seq').classList.toggle('active',showSeq);d3.select('#simple-g .seq-g').style('display',showSeq?null:'none')}


function fitGraph(){
  if(!window._sLayout||!simpleZoom)return;
  var P=window._sLayout,svg=d3.select('#simple-svg');
  var sw=svg.node().getBoundingClientRect().width||800,sh=svg.node().getBoundingClientRect().height||600;
  var sc=Math.min(sw/(P._W+40),sh/(P._H+40))*.92;sc=Math.min(sc,1.2);sc=Math.max(sc,0.08);
  svg.transition().duration(400).call(simpleZoom.transform,d3.zoomIdentity.translate((sw-P._W*sc)/2,10).scale(sc));
}
function resetZoom(){if(simpleZoom)d3.select('#simple-svg').transition().duration(300).call(simpleZoom.transform,d3.zoomIdentity)}
function updateSimpleFilters(){
  if(!window._sLayout)return;
  var sList=fullProcess?stages.concat(childStages):(simpleShowingChild?childStages:stages);
  d3.selectAll('#simple-g .stage-node').each(function(){
    var el=d3.select(this),sid=el.attr('data-sid'),s=sList.find(function(st){return st.id==sid});
    el.style('opacity',s&&stageHasVisTasks(s)?1:.2);
  });
}
function buildSvLegend(){
  var el=document.getElementById('sv-legend');if(!el)return;
  var sList=fullProcess?stages.concat(childStages):(simpleShowingChild?childStages:stages);
  var agents={};
  sList.forEach(function(s){s.tasks.forEach(function(t){
    var key=t.agent;
    if(!agents[key])agents[key]={count:0,ac:t.agentClass};
    agents[key].count++;
  })});
  var h='<h4>Agents</h4>';
  Object.keys(agents).forEach(function(name){
    var a=agents[name];
    h+='<div class="sv-legend-item" data-agentname="'+escHtml(name)+'" onclick="toggleAgentFilter(\''+name.replace(/'/g,"\\'")+'\')">';
    h+='<span class="sv-legend-dot" style="background:'+cm(a.ac)+'"></span><span style="flex:1">'+escHtml(name)+'</span><span style="color:var(--text-dim)">'+a.count+'</span></div>';
  });
  h+='<button class="sv-legend-clear'+(FS.agents.size?' vis':'')+'" onclick="clearFilters()">Clear</button>';
  el.innerHTML=h;

}

function openStageSP(s){
  var h='';
  if(s.condition)h+='<div class="sp-section"><span class="sp-pill cond">IF: '+escHtml(s.condition)+'</span></div>';
  h+='<div class="sp-section"><h4>Tasks ('+s.tasks.length+')</h4>';
  s.tasks.forEach(function(t,i){
    var col=cm(t.agentClass||'ai');
    h+='<div class="sp-tcard" style="border-left:3px solid '+col+'">';
    h+='<div class="sp-tcard-head"><span class="abadge '+badgeCls(t)+'">'+t.agent+'</span>';
    if(t.ttype)h+=' <span style="font-size:10px;color:var(--text-dim)">'+t.ttype+'</span>';
    h+='</div>';
    h+='<div class="sp-tcard-name">'+escHtml(t.id+': '+t.name)+'</div>';
    if(t.desc){
      var d=t.desc.length>150?t.desc.substring(0,150)+'…':t.desc;
      h+='<div class="sp-tcard-desc">'+escHtml(d)+'</div>';
    }
    var meta=[];
    if(t.inputs.length)meta.push(t.inputs.length+' input'+(t.inputs.length>1?'s':''));
    if(t.outputs.length)meta.push(t.outputs.length+' output'+(t.outputs.length>1?'s':''));
    if(t.docs&&t.docs.length)meta.push(t.docs.length+' doc'+(t.docs.length>1?'s':''));
    if(t.dueSec){
      var sec=t.dueSec,dd=Math.floor(sec/86400),hh=Math.floor((sec%86400)/3600),mm=Math.floor((sec%3600)/60);
      var parts=[];if(dd)parts.push(dd+'d');if(hh)parts.push(hh+'h');if(mm)parts.push(mm+'m');
      meta.push(parts.join(' '));
    }
    if(meta.length)h+='<div class="sp-tcard-meta">'+meta.join(' &middot; ')+'</div>';
    if(t.deps&&t.deps.length){
      h+='<div class="sp-tcard-deps">';
      t.deps.forEach(function(d){h+='<span>Depends on: '+escHtml(d)+'</span>'});
      h+='</div>';
    }
    if(t.docs&&t.docs.length){
      h+='<div class="sp-tcard-docs">';
      t.docs.forEach(function(dn){h+='<span>&#128196; '+escHtml(dn)+'</span>'});
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';

    h+='<a class="sp-link" onclick="jumpToStage('+s.id+')">See full detail in Process Flow &rarr;</a>';
  }else{
    h+='<a class="sp-link" onclick="jumpToStage(\''+s.id+'\')">See full detail in Process Flow &rarr;</a>';
  }
  openSP('Stage '+s.id+': '+s.name,h);
}

function openTaskSP(t){
  var h='<div class="sp-section"><span class="abadge '+badgeCls(t)+'">'+t.agent+'</span>';
  if(t.ttype)h+=' <span style="font-size:11px;color:var(--text-dim);margin-left:6px">'+t.ttype+(t.itype?' / '+t.itype:'')+'</span>';

  if(t.desc){

    h+='<div style="font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap">'+escHtml(d)+'</div></div>';
  }
  if(t.docs&&t.docs.length){
    h+='<div class="sp-section"><h4>Documents ('+t.docs.length+')</h4>';
    t.docs.forEach(function(dn){h+='<div style="font-size:12px;padding:2px 0"><span style="color:var(--accent)">&#128196;</span> '+escHtml(dn)+'</div>'});
    h+='</div>';
  }
  if(t.deps&&t.deps.length){
    h+='<div class="sp-section"><h4>Dependencies</h4>';
    t.deps.forEach(function(d){h+='<div style="font-size:12px;padding:2px 0;color:var(--text-dim)">Depends on: '+escHtml(d)+'</div>'});
    h+='</div>';
  }
  if(t.dueSec){
    h+='<div class="sp-section"><h4>Time to Complete</h4><div style="font-size:12px;color:var(--text)">';
    var s=t.dueSec,dd=Math.floor(s/86400),hh=Math.floor((s%86400)/3600),mm=Math.floor((s%3600)/60);
    var parts=[];if(dd)parts.push(dd+'d');if(hh)parts.push(hh+'h');if(mm)parts.push(mm+'m');
    h+=(parts.length?parts.join(' '):'< 1m')+'</div></div>';
  }
  // Find parent stage to show its condition
  var parentStage=null;

  if(parentStage&&parentStage.condition){
    h+='<div class="sp-section"><h4>Stage Start Condition</h4>';
    h+='<div style="font-size:12px;color:var(--conditional);line-height:1.4">IF: '+escHtml(parentStage.condition)+'</div></div>';

    t.outputs.forEach(function(o){

      parentEdges.forEach(function(e){if(e.from===t.id&&e.data===o.n)consumers.push(e.to)});
      h+='<div style="font-size:12px;padding:2px 0;color:var(--green)">'+(o.req?'<span class="req-ast">*</span> ':'')+'&rarr; '+o.n+' <span style="color:var(--text-dim)">('+o.t+')</span>';

function jumpToStage(sid){
  closeSP();switchView('detailed');switchTab('stageflow');
  setTimeout(function(){
    if(sfViewingChild)sfExitChildBP();
    var box=document.querySelector('.sf-stage-box[data-sid="'+sid+'"],.sf-gate-box[data-sid="'+sid+'"]');
    if(box)box.scrollIntoView({behavior:'smooth',block:'center'});
  },200);
}
function jumpToTask(tid){
  var sid=taskToStage[tid];
  if(!sid){
    var isChild=childStages.some(function(s){return s.tasks.some(function(t){return t.id===tid})});
    if(isChild){closeSP();closeModal();switchView('detailed');switchTab('stageflow');
      if(fullProcess){
        setTimeout(function(){sfToggleTask(tid);var card=document.querySelector('#sf-canvas .tcard[data-tid="'+tid+'"]');if(card)card.scrollIntoView({behavior:'smooth',block:'center'})},200);
      }else{
        setTimeout(function(){sfEnterChildBP();setTimeout(function(){sfToggleTask(tid)},100)},200);
      }
      return;
    }
    return;
  }
  closeSP();closeModal();switchView('detailed');switchTab('stageflow');
  setTimeout(function(){
    if(sfViewingChild)sfExitChildBP();
    sfToggleTask(tid);
    var card=document.querySelector('#sf-canvas .tcard[data-tid="'+tid+'"]');
    if(card)card.scrollIntoView({behavior:'smooth',block:'center'});
  },200);
}

function sfToggleTask(taskId){
  if(sfTraceField)return;
  if(sfExpandedTaskId===taskId){
    var td=document.getElementById('sf-td-'+taskId);
    if(td){td.classList.remove('open');var ic=td.previousElementSibling.querySelector('.expand-i');if(ic)ic.classList.remove('open')}
    sfExpandedTaskId=null;
  }else{
    if(sfExpandedTaskId){
      var old=document.getElementById('sf-td-'+sfExpandedTaskId);
      if(old){old.classList.remove('open');var oi=old.previousElementSibling.querySelector('.expand-i');if(oi)oi.classList.remove('open')}
    }
    var td=document.getElementById('sf-td-'+taskId);
    if(td){td.classList.add('open');var ic=td.previousElementSibling.querySelector('.expand-i');if(ic)ic.classList.add('open')}
    sfExpandedTaskId=taskId;
  }
  renderContextPanel();
}

function sfTraceFieldClick(fieldName){
  if(sfTraceField===fieldName){sfExitTrace();return}
  sfTraceField=fieldName;
  sfTracedTaskIds.clear();
  var fi=fieldIndex[fieldName];
  if(fi){
    fi.producers.forEach(function(p){sfTracedTaskIds.add(p.taskId)});
    fi.consumers.forEach(function(c){sfTracedTaskIds.add(c.taskId)});
  }
  // If field has no connections, find all tasks that have it as input or output
  if(!sfTracedTaskIds.size){
    var allStages=allStagesList();
    allStages.forEach(function(s){s.tasks.forEach(function(t){
      var has=false;
      t.inputs.forEach(function(i){if(i.n===fieldName)has=true});
      t.outputs.forEach(function(o){if(o.n===fieldName)has=true});
      if(has)sfTracedTaskIds.add(t.id);
    })});
  }
  renderProcessCanvas();renderContextPanel();
}

function sfExitTrace(){
  sfTraceField=null;sfTracedTaskIds.clear();sfExpandedTaskId=null;
  renderProcessCanvas();renderContextPanel();
}

function applyTraceHighlights(){
  document.querySelectorAll('#sf-canvas .tcard').forEach(function(c){
    var tid=c.dataset.tid;
    if(sfTracedTaskIds.has(tid)){
      c.classList.remove('dimmed');
      var td=c.querySelector('.tdetail');if(td)td.classList.add('open');
      var ic=c.querySelector('.expand-i');if(ic)ic.classList.add('open');
      c.querySelectorAll('.sf-field-link').forEach(function(fl){
        var fn=fl.dataset.field||'';
        if(fn===sfTraceField){fl.classList.add('traced');fl.classList.remove('dimfield')}
        else{fl.classList.add('dimfield');fl.classList.remove('traced')}
      });
    }else{
      c.classList.add('dimmed');
      var td=c.querySelector('.tdetail');if(td)td.classList.remove('open');
      var ic=c.querySelector('.expand-i');if(ic)ic.classList.remove('open');
    }
  });
  document.querySelectorAll('#sf-canvas .sf-stage-box').forEach(function(box){
    var hasTr=false;
    box.querySelectorAll('.tcard').forEach(function(c){if(sfTracedTaskIds.has(c.dataset.tid))hasTr=true});
    box.classList.toggle('dimmed',!hasTr);
  });
  document.querySelectorAll('#sf-canvas .sf-gate-box').forEach(function(g){g.classList.add('dimmed')});
  document.querySelectorAll('.fp-child-container').forEach(function(ct){
    var anyTr=false;
    ct.querySelectorAll('.tcard').forEach(function(c){if(sfTracedTaskIds.has(c.dataset.tid))anyTr=true});
    ct.style.opacity=anyTr?'':'0.25';
  });
}

function renderTraceBar(){
  var fi=fieldIndex[sfTraceField];
  if(fi){
    var pc=fi.producers.length,cc=fi.consumers.length;
    return'<div class="sf-trace-bar"><strong>Tracing:</strong> '+fi.name+' <span style="color:var(--text-dim)">('+fi.type+')</span> &mdash; '+pc+' producer'+(pc!==1?'s':'')+', '+cc+' consumer'+(cc!==1?'s':'')+'<span class="sf-trace-close" onclick="sfExitTrace()">&times;</span></div>';
  }
  return'<div class="sf-trace-bar"><strong>Tracing:</strong> '+escHtml(sfTraceField)+' <span style="color:var(--text-dim)">(no connections)</span> &mdash; in '+sfTracedTaskIds.size+' task'+(sfTracedTaskIds.size!==1?'s':'')+'<span class="sf-trace-close" onclick="sfExitTrace()">&times;</span></div>';
}

function sfEnterChildBP(childIdx){
  if(fullProcess)return;
  clearFilters();
  sfViewingChild=true;sfViewingChildIdx=childIdx||0;sfExpandedTaskId=null;
  renderProcessCanvas();renderContextPanel();
}
function sfExitChildBP(){
  clearFilters();
  sfViewingChild=false;sfViewingChildIdx=0;sfExpandedTaskId=null;

}

function renderBreadcrumb(){
  if(!sfViewingChild)return'';

  var cName=cb?cb.name:'Child Blueprint';

function renderContextPanel(){
  var el=document.getElementById('sf-context');if(!el)return;
  if(sfTraceField)el.innerHTML=renderCtxField(sfTraceField);
  else if(sfExpandedTaskId)el.innerHTML=renderCtxTask(sfExpandedTaskId);

function renderCtxSummary(){
  var sList=allStagesList();
  var totalTasks=0,agentCounts={},humanAssignees={},fieldSet=new Set();
  sList.forEach(function(s){s.tasks.forEach(function(t){
    totalTasks++;
    if(t._isChildLink){
      var key=t.agent;
      if(!humanAssignees[key])humanAssignees[key]={count:0,cls:'a-linked',ac:'human'};
      humanAssignees[key].count++;
    }else if(t.agentClass==='human'){
      var key=t.agent;
      if(!humanAssignees[key])humanAssignees[key]={count:0,cls:'a-human'+(t.ht?' ht-'+t.ht:''),ac:'human'};
      humanAssignees[key].count++;
    }else{
      var key=t.agent;
      if(!agentCounts[key])agentCounts[key]={count:0,cls:'a-'+t.agentClass,ac:t.agentClass};
      agentCounts[key].count++;
    }
    t.inputs.forEach(function(i){fieldSet.add(i.n)});
    t.outputs.forEach(function(o){fieldSet.add(o.n)});
  })});
  var cbName=sfViewingChild&&childBlueprints[sfViewingChildIdx]?childBlueprints[sfViewingChildIdx].name:'Child';
  var h='<div class="sf-ctx-section"><h3>'+(fullProcess?'Full Process':(sfViewingChild?escHtml(cbName):'Parent'))+' Blueprint Overview</h3>';
  h+='<div class="sf-ctx-stat"><span>Stages</span><strong>'+sList.length+'</strong></div>';
  h+='<div class="sf-ctx-stat"><span>Tasks</span><strong>'+totalTasks+'</strong></div>';
  h+='<div class="sf-ctx-stat"><span>Unique Fields</span><strong>'+fieldSet.size+'</strong></div>';
  h+='</div>';
  var hKeys=Object.keys(humanAssignees);
  if(hKeys.length){
    h+='<div class="sf-ctx-section"><h4>Assignee Breakdown</h4>';
    hKeys.forEach(function(k){
      var a=humanAssignees[k];
      h+='<div class="sf-ctx-stat filterable" data-agentname="'+escHtml(k)+'" onclick="toggleAgentFilter(\''+k.replace(/'/g,"\\'")+'\')">';
      h+='<span><span class="abadge '+a.cls+'" style="font-size:11px;padding:2px 8px 2px 5px">'+escHtml(k)+'</span></span><strong>'+a.count+'</strong></div>';
    });
    h+='</div>';
  }
  var acKeys=Object.keys(agentCounts);
  if(acKeys.length){
    h+='<div class="sf-ctx-section"><h4>Agent Breakdown</h4>';
    acKeys.forEach(function(ac){
      var a=agentCounts[ac];
      h+='<div class="sf-ctx-stat filterable" data-agentname="'+escHtml(ac)+'" onclick="toggleAgentFilter(\''+ac.replace(/'/g,"\\'")+'\')">';
      h+='<span><span class="abadge '+a.cls+'" style="font-size:11px;padding:2px 8px 2px 5px">'+escHtml(ac)+'</span></span><strong>'+a.count+'</strong></div>';
    });
    h+='</div>';
  }
  h+='<button class="sf-filter-clear'+(FS.agents.size?' vis':'')+'" onclick="clearFilters()">Clear Filters</button>';
  h+='<div class="sf-ctx-section" style="margin-top:16px;font-size:12px;color:var(--text-dim)">Click a task to see its details.<br>Click an agent to filter. Click a field to trace it.</div>';
  return h;
}

function renderCtxTask(taskId){
  var t=taskMap[taskId];if(!t)return'';
  var sid=taskToStage[taskId];
  if(!sid){childStages.forEach(function(s){s.tasks.forEach(function(t){if(t.id===taskId)sid=s.id})})}
  var parentStage=null;
  var sList=allStagesList();
  if(sid){var s=sList.find(function(st){return st.id===sid});if(s){parentStage=s}}
  var sName=parentStage?parentStage.name:'';
  var h='<div class="sf-ctx-section"><h3>Task '+t.id+'</h3>';
  h+='<div style="font-size:15px;font-weight:600;margin-bottom:4px">'+t.name+'</div>';
  h+='<div style="margin-bottom:4px"><span class="abadge '+badgeCls(t)+'">'+t.agent+'</span>';
  if(t.ttype)h+=' <span style="font-size:11px;color:var(--text-dim);margin-left:4px">'+t.ttype+(t.itype?' / '+t.itype:'')+'</span>';
  h+='</div>';
  if(sName)h+='<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Stage '+sid+': '+sName+'</div>';
  h+='</div>';
  // Description
  if(t.desc){
    h+='<div class="sf-ctx-section"><h4>Description</h4>';
    var d=t.desc.length>1000?t.desc.substring(0,1000)+'…':t.desc;
    h+='<div style="font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap">'+escHtml(d)+'</div></div>';
  }
  // Documents
  if(t.docs&&t.docs.length){
    h+='<div class="sf-ctx-section"><h4>Documents ('+t.docs.length+')</h4>';
    t.docs.forEach(function(dn){h+='<div style="font-size:12px;padding:2px 0"><span style="color:var(--accent)">&#128196;</span> '+escHtml(dn)+'</div>'});
    h+='</div>';
  }
  // Stage start condition
  if(parentStage&&parentStage.condition){
    h+='<div class="sf-ctx-section"><h4>Stage Start Condition</h4>';
    h+='<div style="font-size:12px;color:var(--conditional);line-height:1.4">IF: '+escHtml(parentStage.condition)+'</div></div>';
  }
  // Time to complete
  if(t.dueSec){
    h+='<div class="sf-ctx-section"><h4>Time to Complete</h4><div style="font-size:12px;color:var(--text)">';
    var sec=t.dueSec,dd=Math.floor(sec/86400),hh=Math.floor((sec%86400)/3600),mm=Math.floor((sec%3600)/60);
    var parts=[];if(dd)parts.push(dd+'d');if(hh)parts.push(hh+'h');if(mm)parts.push(mm+'m');
    h+=(parts.length?parts.join(' '):'< 1m')+'</div></div>';
  }
  // Task dependencies (explicit deps from parser)
  if(t.deps&&t.deps.length){
    h+='<div class="sf-ctx-section"><h4>Task Prerequisites</h4>';
    t.deps.forEach(function(d){h+='<div style="font-size:12px;padding:2px 0;color:var(--text-dim)">Depends on: '+escHtml(d)+'</div>'});
    h+='</div>';
  }
  // Data dependencies (upstream/downstream)
  var a=adj[taskId];
  if(a&&(a.up.size||a.dn.size)){
    h+='<div class="sf-ctx-section"><h4>Data Dependencies</h4>';
    if(a.up.size){
      h+='<div style="margin-bottom:6px">';
      a.up.forEach(function(u){var tm=taskMap[u];h+='<span class="sf-ctx-tag cons" title="'+(tm?tm.name:'')+'">&#8592; '+u+(tm?': '+tm.name:'')+'</span>'});
      h+='</div>';
    }
    if(a.dn.size){
      h+='<div>';
      a.dn.forEach(function(d){var tm=taskMap[d];h+='<span class="sf-ctx-tag prod" title="'+(tm?tm.name:'')+'">&#8594; '+d+(tm?': '+tm.name:'')+'</span>'});
      h+='</div>';
    }
    h+='</div>';
  }
  // Inputs
  if(t.inputs.length){
    h+='<div class="sf-ctx-section"><h4>Inputs ('+t.inputs.length+')</h4>';
    t.inputs.forEach(function(i){
      h+='<div style="font-size:12px;padding:3px 0"><span style="color:var(--warning-text-muted)">'+i.n+'</span> <span style="color:var(--text-dim)">('+i.t+')</span>';
      if(i.src)h+=' <span style="color:var(--orange);font-size:12px">&larr; '+i.src+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }
  // Outputs
  if(t.outputs.length){
    h+='<div class="sf-ctx-section"><h4>Outputs ('+t.outputs.length+')</h4>';
    t.outputs.forEach(function(o){
      var consumers=[];
      parentEdges.forEach(function(e){if(e.from===t.id&&e.data===o.n)consumers.push(e.to)});
      h+='<div style="font-size:12px;padding:3px 0">'+(o.req?'<span class="req-ast">*</span> ':'')+'<span style="color:var(--green)">'+o.n+'</span> <span style="color:var(--text-dim)">('+o.t+')</span>';
      if(consumers.length)h+=' <span style="color:var(--danger-text-muted);font-size:12px">&rarr; '+consumers.join(', ')+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }
  return h;
}

function renderCtxField(fieldName){
  var fi=fieldIndex[fieldName];
  if(!fi){
    var h='<div class="sf-ctx-section"><h3>Field Trace</h3>';
    h+='<div style="font-size:14px;font-weight:600;margin-bottom:4px;color:var(--accent)">'+escHtml(fieldName)+'</div>';
    h+='<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Not connected to other tasks via data flow</div>';
    h+='</div>';
    h+='<div class="sf-ctx-section"><h4>Appears In ('+sfTracedTaskIds.size+')</h4>';
    sfTracedTaskIds.forEach(function(tid){var tm=taskMap[tid];h+='<span class="sf-ctx-tag prod">'+tid+(tm?': '+tm.name:'')+'</span>'});
