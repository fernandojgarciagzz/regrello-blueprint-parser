    return h;
  }
  var h='<div class="sf-ctx-section"><h3>Field Trace</h3>';
  h+='<div style="font-size:14px;font-weight:600;margin-bottom:4px;color:var(--accent)">'+fi.name+'</div>';
  h+='<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Type: '+fi.type+' &bull; ID: '+fi.id+'</div>';
  h+='</div>';
  // Producers
  if(fi.producers.length){
    h+='<div class="sf-ctx-section"><h4>Produced By ('+fi.producers.length+')</h4>';
    fi.producers.forEach(function(p){
      var tm=taskMap[p.taskId];var bp=p.bp==='child'?' <span style="color:var(--subprocess-text)">[Child]</span>':'';
      h+='<span class="sf-ctx-tag prod">'+p.taskId+(tm?': '+tm.name:'')+bp+'</span>';
    });
    h+='</div>';
  }
  // Consumers
  if(fi.consumers.length){
    h+='<div class="sf-ctx-section"><h4>Consumed By ('+fi.consumers.length+')</h4>';
    fi.consumers.forEach(function(c){
      var tm=taskMap[c.taskId];var bp=c.bp==='child'?' <span style="color:var(--subprocess-text)">[Child]</span>':'';
      h+='<span class="sf-ctx-tag cons">'+c.taskId+(tm?': '+tm.name:'')+bp+'</span>';
    });
    h+='</div>';
  }
  // Journey narrative
  var stageNums=new Set();
  fi.producers.forEach(function(p){stageNums.add(p.bp==='child'?'C'+p.stageId:p.stageId)});
  fi.consumers.forEach(function(c){stageNums.add(c.bp==='child'?'C'+c.stageId:c.stageId)});
  var sArr=[];stageNums.forEach(function(s){sArr.push(s)});
  h+='<div class="sf-ctx-section"><h4>Journey</h4>';
  h+='<div class="sf-ctx-journey">Appears in Stage'+(sArr.length>1?'s ':' ')+sArr.join(', ')+'.<br>';
  h+=fi.producers.length+' producer'+(fi.producers.length!==1?'s':'')+' &rarr; '+fi.consumers.length+' consumer'+(fi.consumers.length!==1?'s':'');
  var hasCross=fi.producers.some(function(p){return p.bp!==fi.producers[0].bp})||fi.consumers.some(function(c){return c.bp!=='parent'});
  if(hasCross)h+='<br><span style="color:var(--subprocess-text)">Crosses blueprint boundary</span>';
  h+='</div></div>';
  return h;
}

function applyDetailedFilters(){
  var q=FS.search;
  // Dim task cards in Process Flow
  document.querySelectorAll('.tcard').forEach(function(c){
    var tid=c.dataset.tid;
    var t=taskMap[tid];
    if(t)c.classList.toggle('dimmed',!isTaskVis(t));
  });
  // Dim stage boxes in process canvas
  var sList=allStagesList();
  var childHasVis=fullProcess&&childStages.some(stageHasVisTasks);
  var linkStageIds={};
  if(fullProcess)stages.forEach(function(s){s.tasks.forEach(function(t){if(t._isChildLink)linkStageIds[s.id]=true})});
  document.querySelectorAll('.sf-stage-box,.sf-gate-box').forEach(function(box){
    var sid=box.dataset.sid;
    var s=sList.find(function(st){return String(st.id)===String(sid)});
    if(!s)return;
    var vis=stageHasVisTasks(s);
    if(!vis&&fullProcess&&linkStageIds[sid]&&childHasVis)vis=true;
    box.classList.toggle('dimmed',!vis);
  });
  // Dim child container when no child tasks match
  document.querySelectorAll('.fp-child-container').forEach(function(ct){
    var anyVis=false;
    childStages.forEach(function(s){if(stageHasVisTasks(s))anyVis=true});
    ct.style.opacity=anyVis?'':'0.25';
  });
  // Field Registry — sync global search into fieldSearch
  var fs=document.getElementById('fieldSearch');
  if(fs){fs.value=q;filterFieldRows()}
  // Agent Prompts — apply global search
  ptFilter();
  // Visual Graph — dim non-matching nodes
  var vgInner=d3.select('#vg-g');
  if(vgGraph&&!vgInner.empty()){
    vgInner.selectAll('.node').each(function(id){
      var nd=vgGraph.node(id);if(!nd||!nd._tid)return;
      var t=taskMap[nd._tid];
      d3.select(this).style('opacity',t&&isTaskVis(t)?1:.15);
    });
  }
}

// ==============================================================
// TAB 2: FIELD REGISTRY
// ==============================================================
var frAllFields=[],frSortKey='usage',frSortAsc=false,frSelTypes=new Set,frMaxU=1;

function renderFieldReg(){
  var fields={};
  function proc(sList,pref){
    sList.forEach(function(s){s.tasks.forEach(function(t){
      t.outputs.forEach(function(o){
        if(!o.id)return;var k=o.id+'_'+o.n;
        if(!fields[k])fields[k]={name:o.n,type:o.t,id:o.id,prod:[],cons:[],req:false,reqTasks:[],optTasks:[]};
        fields[k].prod.push(pref+t.id);
        if(o.req){fields[k].req=true;fields[k].reqTasks.push(pref+t.id)}
        else{fields[k].optTasks.push(pref+t.id)}
      });
      t.inputs.forEach(function(i){
        if(!i.id)return;var k=i.id+'_'+i.n;
        if(!fields[k])fields[k]={name:i.n,type:i.t,id:i.id,prod:[],cons:[],req:false,reqTasks:[],optTasks:[]};
        fields[k].cons.push(pref+t.id);
      });
    })});
  }
  proc(stages,'');if(fullProcess)proc(childStages,'');
  frAllFields=Object.values(fields);
  frMaxU=Math.max.apply(null,frAllFields.map(function(f){return f.prod.length+f.cons.length}))||1;
  frSortKey='usage';frSortAsc=false;frSelTypes.clear();

  var types={};frAllFields.forEach(function(f){types[f.type]=true});
  var typeList=Object.keys(types).sort();

  var h='<input type="hidden" id="fieldSearch">';

  h+='<div class="table-wrap"><table class="ftable"><thead><tr>';
  h+='<th class="sortable sort-active" data-col="name" onclick="frSort(\'name\')">Field Name <span class="sort-arrow">▼</span></th>';
  h+='<th><div class="ms-wrap" style="display:inline"><button class="ms-btn ms-inline" id="ms-btn-ftype" onclick="event.stopPropagation();msToggle(\'ms-panel-ftype\')" style="border:none;background:none;padding:0;font-size:12px;font-weight:600;color:var(--text-dim)">Type <span class="sort-arrow">▾</span></button>';
  h+='<div class="ms-panel ms-fixed" id="ms-panel-ftype">';
  h+='<div class="ms-actions"><button onclick="frTypeAll(true)">Select All</button><button onclick="frTypeAll(false)">Clear</button></div>';
  typeList.forEach(function(t){
    h+='<div class="ms-item"><input type="checkbox" id="ms-ft-'+t+'" onchange="frTypeToggle(\''+t+'\')"><label for="ms-ft-'+t+'"><span class="ftbadge '+(ftClsMap[t]||'ft-text')+'">'+t+'</span></label></div>';
  });
  h+='</div></div></th>';
  h+='<th>ID</th>';
  h+='<th class="sortable" data-col="prod" onclick="frSort(\'prod\')">Produced By <span class="sort-arrow">▼</span></th>';
  h+='<th class="sortable" data-col="cons" onclick="frSort(\'cons\')">Consumed By <span class="sort-arrow">▼</span></th>';
  h+='<th class="sortable sort-active" data-col="usage" onclick="frSort(\'usage\')">Usage <span class="sort-arrow">▼</span></th>';
  h+='<th>Heat</th>';
  h+='</tr></thead><tbody id="fieldBody"></tbody></table></div>';
  document.getElementById('tp-fields').innerHTML=h;
  frRenderRows();
}

function frSort(col){
  if(frSortKey===col)frSortAsc=!frSortAsc;
  else{frSortKey=col;frSortAsc=col==='name'}
  document.querySelectorAll('.ftable th.sortable').forEach(function(th){
    th.classList.toggle('sort-active',th.dataset.col===col);
    th.querySelector('.sort-arrow').textContent=th.dataset.col===col?(frSortAsc?'▲':'▼'):'▼';
  });
  frRenderRows();
}

function frTypeToggle(t){
  if(frSelTypes.has(t))frSelTypes.delete(t);else frSelTypes.add(t);
  frUpdateTypeBtn();frRenderRows();
}
function frTypeAll(sel){
  var panel=document.getElementById('ms-panel-ftype');if(!panel)return;
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=sel});
  frSelTypes.clear();
  if(sel)frAllFields.forEach(function(f){frSelTypes.add(f.type)});
  frUpdateTypeBtn();frRenderRows();
}
function frUpdateTypeBtn(){
  var btn=document.getElementById('ms-btn-ftype');if(!btn)return;
  var arrow=' <span class="sort-arrow">▾</span>';
  btn.innerHTML=frSelTypes.size?'Type <span class="ms-count" style="font-size:10px;background:var(--primary-soft);color:var(--primary-text-muted);padding:1px 5px;border-radius:var(--radius-sm);font-weight:600">'+frSelTypes.size+'</span>'+arrow:'Type'+arrow;
}

function frRenderRows(){
  var tbody=document.getElementById('fieldBody');if(!tbody)return;
  var q=((document.getElementById('fieldSearch')||{}).value||'').toLowerCase().trim();
  var words=q?q.split(/\s+/).filter(function(w){return w.length>0}):[];
  var hasType=frSelTypes.size>0;

  var filtered=frAllFields.filter(function(f){
    if(hasType&&!frSelTypes.has(f.type))return false;
    if(words.length){
      var blob=(f.name+' '+f.type+' '+f.id+' '+f.prod.map(function(p){var tm=taskMap[p];return p+(tm?' '+tm.name:'')}).join(' ')+' '+f.cons.map(function(c){var tm=taskMap[c];return c+(tm?' '+tm.name:'')}).join(' ')).toLowerCase();
      if(!words.every(function(w){return blob.includes(w)}))return false;
    }
    return true;
  });

  filtered.sort(function(a,b){
    var va,vb;
    if(frSortKey==='name'){va=a.name.toLowerCase();vb=b.name.toLowerCase()}
    else if(frSortKey==='prod'){va=a.prod.length;vb=b.prod.length}
    else if(frSortKey==='cons'){va=a.cons.length;vb=b.cons.length}
    else{va=a.prod.length+a.cons.length;vb=b.prod.length+b.cons.length}
    if(va<vb)return frSortAsc?-1:1;if(va>vb)return frSortAsc?1:-1;return 0;
  });

  var h='';
  filtered.forEach(function(f){
    var u=f.prod.length+f.cons.length;
    var heat=Math.ceil((u/frMaxU)*5);
    var heatCol=[cssVar('--surface2'),cssVar('--red'),cssVar('--orange'),cssVar('--warning-text-muted'),cssVar('--green'),cssVar('--accent')][heat]||cssVar('--accent');
    var isChildField=fullProcess&&f.prod.concat(f.cons).length>0&&f.prod.concat(f.cons).every(function(id){return String(id).indexOf('C')===0});
    h+='<tr class="frow'+(isChildField?' child-row':'')+'">';

    h+='<td style="color:var(--text-dim);font-size:12px">'+f.id+'</td>';
    h+='<td>'+f.prod.map(function(p){var tm=taskMap[p];return'<span class="task-chip" onclick="jumpToTask(\''+p+'\')">'+p+(tm?': '+tm.name:'')+'</span>'}).join('')+'</td>';
    h+='<td>'+f.cons.map(function(c){var tm=taskMap[c];return'<span class="task-chip" onclick="jumpToTask(\''+c+'\')">'+c+(tm?': '+tm.name:'')+'</span>'}).join('')+'</td>';
    h+='<td style="text-align:center">'+u+'</td>';
    h+='<td><div class="heat-bar"><div class="heat-fill" style="width:'+(heat*20)+'%;background:'+heatCol+'"></div></div></td>';

  });

}

function escHtml(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var copyIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
var checkIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
var csvIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
var copyAllIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';

var ptAllRows=[];
var ptSortKey='id',ptSortAsc=true;
var ptSelAgents=new Set;

function ptStripHtml(s){return s?s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]*>/g,'').replace(/\n{3,}/g,'\n\n').trim():''}
function ptWordCount(s){var t=ptStripHtml(s);return t?t.split(/\s+/).filter(function(w){return w.length>0}).length:0}
function ptFieldMentions(s){if(!s)return[];var m=s.match(/\[([^\]]+)\]/g);return m?m.map(function(f){return f.slice(1,-1)}):[]}

function ptBuildRows(){
  var rows=[];
  stages.forEach(function(s){s.tasks.forEach(function(t){
    if(t.agentClass==='human')return;
    var tid=t.id,p=taskPrompts[tid]||'',dc=docReaderConfig[tid];
    var plainText=dc?((dc.fields||[]).map(function(f){return f.n+': '+(f.helper||'')}).join('; ')):ptStripHtml(p);
    var fc=t.inputs.length+t.outputs.length;
    rows.push({t:t,stage:s,bp:'parent',tid:tid,ac:t.agentClass||'ai',
      wc:ptWordCount(p||(dc?plainText:'')),fc:fc,
      hasContent:(p.length>0)||!!dc,plainText:plainText})
  })});
  if(fullProcess){
    childStages.forEach(function(s){s.tasks.forEach(function(t){
      if(t.agentClass==='human')return;
      var tid=t.id,p=taskPrompts[tid]||'',dc=docReaderConfig[tid];
      var plainText=dc?((dc.fields||[]).map(function(f){return f.n+': '+(f.helper||'')}).join('; ')):ptStripHtml(p);
      var fc=t.inputs.length+t.outputs.length;
      rows.push({t:t,stage:s,bp:'child',tid:tid,ac:t.agentClass||'ai',
        wc:ptWordCount(p||(dc?plainText:'')),fc:fc,
        hasContent:(p.length>0)||!!dc,plainText:plainText})
    })});
  }
  return rows;
}

function ptSortRows(rows,key,asc){
  return rows.slice().sort(function(a,b){
    var va,vb;
    if(key==='id'){va=a.tid;vb=b.tid}
    else if(key==='agent'){va=a.t.agent.toLowerCase();vb=b.t.agent.toLowerCase()}
    else{va=a.tid;vb=b.tid}
    if(va<vb)return asc?-1:1;if(va>vb)return asc?1:-1;return 0;
  });
}

// Multi-select dropdown logic
function msToggle(id){
  var panel=document.getElementById(id);if(!panel)return;
  var isOpen=panel.classList.toggle('open');
  document.querySelectorAll('.ms-panel.open').forEach(function(p){if(p.id!==id){p.classList.remove('open');p.style.top='';p.style.left=''}});
  if(isOpen&&panel.classList.contains('ms-fixed')){
    var btn=panel.parentElement.querySelector('.ms-btn');
    if(btn){var r=btn.getBoundingClientRect();panel.style.top=(r.bottom+4)+'px';panel.style.left=r.left+'px'}
  }
  if(isOpen){
    var close=function(e){if(!panel.parentElement.contains(e.target)){panel.classList.remove('open');panel.style.top='';panel.style.left='';document.removeEventListener('click',close)}};
    setTimeout(function(){document.addEventListener('click',close)},0);
  }
}
function msSelectAll(id,group){
  var panel=document.getElementById(id);if(!panel)return;
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=true});
  if(group==='stage'){ptSelStages.clear();stages.forEach(function(s){ptSelStages.add(String(s.id))});childStages.forEach(function(s){ptSelStages.add(String(s.id))})}
  else if(group==='agent'){ptSelAgents.clear();['ai','doc','excel','regrello','tabular','flash','human'].forEach(function(a){ptSelAgents.add(a)})}
  msUpdateBtn(group);ptFilter();
}
function msClearAll(id,group){
  var panel=document.getElementById(id);if(!panel)return;
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=false});
  if(group==='stage')ptSelStages.clear();else if(group==='agent')ptSelAgents.clear();
  msUpdateBtn(group);ptFilter();
}
function msToggleItem(val,group){
  var set=group==='stage'?ptSelStages:ptSelAgents;
  if(set.has(val))set.delete(val);else set.add(val);
  msUpdateBtn(group);ptFilter();
}
function msUpdateBtn(group){
  var btn=document.getElementById('ms-btn-'+group);if(!btn)return;
  var set=group==='stage'?ptSelStages:ptSelAgents;
  var label=group==='stage'?'Stages':'Agents';
  var countEl=btn.querySelector('.ms-count');
  if(set.size){if(countEl)countEl.textContent=set.size;else{var sp=document.createElement('span');sp.className='ms-count';sp.textContent=set.size;btn.insertBefore(sp,btn.querySelector('::after'))}}
  else if(countEl)countEl.remove();
  // Rebuild to update count badge cleanly
  var existing=btn.querySelector('.ms-count');
  if(set.size&&!existing){btn.innerHTML=label+' <span class="ms-count">'+set.size+'</span>'}
  else if(set.size&&existing){existing.textContent=set.size}
  else{btn.innerHTML=label}
}

function ptDoSort(){
  var sel=document.getElementById('ptSortSel');if(!sel)return;
  var v=sel.value,parts=v.split('-');
  ptSortKey=parts[0];ptSortAsc=parts[1]==='asc';

function ptGetVisible(){

function ptRenderTable(){
  var tbody=document.getElementById('ptTbody');if(!tbody)return;
  var sorted=ptSortRows(ptAllRows,ptSortKey,ptSortAsc);
  var h='';
  sorted.forEach(function(r){
    var t=r.t,tid=r.tid,ac=r.ac;
    var sLabel=(r.bp==='child'?'':'S')+r.stage.id+': '+r.stage.name;
    h+='<tr'+(r.bp==='child'?' class="child-row"':'')+' data-tid="'+escHtml(String(tid))+'" data-agent="'+ac+'" data-sid="'+r.stage.id+'">';
    h+='<td class="pt-col-id">'+escHtml(String(tid))+'</td>';
    h+='<td class="pt-col-name">'+escHtml(t.name)+'</td>';
    h+='<td class="pt-col-stage">'+escHtml(sLabel)+'</td>';
    h+='<td class="pt-col-agent"><span class="abadge '+badgeCls(t)+'">'+escHtml(t.agent)+'</span></td>';
    var shH='';if(r.t.inputs.length){r.t.inputs.forEach(function(i){shH+='<div class="pt-field-item">'+ftIcon(i.t)+'<span>'+escHtml(i.n)+'</span></div>'})}else{shH='<span class="pt-field-empty">\u2014</span>'}
    h+='<td class="pt-col-fields">'+shH+'</td>';
    var reqH='';if(r.t.outputs.length){r.t.outputs.forEach(function(o){reqH+='<div class="pt-field-item">'+ftIcon(o.t)+'<span>'+escHtml(o.n)+'</span>'+(o.req?'<span class="req-ast">*</span>':'')+'</div>'})}else{reqH='<span class="pt-field-empty">\u2014</span>'}
    h+='<td class="pt-col-fields">'+reqH+'</td>';
    h+='<td class="pt-col-prompt">';
    if(docReaderConfig[tid]) h+=renderDocReaderTable(tid);
    else if(taskPrompts[tid]) h+='<div class="prompt-text">'+taskPrompts[tid]+'</div>';
    else if(ac==='human') h+='<div class="prompt-empty">Human task \u2014 manual action required</div>';
    else if(taskMap[tid]&&taskMap[tid]._isChildLink) h+='<div class="prompt-empty">Linked Workflow \u2014 invokes child blueprint</div>';
    else h+='<div class="prompt-empty">No description available</div>';
    h+='</td>';
    h+='<td class="pt-col-actions">';
    if(r.hasContent) h+='<button class="pt-copy-btn" id="ptc-'+escHtml(String(tid))+'" onclick="ptCopy(\''+escHtml(String(tid))+'\')" title="Copy prompt">'+copyIcon+'</button>';
    h+='</td></tr>';
  });
  tbody.innerHTML=h;
  ptFilter();
}

function renderDocReaderTable(taskId){
  var cfg=docReaderConfig[taskId];if(!cfg)return '';
  var h='';
  if(cfg.form) h+='<div class="dr-form-label">Form: '+escHtml(cfg.form)+'</div>';
  h+='<table class="dr-table"><thead><tr>';
  h+='<th>Field</th><th>Type</th><th>Description</th><th style="text-align:center">Multiple</th><th>Choices</th>';
  h+='</tr></thead><tbody>';
  (cfg.fields||[]).forEach(function(f){
    var mv=f.multi?'Yes':'\u2014';
    var ch=(f.choices&&f.choices.length)?escHtml(f.choices.join(', ')):'\u2014';
    h+='<tr><td>'+escHtml(f.n)+'</td><td>'+escHtml(f.t)+'</td><td style="color:var(--text-dim)">'+escHtml(f.helper||'')+'</td><td style="text-align:center">'+mv+'</td><td>'+ch+'</td></tr>';
  });
  h+='</tbody></table>';
  return h;
}

function ptCopy(tid){
  var text='';
  if(docReaderConfig[tid]){
    var cfg=docReaderConfig[tid],lines=[];
    if(cfg.form)lines.push('Form: '+cfg.form);
    (cfg.fields||[]).forEach(function(f){
      var p=[f.n,f.t];if(f.helper)p.push(f.helper);if(f.multi)p.push('Multiple: Yes');
      if(f.choices&&f.choices.length)p.push('Choices: '+f.choices.join(', '));
      lines.push(p.join(' | '));
    });
    text=lines.join('\n');
  }else if(taskPrompts[tid]){text=ptStripHtml(taskPrompts[tid])}
  if(!text)return;
  var btn=document.getElementById('ptc-'+tid);
  navigator.clipboard.writeText(text).then(function(){
    if(btn){btn.classList.add('copied');btn.textContent='\u2713';
    setTimeout(function(){btn.classList.remove('copied');btn.innerHTML=copyIcon},2000)}
  });
}

function ptCopyAll(){
  var vis=ptGetVisible();
  var lines=[];
  vis.forEach(function(tid){
    var t=taskMap[tid];if(!t)return;
    var text='';
    if(docReaderConfig[tid]){
      var cfg=docReaderConfig[tid],dl=[];
      if(cfg.form)dl.push('Form: '+cfg.form);
      (cfg.fields||[]).forEach(function(f){dl.push(f.n+': '+(f.helper||''))});
      text=dl.join('\n');
    }else if(taskPrompts[tid]){text=ptStripHtml(taskPrompts[tid])}
    if(text)lines.push('--- Task '+tid+': '+t.name+' ---\n'+text);
  });
  if(!lines.length)return;
  navigator.clipboard.writeText(lines.join('\n\n'));
}

function ptExportCSV(){
  var vis=ptGetVisible();
  var csvRows=[['Task ID','Task Name','Stage','Agent','Shared Fields','Requested Fields','Prompt'].map(function(h){return '"'+h+'"'}).join(',')];
  vis.forEach(function(tid){
    var r=ptAllRows.find(function(x){return x.tid===tid});if(!r)return;
    var text=r.plainText||'';
    var sLabel=(r.bp==='child'?'':'S')+r.stage.id+': '+r.stage.name;
    var shFields=r.t.inputs.map(function(i){return i.n+' ('+i.t+')'}).join('; ');
    var reqFields=r.t.outputs.map(function(o){return(o.req?'*':'')+o.n+' ('+o.t+')'}).join('; ');
    var row=[
      '"'+String(tid)+'"',
      '"'+r.t.name.replace(/"/g,'""')+'"',
      '"'+sLabel.replace(/"/g,'""')+'"',
      '"'+r.t.agent.replace(/"/g,'""')+'"',
      '"'+(shFields||'').replace(/"/g,'""')+'"',
      '"'+(reqFields||'').replace(/"/g,'""')+'"',
      '"'+text.replace(/"/g,'""')+'"'
    ];
    csvRows.push(row.join(','));
  });
  var blob=new Blob([csvRows.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='agent_prompts.csv';a.click();
  URL.revokeObjectURL(url);
}

function ptFilter(){
  var q=FS.search.toLowerCase();
  var hasAg=ptSelAgents.size>0;
  var trs=document.querySelectorAll('#ptTbody tr');
  var visCount=0,totalVis=0;
  trs.forEach(function(row){
    var tid=row.getAttribute('data-tid')||'';
    var ac=row.getAttribute('data-agent')||'';
    var t=taskMap[tid];
    var nm=t?(t.name||'').toLowerCase():'';
    var ag=t?(t.agent||'').toLowerCase():'';
    var pt=taskPrompts[tid]?taskPrompts[tid].toLowerCase():'';
    var inps=t?t.inputs.map(function(i){return i.n+' '+i.t}).join(' ').toLowerCase():'';
    var outs=t?t.outputs.map(function(o){return o.n+' '+o.t}).join(' ').toLowerCase():'';
    var blob=tid.toLowerCase()+' '+nm+' '+ag+' '+inps+' '+outs+' '+pt;
    var words=q?q.split(/\s+/).filter(function(w){return w.length>0}):[];
    var matchQ=!words.length||words.every(function(w){return blob.indexOf(w)!==-1});
    var matchAg=!hasAg||ptSelAgents.has(ac);
    var vis=matchQ&&matchAg;
    row.style.display=vis?'':'none';
    if(vis){totalVis++;var r=ptAllRows.find(function(x){return x.tid===tid});if(r&&r.hasContent)visCount++}
  });
  var stats=document.getElementById('ptStats');
  var filtered=q||hasAg;
  if(stats)stats.textContent=visCount+' prompts'+(filtered?' (filtered)':'');
}

function renderVisualGraph(){
  var el=document.getElementById('tp-vgraph');
  el.innerHTML='<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">'

    +'<span class="vg-legend-item"><span class="vg-legend-line task"></span>Task sequence</span>'
    +'<span class="vg-legend-item"><span class="vg-legend-line child"></span>Child blueprint</span>'
    +'<span id="vg-leg-data" class="vg-legend-item" style="display:'+(vgDataFlowOn?'':'none')+'"><span class="vg-legend-line data"></span>Data flow</span>'
    +'</div></div>'
    +'<svg id="vgraph-svg"><defs></defs><g id="vg-g"></g></svg>';

  var g=new dagreD3.graphlib.Graph({compound:true}).setGraph({rankdir:'TB',ranksep:60,nodesep:25,marginx:30,marginy:30}).setDefaultEdgeLabel(function(){return{}});
  var render=new dagreD3.render();

  // Stage clusters
  stages.forEach(function(s){
    if(!s.tasks.length)return;
    g.setNode('cl_'+s.id,{label:'S'+s.id+': '+s.name,clusterLabelPos:'top',
      style:'fill:color-mix(in srgb,var(--surface2) 50%,transparent);stroke:var(--border);rx:8',
      labelStyle:'fill:var(--text-dim);font-size:12px'});
  });

    childStages.forEach(function(s){
      if(!s.tasks.length)return;
      g.setNode('cl_'+s.id,{label:s.id+': '+s.name,clusterLabelPos:'top',
        style:'fill:color-mix(in srgb,var(--agent-pill-text) 6%,transparent);stroke:var(--agent-pill-text);stroke-dasharray:4;rx:8',
        labelStyle:'fill:var(--agent-pill-text);font-size:12px'});
    });
  }

  // Task nodes
  stages.forEach(function(s){s.tasks.forEach(function(t){
    var col=cm(t.agentClass);
    var shortName=t.name.length>28?t.name.substring(0,26)+'…':t.name;
    g.setNode('t_'+t.id,{
      labelType:'html',
      label:'<div style="text-align:center;line-height:1.3"><div style="font-weight:600;font-size:12px">'+t.id+'</div><div style="font-size:12px;color:var(--text-dim);white-space:nowrap">'+shortName+'</div></div>',
      style:'fill:'+col+'22;stroke:'+col,
      shape:'rect',rx:4,ry:4,width:180,height:38,
      _tid:t.id
    });
    g.setParent('t_'+t.id,'cl_'+s.id);
  })});
  if(fullProcess&&childBlueprints.length){
    childStages.forEach(function(s){s.tasks.forEach(function(t){
      var col=cm(t.agentClass);
      var shortName=t.name.length>28?t.name.substring(0,26)+'…':t.name;
      g.setNode('t_'+t.id,{
        labelType:'html',
        label:'<div style="text-align:center;line-height:1.3"><div style="font-weight:600;font-size:12px">'+t.id+'</div><div style="font-size:12px;color:var(--text-dim);white-space:nowrap">'+shortName+'</div></div>',
        style:'fill:'+col+'22;stroke:'+col+';stroke-dasharray:3',
        shape:'rect',rx:4,ry:4,width:180,height:38,
        _tid:t.id
      });
      g.setParent('t_'+t.id,'cl_'+s.id);
    })});
  }

  // --- EDGES ---
  var done={};
  var dimColor=cssVar('--text-dim')||'#888';
  var greenColor=cssVar('--green')||'#22c55e';
  var childColor=cssVar('--agent-pill-text')||'#a855f7';

  // Lookups
  var stageById={};
  stages.forEach(function(s){stageById[s.id]=s});
  if(fullProcess&&childBlueprints.length) childStages.forEach(function(s){stageById[s.id]=s});

  // 1) Stage-sequence edges — INVISIBLE in dagre, used only for vertical layout
  function addLayoutSeqEdges(flowArr){
    flowArr.forEach(function(e){
      var fromS=stageById[e[0]],toS=stageById[e[1]];
      if(!fromS||!toS||!fromS.tasks.length||!toS.tasks.length)return;
      var fromT=fromS.tasks[fromS.tasks.length-1];
      var toT=toS.tasks[0];
      var k=fromT.id+'->'+toT.id;
      if(!done[k]){
        done[k]=true;
        g.setEdge('t_'+fromT.id,'t_'+toT.id,{
          style:'stroke:transparent;stroke-width:0',arrowheadStyle:'fill:transparent',curve:d3.curveBasis,
          _edgeType:'layout',_fields:[]
        });
      }
    });
  }
  addLayoutSeqEdges(stageFlow);
  if(fullProcess&&typeof childFlow!=='undefined'&&childFlow.length){
    addLayoutSeqEdges(childFlow);
  }

  // 2) Task sequence edges — sequential within each stage
  function addTaskSeqEdges(sList){
    sList.forEach(function(s){
      for(var i=0;i<s.tasks.length-1;i++){
        var from=s.tasks[i],to=s.tasks[i+1];
        var k=from.id+'->'+to.id;
        if(done[k])continue;
        done[k]=true;
        g.setEdge('t_'+from.id,'t_'+to.id,{
          style:'stroke:'+dimColor+';stroke-width:1.5;opacity:.6',arrowheadStyle:'fill:'+dimColor,curve:d3.curveBasis,
          _edgeType:'task-seq',_fields:[]
        });
      }
    });
  }
  addTaskSeqEdges(stages);
  if(fullProcess&&childBlueprints.length) addTaskSeqEdges(childStages);

  // 3) Child/grandchild blueprint linkage — dashed purple (recursive)
  function linkChildren(sList){
    sList.forEach(function(s){
      s.tasks.forEach(function(t){
        if(!t._isChildLink||t._childIdx==null||!childBlueprints[t._childIdx])return;
        var cb=childBlueprints[t._childIdx];
        if(cb.stages.length&&cb.stages[0].tasks.length){
          var k=t.id+'->'+cb.stages[0].tasks[0].id;
          if(!done[k]){
            done[k]=true;
            g.setEdge('t_'+t.id,'t_'+cb.stages[0].tasks[0].id,{
              style:'stroke:'+childColor+';stroke-width:2;stroke-dasharray:4 3;opacity:.7',arrowheadStyle:'fill:'+childColor,curve:d3.curveBasis,
              _edgeType:'child',_fields:[]
            });
          }
        }
        linkChildren(cb.stages);
      });
    });
  }
  if(fullProcess&&childBlueprints.length) linkChildren(stages);

  // 4) Data flow edges — only when toggled on
  if(vgDataFlowOn){
    parentEdges.forEach(function(e){
      var k=e.from+'->'+e.to;
      if(done[k])return;done[k]=true;
      var ae=aggTaskEdges[k];
      g.setEdge('t_'+e.from,'t_'+e.to,{
        style:'stroke:'+greenColor+';stroke-width:1.5;opacity:.7',arrowheadStyle:'fill:'+greenColor,curve:d3.curveBasis,
        _edgeType:'data',_fields:ae?ae.fields:[]
      });
    });
  }

  // --- RENDER dagre ---
  var svg=d3.select('#vgraph-svg');
  var inner=svg.select('#vg-g');
  inner.selectAll('*').remove();
  render(inner,g);
  vgGraph=g;

  // 4) Stage-to-stage sequence arrows — drawn manually between cluster boxes
  var seqColor=cssVar('--accent')||'#3b82f6';
  var seqGroup=inner.append('g').attr('class','vg-seq-edges');
  var defs=svg.select('defs');
  defs.select('#vg-arr-seq').remove();
  defs.append('marker').attr('id','vg-arr-seq').attr('viewBox','0 0 10 10')
    .attr('refX',10).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7)
    .attr('orient','auto-start-reverse')
    .append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill',seqColor);

  // Read rendered cluster rects from DOM
  var clusterBoxes={};
  inner.selectAll('.cluster').each(function(clusterId){
    var rect=d3.select(this).select('rect');
    if(!rect.node())return;
    var t=d3.select(this).attr('transform');
    var tx=0,ty=0;
    if(t){var m=t.match(/translate\(\s*([\d.\-e]+)\s*[,\s]\s*([\d.\-e]+)/);if(m){tx=+m[1];ty=+m[2]}}
    var rx=+rect.attr('x'),ry=+rect.attr('y'),rw=+rect.attr('width'),rh=+rect.attr('height');
    var sid=String(clusterId).replace('cl_','');
    clusterBoxes[sid]={cx:tx+rx+rw/2,cy:ty+ry+rh/2,w:rw,h:rh,top:ty+ry,bot:ty+ry+rh};
  });

  function drawSeqEdges(flowArr){
    flowArr.forEach(function(e){
      var fromBox=clusterBoxes[e[0]],toBox=clusterBoxes[e[1]];
      if(!fromBox||!toBox)return;
      var x1=fromBox.cx,y1=fromBox.bot+4;
      var x2=toBox.cx,y2=toBox.top-4;
      var path;
      if(Math.abs(x1-x2)<5){
        path='M'+x1+','+y1+' L'+x2+','+y2;
      }else{
        var my=(y1+y2)/2;
        path='M'+x1+','+y1+' C'+x1+','+my+' '+x2+','+my+' '+x2+','+y2;
      }
      seqGroup.append('path')
        .attr('d',path)
        .attr('fill','none')
        .attr('stroke',seqColor)
        .attr('stroke-width',2.5)
        .attr('opacity',.7)
        .attr('marker-end','url(#vg-arr-seq)')
        .attr('class','vg-seq-path')
        .datum({from:e[0],to:e[1]});
    });
  }
  drawSeqEdges(stageFlow);
  if(fullProcess&&typeof childFlow!=='undefined'&&childFlow.length){
    drawSeqEdges(childFlow);
  }

  // Size SVG to fit the graph
  var gw=g.graph().width||800;
  var gh=g.graph().height||600;
  var svgEl=document.getElementById('vgraph-svg');
  svgEl.style.width=Math.max(gw+80,svgEl.parentElement.clientWidth)+'px';
  svgEl.style.height=(gh+80)+'px';

  // Build vgAdj from dagre edges for highlight
  vgAdj={};
  g.edges().forEach(function(e){
    var src=(e.v||'').replace('t_',''),tgt=(e.w||'').replace('t_','');
    if(!vgAdj[src])vgAdj[src]={up:new Set,dn:new Set};
    if(!vgAdj[tgt])vgAdj[tgt]={up:new Set,dn:new Set};
    vgAdj[src].dn.add(tgt);
    vgAdj[tgt].up.add(src);
  });

  vgZoom=d3.zoom().scaleExtent([.1,3]).on('zoom',function(){inner.attr('transform',d3.event.transform)});
  svg.call(vgZoom);

  // Click handler
  inner.selectAll('.node').on('click',function(id){
    var nd=g.node(id);if(!nd||!nd._tid)return;
    highlightVGNode(nd._tid,inner,g);
    var t=taskMap[nd._tid];if(t)openTaskSP(t);
  });

  // Tooltip on dagre edges
  var tip=d3.select('#tooltip');
  inner.selectAll('.edgePath').on('mouseover',function(e){
    var ed=g.edge(e);if(!ed)return;
    var label='';
    if(ed._edgeType==='data'&&ed._fields&&ed._fields.length) label=ed._fields.join('<br>');
    else if(ed._edgeType==='child') label='Child blueprint';
    if(!label)return;
    tip.html(label).style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px').style('opacity',1);
  }).on('mousemove',function(){tip.style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px')}).on('mouseout',function(){tip.style('opacity',0)});

  // Tooltip on stage seq arrows
  seqGroup.selectAll('.vg-seq-path').on('mouseover',function(){
    var d=d3.select(this).datum();
    tip.html('Stage sequence: '+d.from+' → '+d.to).style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px').style('opacity',1);
  }).on('mousemove',function(){tip.style('left',(d3.event.pageX+12)+'px').style('top',(d3.event.pageY-10)+'px')}).on('mouseout',function(){tip.style('opacity',0)});

  setTimeout(fitVG,100);
}

function highlightVGNode(tid,inner,g){
  var a=vgAdj?vgAdj[tid]:null;
  var up=a?a.up:new Set;
  var dn=a?a.dn:new Set;
  inner.selectAll('.node').each(function(id){
    var nd=g.node(id);if(!nd||!nd._tid)return;
    var nid=nd._tid;
    if(nid===tid)d3.select(this).style('opacity',1).select('rect').style('stroke-width','3');
    else if(up.has(nid))d3.select(this).style('opacity',1).select('rect').style('stroke',cssVar('--primary-text-muted')).style('stroke-width','2');
    else if(dn.has(nid))d3.select(this).style('opacity',1).select('rect').style('stroke',cssVar('--green')).style('stroke-width','2');
    else d3.select(this).style('opacity',.2);
  });
  inner.selectAll('.edgePath').each(function(e){
    var src=(e.v||'').replace('t_',''),tgt=(e.w||'').replace('t_','');
    var related=(src===tid||tgt===tid);
    d3.select(this).style('opacity',related?1:.1);
  });
  inner.selectAll('.vg-seq-path').style('opacity',.1);
}

function fitVG(){
  if(!vgGraph)return;
  var svg=d3.select('#vgraph-svg');
  var gw=vgGraph.graph().width||800,gh=vgGraph.graph().height||600;
  var sw=svg.node().parentElement.clientWidth||800;
  var sh=window.innerHeight-280;
  var sc=Math.min(sw/(gw+60),sh/(gh+60))*.9;
  if(sc>1)sc=1;
  svg.transition().duration(400).call(vgZoom.transform,d3.zoomIdentity.translate((sw-gw*sc)/2,15).scale(sc));
}
function resetVG(){d3.select('#vgraph-svg').transition().duration(300).call(vgZoom.transform,d3.zoomIdentity)}

// ==============================================================
// INIT
// ==============================================================
(function populateTabCounts(){
  var nAgentTasks=0;stages.forEach(function(s){s.tasks.forEach(function(t){if(t.agentClass&&t.agentClass!=='human')nAgentTasks++})});
  if(typeof childStages!=='undefined')childStages.forEach(function(s){s.tasks.forEach(function(t){if(t.agentClass&&t.agentClass!=='human')nAgentTasks++})});
  var el;
  el=document.getElementById('tc-fields');if(el){var nf=0;stages.forEach(function(s){s.tasks.forEach(function(t){t.outputs.forEach(function(o){if(o.id)nf++})})});el.textContent=nf}
  el=document.getElementById('tc-agents');if(el)el.textContent=nAgentTasks;
})();
if(childBlueprints.length){var fpw=document.getElementById('fp-toggle-wrap');if(fpw)fpw.style.display=''}
switchView('detailed');
colorMap=getColorMap();
updateSvgMarkers();
</script>
